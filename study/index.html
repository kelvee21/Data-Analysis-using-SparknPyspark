e must `split` again (see `has()` in\r\n`kpis.py`).\r\n\r\n---\r\n\r\n## 10. `explode`, fan-out and double counting\r\n\r\n**Plain idea.** `F.explode(array)` makes one output row per element. A film\r\nwith 3 genres becomes 3 rows: **fan-out**. That is what you want when\r\ncounting \"films per genre\", but any sum over the exploded rows counts that\r\nfilm more than once.\r\n\r\n**In this project.** Three places explode:\r\n\r\n| Where | Effect |\r\n|---|---|\r\n| `inspect_anomalies(df, [\"genres\"])` | each film counts once per genre: Adventure 15, Action 10, Science Fiction 10 ... the counts add up to more than 18 |\r\n| `plot_roi_by_genre` | Avatar's ROI is in the Action, Adventure and Science Fiction means |\r\n| `top_directors` | Joe Russo and Anthony Russo each get Endgame + Infinity War: 4,994.60 each |\r\n\r\n`test_codirectors_both_get_the_revenue` makes this a deliberate rule:\r\ndirectors A and B of a 200 M film each show 200.\r\n\r\n**Is that right?** For \"how much did films *by this director* make?\", yes:\r\neach co-director directed the whole film. Splitting it 50/50 would say each\r\ndirected half a film. It is wrong to **add up** the director column: the\r\ntop-10 table counts the two Russo films twice and the two Frozen films\r\ntwice (Jennifer Lee and Chris Buck, 2,727.90 each). Rank directors this way;\r\nnever sum the table.\r\n\r\n**Line to say in review.** \"Explode gives each co-director full credit,\r\nwhich is right for a per-director ranking. The column is then not additive:\r\nsumming it double-counts co-directed films.\"\r\n\r\n**Follow-up trap.** \"What if you grouped without exploding?\" → The raw\r\nstrings differ by order: TMDB lists `Joe Russo|Anthony Russo` on Endgame and\r\n`Anthony Russo|Joe Russo` on Infinity War (see the cleaned-movies table in\r\n`results.md`), so they would become two \"directors\" with one film each.\r\n\r\n---\r\n\r\n## 11. A window with no `partitionBy`\r\n\r\n**Plain idea.** A **window function** computes a value for each row from\r\nother rows, without collapsing them (unlike `groupBy`). `row_number()` gives\r\n1, 2, 3 ... in some order. `Window.partitionBy(x)` restarts the numbering\r\nfor each value of `x`, so groups can be done in parallel. With **no**\r\n`partitionBy`, one counter must run over every row, so Spark moves all rows\r\ninto **one** partition, on one executor.\r\n\r\n**In this project.** `reorder_and_reset` builds the spec's \"reset index\":\r\n\r\n```python\r\nidx = F.row_number().over(Window.orderBy(\"id\")) - 1\r\nreturn df.select(idx.alias(\"idx\"), *FINAL_COLUMNS)\r\n```\r\n\r\n`- 1` makes it 0-based like pandas. The docstring and the README both admit\r\nthe cost: \"pulls every row into one partition to number them. ok for 18\r\nmovies; on a big table i would drop idx and just use id as the key.\" Spark\r\nlogs a warning about it (\"No Partition Defined for Window operation!\").\r\n`test_idx_starts_at_zero` checks ids 30, 10, 20 get idx 0, 1, 2.\r\n\r\n**Line to say in review.** \"Spark rows have no index, so 'reset index' is a\r\n`row_number` over a fixed order. Without `partitionBy` it runs on one\r\npartition: fine for 18 rows, a bottleneck at scale, where I would key on\r\n`id` instead.\"\r\n\r\n**Follow-up trap.** \"Why order by id and not the fetch order?\" → Spark does\r\nnot keep a guaranteed row order, so \"original order\" is not stable. `id` is\r\nunique and always there, so `idx` is the same on every run. The cost: `idx\r\n0` is Titanic (id 597), not Endgame, the first real ID in the spec list.\r\n\r\n---\r\n\r\n## 12. `toPandas()` and `collect()`: the driver-memory risk\r\n\r\n**Plain idea.** Both copy rows from the executors to the driver: `collect()`\r\ngives a list of `Row` objects, `toPandas()` a pandas DataFrame. The driver is\r\none process with limited memory. On a big table this crashes it with an\r\nout-of-memory error, and you lose Spark's parallelism. **Arrow** (a columnar\r\nin-memory format) makes `toPandas()` faster, but not smaller.\r\n\r\n**In this project.** Every transfer is small, and the README lists it as a\r\nchoice: \"only small results go to the driver.\"\r\n\r\n| Call | Rows to the driver |\r\n|---|---|\r\n| `md_table`: `df.limit(max_rows).collect()` | at most 50 |\r\n| `plot_revenue_vs_budget`, `plot_popularity_vs_rating` | 18 (the only whole-column `toPandas()`) |\r\n| `plot_roi_by_genre` after `groupBy` | 11 |\r\n| `plot_yearly_box_office` after `groupBy` | 9 |\r\n| `plot_distribution`: bucket counts | at most 20 |\r\n| `plot_boxplot`: quartiles, whisker ends, outliers | a handful |\r\n\r\n`spark_session.py` enables Arrow with a fallback:\r\n`spark.sql.execution.arrow.pyspark.enabled` and\r\n`...arrow.pyspark.fallback.enabled` both `true`.\r\n\r\n**Line to say in review.** \"I reduce first, then bring data to the driver:\r\n`limit` before `collect`, `groupBy` before `toPandas`, histogram buckets and\r\nquartiles computed in Spark. Only the two scatter plots send one row per\r\nfilm.\"\r\n\r\n**Follow-up trap.** \"And with a million films?\" → Sample the scatter plots\r\n(`df.sample(fraction=0.01)`), as the `visualize.py` docstring says. Everything\r\nelse already scales: the histogram sends 20 numbers whatever the table size.\r\n\r\n---\r\n\r\n## 13. `percentile_approx` vs an exact median\r\n\r\n**Plain idea.** An exact median needs all values sorted, which on big data\r\nmeans a full shuffle. `percentile_approx(col, p)` uses a compact summary\r\nand returns a value close to the true one. It always returns **one of the\r\nactual values**: it never averages or interpolates between two.\r\n\r\n**In this project.** Two places:\r\n\r\n1. `franchise_vs_standalone`: `F.percentile_approx(\"roi\", 0.5)` as\r\n   `median_roi`. The comment: \"roi is a median: one huge film moves the mean\r\n   and not the median. percentile_approx because an exact median needs a full\r\n   sort.\"\r\n2. `plot_distribution` (the median line) and `plot_boxplot` (Q1, median, Q3).\r\n\r\nThe effect on a tiny group: the standalone group is 2 films, Titanic (ROI\r\n11.32, in the top-ROI table) and Beauty and the Beast. `results.md` shows\r\n`median_roi` 7.91 for the group. The textbook median of two values is their\r\naverage; `percentile_approx` returns the lower one, so 7.91 is Beauty and the\r\nBeast's ROI, and the exact median would be (7.91 + 11.32) / 2 ≈ 9.62.\r\n\r\nThe same difference moves boxplot fences: pandas interpolates quartiles,\r\nSpark picks real values, so on 18 rows the fences differ. The notebook notes\r\nthat Avatar and Endgame are inside the Spark high fence (3,129) while the\r\npandas version flagged them as outliers.\r\n\r\n**Line to say in review.** \"`percentile_approx` scales and returns a real\r\nvalue. On tiny groups that shows: the standalone 'median' is the lower of two\r\nfilms. On a small group I would use `F.median`; at scale the approximation is\r\nthe right tool.\"\r\n\r\n**Follow-up trap.** \"Does it change your conclusion?\" → No, because there is\r\nno conclusion to draw from 2 films either way.\r\n\r\n---\r\n\r\n## 14. Data checks that stop the run: `validate()`\r\n\r\n**Plain idea.** A pipeline that writes wrong numbers quietly is worse than\r\none that stops. A **data check** is a rule that must hold before anyone\r\nreads a number (no duplicate ids, values in range). Run it after cleaning and\r\n**raise** if it fails, so nothing downstream is written.\r\n\r\n**In this project.** `cleaning.validate`:\r\n\r\n```python\r\nchecks = df.agg(\r\n    F.count(\"*\").alias(\"rows\"),\r\n    F.count_distinct(\"id\").alias(\"distinct_ids\"),\r\n    F.count_if(F.col(\"title\").isNull()).alias(\"null_titles\"),\r\n    F.count_if(F.col(\"budget_musd\") \u003c= 0).alias(\"bad_budget\"),\r\n    F.count_if(F.col(\"revenue_musd\") \u003c= 0).alias(\"bad_revenue\"),\r\n    F.count_if((F.col(\"vote_average\") \u003c 0) | (F.col(\"vote_average\") > 10)).alias(\"bad_rating\"),\r\n).first()\r\n```\r\n\r\nAll six checks in **one** aggregation, so one pass over the data instead of\r\none `count()` per rule. It raises `ValueError(\"data checks failed: ...\")`;\r\n`main()` catches it, logs it and exits with code 1 before any Parquet,\r\nresults or chart is written. Tests: `test_validate_passes_on_good_data`,\r\n`test_validate_stops_on_empty_table`. On this data: \"data checks passed\".\r\n\r\n**Line to say in review.** \"`validate` runs six rules in a single\r\naggregation and raises if any fails, so a bad run never writes a Parquet or\r\ncharts.\"\r\n\r\n**Follow-up trap.** \"Why `count_if(budget \u003c= 0)` if zeros are already null?\"\r\n→ It is a guard on the cleaning itself: if a later change broke\r\n`clean_unrealistic_values`, the check would catch it. Null budgets are not\r\ncounted, because `null \u003c= 0` is null.\r\n\r\n---\r\n\r\n## 15. When Spark is overkill, and why we still use it\r\n\r\n**Plain idea.** Spark is built for data too big for one machine. It pays a\r\nfixed cost per job: starting a JVM, planning, scheduling tasks, moving data\r\nbetween Java and Python. For small data that cost is most of the run time.\r\n\r\n**In this project.**\r\n- The data is **18 rows**.\r\n- `python -m src.main` takes 39 to 83 seconds on this laptop, nearly all\r\n  Spark start-up and per-action overhead, and the 32 tests take almost ten\r\n  minutes (timings in\r\n  [15 · Review-day runbook](15-review-day-runbook.md)).\r\n- `tmdb_client.py` already makes the call: \"19 http calls do not need a\r\n  cluster\", so Step 1 is plain Python.\r\n- The final report says it plainly: \"pandas would be faster here.\"\r\n\r\n**Why still Spark.** The lab is about learning PySpark, and the code is\r\nwritten as it would have to be for a real table: schema on read, built-ins\r\ninstead of UDFs, cache and unpersist, small results to the driver, data\r\nchecks, config from environment variables. The one place that would not\r\nscale (the window with no `partitionBy`) is named in the code and README.\r\n\r\n**Line to say in review.** \"For 18 rows pandas would be faster; Spark's\r\nstart-up dominates. I used Spark because that is the lab, and wrote it the\r\nway I would for big data.\"\r\n\r\n**Follow-up trap.** \"At what size would you switch to Spark for real?\" →\r\nWhen the data no longer fits comfortably in one machine's memory, roughly\r\ntens of GB, or when it already lives on a Spark platform. Below that,\r\npandas, Polars or DuckDB are simpler and faster.\r\n\r\n---\r\n\r\n## Self-check\r\n\r\n1. Which call fills the cache of `df_movies`, and why is `df_raw` unpersisted right after?\r\n2. What does PERMISSIVE mode do with a line that is not valid JSON?\r\n3. Why does `results.md` show 7.91 as the standalone median ROI?\r\n4. Joe Russo shows 4,994.60 total revenue. Is it wrong that Anthony Russo shows the same?\r\n5. Why does `validate` use one `agg` instead of one `count()` per rule?\r\n\r\nAnswers: (1) `cleaning.validate(df_movies)`, its first action; after that\r\nnothing reads `df_raw`, so its memory is freed. (2) Keeps the row with null\r\nfields and puts the raw text in `_corrupt_record`; the code then counts and\r\ndrops it. (3) `percentile_approx` returns an actual value, the lower of the\r\ntwo films, instead of averaging them. (4) No, both directed both films; it is\r\nonly wrong to add the two together. (5) One pass over the data instead of\r\nsix.\r\n\r\nNext: [12 · Code-review defense](12-code-review-defense.md)\r\n","study/12-code-review-defense.md":"# 12 — Defending This Project in Code Review\n\nThe review will probe three things: do you understand **why** the code is\nwritten this way, can you back it with **numbers** from `reports/results.md`,\nand do you know the **weak spots**. Below are likely questions with short\nmodel answers tied to this repo's files and functions.\n\n> **Help:** if a reviewer points at a concept (\"why cache?\", \"what is a shuffle?\"), the long answer is in [11 · Hard concepts](11-hard-concepts-explained.md). If they point at a function, see [14 · PySpark function reference](14-pyspark-function-reference.md). Line-by-line code is in [06 · Cleaning](06-cleaning-line-by-line.md) and [08 · KPIs](08-kpis-line-by-line.md).\n\n## The opening (60 seconds)\n\n> \"`src/tmdb_client.py` fetches the 19 IDs in plain Python, keeps the 18 that\n> exist, and saves the raw answers as JSON Lines. Spark reads that file with\n> a schema I wrote, flattens the nested JSON, fixes types and placeholder\n> values, checks the result with `validate()`, and writes a 25-column Parquet\n> table. On top of it, `kpis.py` builds ten best/worst lists with one `rank`\n> function, two searches, a franchise comparison and franchise and director\n> tables, and `visualize.py` draws eight charts with the counting done in\n> Spark. `python -m src.main` runs it all, `analysis.ipynb` runs the same\n> functions step by step, and 32 pytest tests cover each rule on fake rows.\"\n\n## Numbers to know by heart (all from `results.md`)\n\n| Fact | Value |\n|---|---|\n| IDs requested / movies read | 19 / 18 (ID 0 → 404, skipped); 0 unreadable lines |\n| Rows / columns after cleaning | 18 / 25 (22 spec + `idx`, `profit_musd`, `roi`) |\n| Nulls after cleaning | only `belongs_to_collection`: 2 |\n| Highest revenue | Avengers: Endgame, 2,942.19 |\n| Highest profit | Avatar, 2,686.71 |\n| Lowest profit | Star Wars: The Last Jedi, 1,034.41 |\n| Highest / lowest ROI | Avatar 12.34 / Star Wars: The Last Jedi 4.45 |\n| Most voted | The Avengers, 40259 votes |\n| Highest rated | Endgame and Infinity War, 8.25 |\n| Most popular | Endgame, 64.93 |\n| Search 1 / Search 2 | 0 matches / 0 matches |\n| Franchise vs standalone | 16 vs 2 films; mean revenue 1,691.70 vs 1,765.10 |\n| Top franchise | The Avengers Collection, 4 films, 7,918.80 |\n| Top director | James Cameron, 2 films, 5,187.90 |\n\nMoney is in million USD.\n\n## Step 1 — Fetching (`src/tmdb_client.py`)\n\n**Q1: Why is the fetch plain Python and not Spark?**\nA: It is 19 small HTTP calls. Spark would only add start-up cost. The module\ndocstring: \"19 http calls do not need a cluster. spark starts at step 2 when\nit reads the file this writes.\"\n\n**Q2: How do you get cast and director without a second call per film?**\nA: `params={\"append_to_response\": \"credits\"}` in `fetch_movie`. TMDB adds\ncast and crew to the movie answer, so one call per film. The credits are\nkept raw and flattened in Spark, \"so i can redo it without calling the api\nagain.\"\n\n**Q3: What happens with ID 0?**\nA: TMDB returns 404, `fetch_movie` logs \"not found, skip it\" and returns\n`None`, and `fetch_all` keeps only non-`None` results: 18 lines.\n`test_404_is_skipped` covers it.\n\n**Q4: What if the network fails or TMDB is busy?**\nA: Statuses 429, 500, 502, 503, 504 and connection errors are retried up to\n3 times with exponential back-off, `time.sleep(2 ** attempt)`: 2, 4, 8 s.\nThen it logs and skips the film. A 401 (bad key) is not retried:\n`raise_for_status()` stops the program. Tests: `test_429_then_ok_retries`,\n`test_gives_up_after_three_tries`, using a fake session and a patched\n`time.sleep`.\n\n**Q5: Where is the API key, and could it leak?**\nA: In `.env`, read with `load_dotenv()`. `.env` is git-ignored. The key goes\nin `session.params`, \"so it is never part of a url i log.\" If it is missing,\n`fetch_all` exits with a message saying how to fix it.\n\n**Q6: Why JSON Lines, and why the temp file?**\nA: One object per line lets Spark split and read the file in parallel; a\nsingle JSON array can only be read as one piece. `save_jsonl` writes to a\n`.tmp` file and then `os.replace`s it, so a crash halfway never leaves Spark\na half-written file. `test_save_jsonl_one_movie_per_line` checks no `.tmp`\nis left.\n\n## Step 2 — Cleaning (`src/cleaning.py`)\n\n**Q7: Walk me through `clean()`.**\nA: Twelve steps chained with `.transform`, in spec order:\n`drop_corrupt_rows`, `drop_irrelevant_columns`, `extract_collection_name`,\n`pipe_join_names` four times (genres, spoken languages, countries,\ncompanies), `extract_credits`, `convert_dtypes`, `clean_unrealistic_values`,\n`filter_released_and_dedup`, `reorder_and_reset`. Each takes a DataFrame and\nreturns a new one, so each is testable alone.\n\n**Q8: Why write `RAW_SCHEMA` instead of letting Spark infer it?**\nA: Inference reads the file once just to guess types; the guess can change\nwith the data (an all-empty cast list was guessed as `array\u003cstring>` and\nbroke `cast.name` in an earlier version); unlisted fields are skipped, so new\nAPI fields cannot break the code. Plain fields are strings on purpose and get\ntyped by `try_cast`.\n\n**Q9: What happens to a broken line in the raw file?**\nA: PERMISSIVE mode puts its text in `_corrupt_record` instead of failing the\nread. `main.py` counts those lines (\"0 unreadable lines\" here) and\n`drop_corrupt_rows` removes them. `test_broken_json_line_is_dropped` covers\nit.\n\n**Q10: How do you turn `genres` into \"Action|Adventure\"?**\nA: `pipe_join_names(df, \"genres\", \"name\")`: `F.col(\"genres.name\")` pulls the\nname of every struct in the array, `F.concat_ws(\"|\", ...)` joins them, and\n`F.when(joined != \"\", joined)` turns an empty result into null.\n`spoken_languages` uses `english_name`.\n\n**Q11: How do you find the director?**\nA: In `extract_credits`, `F.filter(\"credits.crew\", lambda c: c[\"job\"] ==\n\"Director\")` keeps crew entries whose job is Director, and `concat_ws` joins\nall their names. So Frozen is `Jennifer Lee|Chris Buck`, not just the first.\n`test_two_directors_both_kept` checks it.\n\n**Q12: Why `try_cast` and not `.cast()`?**\nA: Spark 4 is in ANSI mode: a plain cast of a bad value fails the whole job.\n`try_cast` and `try_to_timestamp` return null, like `pd.to_numeric(...,\nerrors=\"coerce\")`. `test_bad_values_become_null_not_a_crash` feeds \"not a\ndate\" and \"lots\".\n\n**Q13: Budget 0: why null and not \"infer from similar movies\"?**\nA: The spec allows either. Null is honest; an invented budget would put\nmade-up numbers into ROI. Null also means `avg` skips the row and ROI is\nnull, not a divide-by-zero error. In this data no film had a zero, so nothing\nchanged.\n\n**Q14: What did you do with `vote_count = 0`?**\nA: TMDB shows 0.0 when nobody voted, which is not a rating, so\n`vote_average` becomes null. `test_no_votes_means_no_rating`.\n\n**Q15: What did `inspect_anomalies` show?**\nA: Nothing to fix, which itself describes the sample: `original_language`\nis `en` for all 18, every film lists the United States as a production\ncountry (the UK on 2), English is spoken in all 18. The genre counts add up\nto more than 18 because a film counts once per genre (Adventure 15, Action\n10, Science Fiction 10).\n\n**Q16: Which duplicate survives `dropDuplicates`?**\nA: One per id, not a fixed one. The code says so: \"which one is not fixed in\nspark, fine here because a repeat is the same api answer twice.\" If copies\ncould differ I would rank them by a fetch time and keep the newest.\n\n**Q17: How did you \"reset the index\"?**\nA: Spark has no index, so `reorder_and_reset` adds `idx = row_number() over\n(order by id) - 1`: 0-based and continuous. Ordered by `id` because Spark\nkeeps no reliable original order, so `idx 0` is Titanic (id 597). The window\nhas no `partitionBy`, so all rows go to one partition: fine for 18, named in\nthe docstring as the one thing that would not scale.\n\n**Q18: What does `validate()` check, and why raise?**\nA: Rows > 0, unique ids, no null titles, budget and revenue > 0, rating in\n0–10, all in one `agg`. It raises so `main()` stops before writing any\nParquet, results or charts. Tests: `test_validate_passes_on_good_data`,\n`test_validate_stops_on_empty_table`.\n\n**Q19: 25 columns, but the spec lists 22?**\nA: `reorder_and_reset` gives exactly `idx` + the 22 spec columns in order\n(`test_columns_come_out_in_brief_order`). `add_profit_roi` then adds\n`profit_musd` and `roi`, computed once before the cache instead of in every\nranking.\n\n## Step 3 — KPIs (`src/kpis.py`)\n\n**Q20: The spec asks for a UDF for ranking. Where is it?**\nA: `rank(df, col, n=5, ascending=False, where=None)` is the reusable function\nbehind all 10 lists in `rankings()`. It is plain Spark column code on\npurpose. `roi_udf` is a real `@F.udf`, kept so the notebook can compare;\n`test_udf_gives_same_roi_as_builtin` shows the same values, and the notebook\nplan shows `ArrowEvalPython`, the step where rows go to Python and back.\n\n**Q21: What does `rank` do with nulls and ties?**\nA: It drops rows where the column is null, so a film with no budget never\ntops \"low roi\" (an ascending sort puts nulls first). Ties are broken by\n`title`: Endgame and Infinity War, both 8.25, always come out in the same\norder.\n\n**Q22: Why `budget_musd >= 10` and not `>= 10_000_000`?**\nA: Money is in millions after `clean_unrealistic_values`.\n`ROI_MIN_BUDGET_MUSD = 10.0` and `MIN_VOTES = 10` are named constants.\nEvery film here passes both; `test_rank_skips_nulls_and_uses_threshold`\nshows the threshold excluding a 5 M film.\n\n**Q23: Both searches return 0 rows. Is the code broken?**\nA: No. None of the 18 IDs stars Bruce Willis or is a Tarantino film.\n`test_willis_search` and `test_tarantino_search_shortest_first` build\nmatching films and show the searches find and sort them.\n\n**Q24: Why `has()` instead of `F.col(\"cast\").contains(\"Bruce Willis\")`?**\nA: `contains` is a substring test and would match \"Bruce Willis Jr\". `has()`\nsplits the pipe string and uses `array_contains`, which matches whole items.\n`test_has_matches_whole_names_only`.\n\n**Q25: How do you define franchise vs standalone?**\nA: `belongs_to_collection` not null → `\"franchise\"`, else `\"standalone\"`,\nin a column called `group`. One `groupBy(\"group\").agg(...)` computes all six\ncolumns. 16 vs 2 films; the standalones are Titanic and Beauty and the\nBeast.\n\n**Q26: What does \"most successful franchise\" mean?**\nA: Highest `total_revenue`, ties broken by `mean_rating`, with film count,\ntotal and mean budget and revenue shown as the spec lists. The Avengers\nCollection: 4 films, 7,918.80. `test_top_franchises_sums_revenue`.\n\n**Q27: Joe and Anthony Russo both show 4,994.60. Double counting?**\nA: `top_directors` explodes the director string so each co-director gets\nfull credit, which is right for a per-director ranking\n(`test_codirectors_both_get_the_revenue`). The column is not additive:\nsumming it would count Endgame twice.\n\n**Q28: Is your median ROI exact?**\nA: No. `percentile_approx` returns one of the real values and never\naverages two. For the 2 standalone films it shows 7.91, the lower film's\nROI; the exact median would be the average of 7.91 and 11.32 (Titanic),\nabout 9.62.\n\n## Step 4 — Charts (`src/visualize.py`)\n\n**Q29: How do you get Spark data into Matplotlib?**\nA: Spark selects, groups or buckets first; only the small result goes to the\ndriver with `toPandas()` or `collect()`. The two scatter plots are the only\nones that send one row per film (18).\n\n**Q30: How is the histogram built without `ax.hist`?**\nA: `plot_distribution` gets min, max and median in one `agg`, computes a\nbucket number per row with `floor((x - lo) / width)`, clamps the maximum\ninto the last bucket with `least`, and counts per bucket with `groupBy`. At\nmost 20 numbers come back, whatever the table size.\n\n**Q31: Your runtime boxplot: how, and why might it differ from pandas?**\nA: `plot_boxplot` gets Q1, median and Q3 from one `percentile_approx`,\ncomputes the fences, the whisker ends and the outliers in Spark, and draws\nwith `ax.bxp`. `percentile_approx` picks real values while pandas\ninterpolates, so on 18 rows the fences move: the notebook notes Avatar and\nEndgame are inside the Spark fence but were outliers in the pandas version.\n\n**Q32: What do the charts tell you?**\nA: Every film is far above break-even (survivorship bias); the genre bars\nwith the highest ROI rest on 1–4 films; popularity rises with rating, driven\nby the Avengers films; the yearly line follows which films are in the list;\nfranchise vs standalone is 16 vs 2; revenue is right-skewed; Titanic (194\nmin) is the one runtime outlier.\n\n**Q33: Why `matplotlib.use(\"Agg\")` inside `main()`?**\nA: Agg draws to files with no window. Setting it at import time would turn\noff inline charts in the notebook, which imports the same modules.\n\n## Code quality\n\n**Q34: How is the code organised?**\nA: Flat `src/` package mirroring the pandas version: `spark_session.py`\n(one SparkSession for script, notebook and tests), `tmdb_client.py` (Step 1),\n`cleaning.py` (Step 2), `kpis.py` (Step 3), `visualize.py` (Step 4),\n`main.py` (glue). Constants live next to the code that uses them\n(`MOVIE_IDS`, `DROP_COLUMNS`, `FINAL_COLUMNS`, `ROI_MIN_BUDGET_MUSD`).\n\n**Q35: What makes it efficient?**\nA: Schema on read (no inference pass); built-ins instead of Python UDFs;\n`cache()` on reused tables and `unpersist()` after; 4 shuffle partitions\nwith AQE on; reduce before `toPandas`; histograms and quartiles in Spark;\n`validate` as one aggregation; one API call per film; Arrow for\n`toPandas`; `coalesce(1)` Parquet output.\n\n**Q36: What is configurable without code changes?**\nA: From `.env` or environment variables: `TMDB_API_KEY`, `TMDB_BASE_URL`,\n`SPARK_MASTER` (default `local[*]`), `SPARK_SHUFFLE_PARTITIONS` (default 4),\n`SPARK_LOG_LEVEL` (default WARN). The same code could point at a cluster.\n\n**Q37: What happens if a step fails?**\nA: `main()` wraps `run()` in `try / except / finally`: the error is logged\nwith its stack trace, the script exits with code 1, `results.md` is not\nwritten, and `spark.stop()` in `finally` always releases the JVM.\n\n**Q38: How do the tests avoid the network and the raw file?**\nA: `tests/helpers.py` builds fake TMDB records (`movie(**changes)`) and reads\nthem through the real `RAW_SCHEMA` (`raw_df`). The client tests use a fake\nsession and patch `time.sleep`. 32 tests, no network.\n\n## Git\n\n**Q39: How did you structure your commits?**\nA: One commit per lab step: skeleton, Step 1 client + tests, Step 2 cleaning\n+ tests, Step 3 KPIs + tests, Step 4 charts + `main.py`, then notebook,\nreport and README. See\n[10 · Pipeline and tests](10-pipeline-and-tests.md#h-part-3-git-commit-plan).\n\n**Q40: What is not in git, and why?**\nA: `.env` (the key), all of `data/` except `data/README.md` (rebuilt by the\ncode), `__pycache__/`, `.pytest_cache/`, `.ipynb_checkpoints/`,\n`spark-warehouse/`, `metastore_db/`, `derby.log`, `*.crc`.\n\n## Weak spots to admit honestly\n\nSay these before the reviewer finds them. Each has a fix ready.\n\n| Weak spot | What to say | Fix |\n|---|---|---|\n| Small, biased sample | \"18 English-language US blockbusters, lowest ROI 4.45. Nothing generalises to films in general.\" | A random or full sample of TMDB films |\n| Both searches empty | \"The required searches return 0 rows on these IDs; tests on fake films prove they work.\" | Nothing in code; the data has no match |\n| Standalone = 2 films | \"The franchise comparison is 16 vs 2; the standalone mean is Titanic plus Beauty and the Beast.\" | More data, or show the two films as a list |\n| Approximate median | \"`percentile_approx` shows 7.91 for standalone; the exact median of the two films is about 9.62.\" | `F.median` on small groups |\n| Boxplot fences differ from pandas | \"Spark quartiles are real values, pandas interpolates, so outliers can differ on 18 rows.\" | State the quartile method on the chart |\n| Reset-index ordering | \"`idx` follows `id`, not the spec's list order, so `idx 0` is Titanic; and the window has no `partitionBy`.\" | Save a fetch-position column in Step 1, or drop `idx` at scale |\n| Raw data not in git | \"`data/` is ignored, so a fresh clone needs an API key to reproduce.\" | Commit the 18-line raw file, or document the fetch date (the report does) |\n| Director credit not additive | \"Co-directors each get full revenue; never sum the director table.\" | Documented in the code comment and a test |\n| No inflation adjustment | \"1997 Titanic is compared with 2019 Endgame in nominal dollars.\" | Adjust with a CPI table |\n| Popularity is a snapshot | \"TMDB popularity is today's activity; it changes daily.\" | Use votes or revenue for 'success' |\n| Back-off sleeps after the last try | \"`fetch_movie` waits 8 s after the third failure before giving up.\" | Skip the sleep on the final attempt |\n| Line chart over gappy years | \"Chart 4 draws a line across 1998–2008, where there are no films.\" | Markers only, or bars |\n\n## Self-check\n\n1. Why does `rank` drop nulls before sorting?\n2. Which two tests prove the searches work, given the real data has 0 matches?\n3. What does PERMISSIVE mode do, and how many lines did it catch here?\n4. Name four things that make the code efficient.\n5. Which weak spot would you mention first, and why?\n\nAnswers: (1) An ascending sort puts nulls first, so a film with no budget\nwould top \"low roi\". (2) `test_willis_search` and\n`test_tarantino_search_shortest_first`. (3) Puts a broken line's text in\n`_corrupt_record` instead of failing; 0 here. (4) Any four of: schema on\nread, built-ins not UDFs, cache/unpersist, 4 shuffle partitions + AQE,\nreduce before `toPandas`, Spark-side histogram and quartiles, one-pass\n`validate`, Arrow, one call per film. (5) The small biased sample: every\nconclusion depends on it.\n\nNext: [13 · Glossary and practice](13-glossary-and-practice.md)\n","study/13-glossary-and-practice.md":"# 13 — Glossary, Practice Questions and Hands-on Drills\n\nUse this page last, as a rehearsal. Cover the answers, say yours out loud,\nthen compare. Part C has drills to type into a PySpark shell on the Parquet\nfile the pipeline writes, with the real output.\n\n> **Help:** this glossary covers concepts. Every PySpark function used in the code is in [14 · PySpark function reference](14-pyspark-function-reference.md). Longer explanations are in [11 · Hard concepts](11-hard-concepts-explained.md).\n\n## A. Glossary (one line each)\n\n| Term | Meaning |\n|---|---|\n| **Spark** | An engine that processes data in parallel, on one machine or a cluster |\n| **PySpark** | The Python interface to Spark; your Python builds plans that the JVM runs |\n| **JVM** | Java Virtual Machine; Spark's engine runs in it, which is why Java 17 is needed |\n| **SparkSession** | The entry point to Spark; `get_spark()` builds the one everything shares |\n| **Driver** | The process that runs your script, plans the work, and receives `collect()` results |\n| **Executor** | A worker process (here: threads on this laptop) that runs tasks on partitions |\n| **`local[*]`** | Run Spark on this machine, one worker thread per CPU core; set by `SPARK_MASTER` |\n| **Partition** | One chunk of a DataFrame; one task processes one partition |\n| **Task / stage / job** | Work on one partition / tasks with no shuffle between them / everything one action triggers |\n| **Spark UI** | Web page showing jobs and stages, at port 4040 (or 4041 if 4040 is taken) |\n| **DataFrame** | A table with named, typed columns, split into partitions; never changed in place |\n| **Row** | One record from `collect()` or `first()`; read fields as `row.title` or `row[\"count\"]` |\n| **Column expression** | A description of a computation, e.g. `F.col(\"revenue_musd\") / F.col(\"budget_musd\")` |\n| **Schema** | Column names and types of a DataFrame |\n| **Schema inference** | Spark guessing the schema by reading the data; not used here |\n| **Schema on read / `RAW_SCHEMA`** | Giving Spark the schema when reading; `cleaning.RAW_SCHEMA` |\n| **StructType / StructField** | A schema written out by hand / one column in it |\n| **Struct** | A column with named sub-fields, e.g. `belongs_to_collection.name` |\n| **Array** | A column holding a list, e.g. `genres` before flattening |\n| **PERMISSIVE mode** | Read mode that keeps a malformed line as a row of nulls instead of failing |\n| **`_corrupt_record`** | The column that receives the raw text of a malformed line |\n| **Transformation** | Lazy operation returning a new DataFrame (`filter`, `select`, `withColumn`) |\n| **Action** | Operation that returns data or writes, and triggers a job (`count`, `collect`, `write`) |\n| **Lazy evaluation** | Nothing runs until an action; Spark builds a plan first |\n| **Plan / `explain()`** | The steps Spark will run / the method that prints them |\n| **Catalyst** | Spark's optimiser: rewrites the plan (prunes columns, pushes filters) |\n| **Shuffle** | Moving rows between partitions so equal keys meet; the most expensive operation |\n| **`spark.sql.shuffle.partitions`** | Partitions after a shuffle; default 200, 4 here (`SPARK_SHUFFLE_PARTITIONS`) |\n| **AQE** | Adaptive Query Execution: merges small shuffle partitions at run time; on here |\n| **`cache()` / `unpersist()`** | Keep a computed DataFrame in memory for reuse / release it |\n| **`coalesce(n)`** | Merge partitions down to n without a shuffle; `coalesce(1)` before the Parquet write |\n| **Narrow / wide transformation** | Needs no shuffle (`filter`) / needs one (`groupBy`, `orderBy`) |\n| **UDF** | User-defined function; a Python UDF runs row by row in a Python worker |\n| **pandas UDF** | A UDF that works on Arrow batches; faster than a plain Python UDF |\n| **`ArrowEvalPython`** | The plan step where rows go from the JVM to Python for a UDF |\n| **Built-in function** | A function in `pyspark.sql.functions`; runs in the JVM |\n| **Higher-order function** | Takes a function as input, e.g. `F.filter(array, lambda c: ...)` |\n| **ANSI mode** | Strict SQL rules: bad casts and divide-by-zero raise errors; on by default in Spark 4 |\n| **`try_cast`** | A cast that returns null instead of failing |\n| **Null** | \"Unknown\"; skipped by `avg`/`sum`; comparisons with it give null |\n| **`explode`** | One output row per array element |\n| **Fan-out** | Row multiplication from `explode` or a join; risks double counting |\n| **Additive** | Can be summed across rows without double counting |\n| **Window function** | Computes per row from other rows without collapsing them (`row_number`) |\n| **`partitionBy` (window)** | Restarts the window per group; without it all rows go to one partition |\n| **Aggregation** | Many rows to one per group: `groupBy(...).agg(...)` |\n| **`percentile_approx`** | Approximate percentile; returns an actual value, never interpolates |\n| **Quartiles / IQR / fences** | 25 % and 75 % points / their distance / Q1 − 1.5 IQR and Q3 + 1.5 IQR, beyond which a value is an outlier |\n| **Histogram bucket** | One equal-width range of values; `plot_distribution` counts per bucket in Spark |\n| **`ax.bxp`** | Matplotlib boxplot drawn from pre-computed numbers |\n| **Data check / `validate()`** | Rules that must hold after cleaning; raises to stop the run |\n| **Parquet** | Column-based file format that stores the schema and compresses well |\n| **JSON Lines** | One JSON object per line; Spark can split and read it in parallel |\n| **`toPandas()`** | Copies all rows to the driver as a pandas DataFrame |\n| **Arrow / PyArrow** | Columnar memory format / its Python library; speeds up `toPandas()` |\n| **Driver OOM** | The driver running out of memory, usually from `collect`/`toPandas` on big data |\n| **winutils / `HADOOP_HOME`** | Windows helper binaries Spark needs to write files; missing → `NativeIO$Windows` error |\n| **Agg backend** | Matplotlib renderer that writes files and opens no window |\n| **Survivorship bias** | Conclusions drawn only from cases that passed a filter (here: blockbusters) |\n| **ROI** | Return on investment: `revenue / budget` in this lab |\n| **`python -m src.main`** | Run `main.py` as a module of the `src` package, from the lab folder |\n| **Fixture (pytest)** | A function that prepares something a test needs; requested by parameter name |\n| **`conftest.py`** | pytest file whose fixtures every test in the folder can use |\n| **`monkeypatch`** | Built-in pytest fixture that swaps something out for one test (here `time.sleep`) |\n| **Factory** | A function that builds test data, e.g. `movie(**changes)` in `tests/helpers.py` |\n| **Exponential back-off** | Waiting longer after each failed retry: 2, 4, 8 s in `fetch_movie` |\n| **`append_to_response`** | TMDB parameter that adds credits to the movie answer in one call |\n\n## B. Practice questions (with model answers)\n\n**1. How many films are in the clean table, and why not 19?**\n18. ID 0 does not exist on TMDB; the fetch got a 404 and skipped it. No\ncleaning rule removed any of the other 18.\n\n**2. Which file reads the raw data, and with what options?**\n`cleaning.load_raw`: `spark.read.schema(RAW_SCHEMA)`, `mode` PERMISSIVE,\n`columnNameOfCorruptRecord` `_corrupt_record`, then `.json(path)`.\n\n**3. Why is `revenue_musd` 2,942.19 for Endgame and not 2942186933?**\n`clean_unrealistic_values` divides by 1,000,000 to get million USD.\n\n**4. What does `F.when(F.col(\"budget\") > 0, F.col(\"budget\"))` return for budget 0?**\nNull. There is no `otherwise()`, so non-matching rows get null.\n\n**5. Which action fills the cache of `df_movies` in `main.py`?**\n`cleaning.validate(df_movies)`, the first action on it.\n\n**6. Why `orderBy(order, \"title\")` in `rank`?**\nTo break ties the same way every run (Endgame and Infinity War both 8.25).\n\n**7. Why `r\"\\|\"` in `F.split`?**\n`split` takes a regular expression; a bare `|` means \"or\".\n\n**8. What is the most successful franchise and by what measure?**\nThe Avengers Collection: highest `total_revenue`, 7,918.80 from 4 films.\n\n**9. What does `percentile_approx` return as the median of 7.91 and 11.32?**\n7.91, one of the actual values. The exact median is their average, about\n9.62.\n\n**10. What error would a plain `CAST('abc' AS DOUBLE)` give in Spark 4?**\n`CAST_INVALID_INPUT`, because ANSI mode is on.\n\n**11. What is `idx` for Titanic and why?**\n0. The index is `row_number()` ordered by `id`, and Titanic's id (597) is the\nsmallest.\n\n**12. What would `validate()` do if every film had status \"Rumored\"?**\nThe released filter would leave 0 rows, and `validate` would raise\n`ValueError(\"data checks failed: no rows left after cleaning\")`.\n\n**13. Where would writing Parquet fail on Windows, and with what?**\n`df_movies.coalesce(1).write...parquet(...)` without winutils/`HADOOP_HOME`\nfails with `UnsatisfiedLinkError ... NativeIO$Windows`.\n\n**14. Why does the runtime boxplot have exactly one outlier circle?**\nTitanic (194 min) is the only runtime beyond the high fence.\n\n**15. How many films are standalone, and which?**\n2: Titanic and Beauty and the Beast.\n\n## C. Hands-on drills\n\nThese run on the Parquet file `python -m src.main` writes. Open PowerShell in\nthe lab folder:\n\n```powershell\n$env:HADOOP_HOME=\"C:\\Users\\User\\hadoop\"; $env:PATH=\"C:\\Users\\User\\hadoop\\bin;\"+$env:PATH\npython\n```\n\nThen, in Python (reusing the project's own session builder):\n\n```python\nfrom pyspark.sql import functions as F\nfrom pyspark.sql.window import Window\nfrom src.spark_session import get_spark\nspark = get_spark(\"drills\")\nspark.sparkContext.setLogLevel(\"ERROR\")      # hide the WARN lines while practising\ndf = spark.read.parquet(\"data/movies_clean.parquet\")\ndf.count(), len(df.columns)                  # (18, 25)\ndf.printSchema()\n```\n\n`printSchema()` shows the types Parquet kept: `idx: integer`, `id: long`,\n`release_date: date`, `budget_musd: double`, `cast_size: integer`,\n`vote_count: long`, `profit_musd: double`, `roi: double`, and so on. Try each\ndrill before reading the solution. All outputs below were produced on this\nlaptop.\n\n### Drill 1 — Top 3 films by runtime\n\n```python\ndf.orderBy(F.desc(\"runtime\")).select(\"title\", \"runtime\").show(3, truncate=False)\n```\n\n```text\n+-----------------+-------+\n|title            |runtime|\n+-----------------+-------+\n|Titanic          |194.0  |\n|Avengers: Endgame|181.0  |\n|Avatar           |162.0  |\n+-----------------+-------+\nonly showing top 3 rows\n```\n\n`show(n)` is an action that prints the first n rows. `truncate=False` stops it\ncutting long text at 20 characters. Titanic is the outlier in chart 7.\n\n### Drill 2 — Count films per release year\n\n```python\ndf.groupBy(F.year(\"release_date\").alias(\"year\")).count().orderBy(\"year\").show()\n```\n\n```text\n+----+-----+\n|year|count|\n+----+-----+\n|1997|    1|\n|2009|    1|\n|2011|    1|\n|2012|    1|\n|2013|    1|\n|2015|    4|\n|2017|    2|\n|2018|    4|\n|2019|    3|\n+----+-----+\n```\n\nThis is why chart 4 is not a trend: most years hold one film.\n\n### Drill 3 — Average rating per original language\n\n```python\n(df.groupBy(\"original_language\")\n   .agg(F.round(F.avg(\"vote_average\"), 2).alias(\"avg_rating\"),\n        F.count(\"*\").alias(\"movies\"))\n   .show())\n```\n\n```text\n+-----------------+----------+------+\n|original_language|avg_rating|movies|\n+-----------------+----------+------+\n|               en|       7.4|    18|\n+-----------------+----------+------+\n```\n\nOne group: every film is English-language. A one-row answer is still a\nfinding about the sample.\n\n### Drill 4 — Add a `profit_margin` column\n\nProfit margin = profit / revenue: the share of revenue that is profit.\n\n```python\n(df.withColumn(\"profit_margin\", F.round(F.col(\"profit_musd\") / F.col(\"revenue_musd\"), 3))\n   .orderBy(F.desc(\"profit_margin\"))\n   .select(\"title\", \"profit_musd\", \"revenue_musd\", \"profit_margin\")\n   .show(5, truncate=False))\n```\n\n```text\n+--------------------------------------------+-----------+------------+-------------+\n|title                                       |profit_musd|revenue_musd|profit_margin|\n+--------------------------------------------+-----------+------------+-------------+\n|Avatar                                      |2686.706026|2923.706026 |0.919        |\n|Titanic                                     |2064.162353|2264.162353 |0.912        |\n|Jurassic World                              |1521.537444|1671.537444 |0.91         |\n|Harry Potter and the Deathly Hallows: Part 2|1216.511219|1341.511219 |0.907        |\n|Frozen II                                   |1303.683476|1453.683476 |0.897        |\n+--------------------------------------------+-----------+------------+-------------+\nonly showing top 5 rows\n```\n\nSame top 5 as \"top roi\" in `results.md`, because margin = 1 − 1/ROI: the two\nalways sort the same way.\n\n### Drill 5 — Films per genre (explode)\n\n```python\n(df.withColumn(\"genre\", F.explode(F.split(\"genres\", r\"\\|\")))\n   .groupBy(\"genre\").count()\n   .orderBy(F.desc(\"count\"), \"genre\")\n   .show(5))\n```\n\n```text\n+---------------+-----+\n|          genre|count|\n+---------------+-----+\n|      Adventure|   15|\n|         Action|   10|\n|Science Fiction|   10|\n|         Family|    5|\n|      Animation|    4|\n+---------------+-----+\nonly showing top 5 rows\n```\n\nMatches the genres value counts in `results.md`.\n\n### Drill 6 — Films with a budget of 250 M or more\n\n```python\n(df.filter(F.col(\"budget_musd\") >= 250)\n   .select(\"title\", \"budget_musd\")\n   .orderBy(F.desc(\"budget_musd\"))\n   .show(truncate=False))\n```\n\n```text\n+------------------------+-----------+\n|title                   |budget_musd|\n+------------------------+-----------+\n|Avengers: Endgame       |356.0      |\n|Star Wars: The Last Jedi|300.0      |\n|Avengers: Infinity War  |300.0      |\n|The Lion King           |260.0      |\n+------------------------+-----------+\n```\n\nThe two 300 M films are tied and their order is not guaranteed (the \"top\nbudget\" table in `results.md` has them the other way round, because `rank`\nsorts ties by title). Add `\"title\"` as a second sort key to fix it.\n\n### Drill 7 — The standalone films\n\n```python\n(df.filter(F.col(\"belongs_to_collection\").isNull())\n   .select(\"title\", \"budget_musd\", \"revenue_musd\", \"roi\")\n   .show(truncate=False))\n```\n\n```text\n+--------------------+-----------+------------+-----------------+\n|title               |budget_musd|revenue_musd|roi              |\n+--------------------+-----------+------------+-----------------+\n|Titanic             |200.0      |2264.162353 |11.320811765     |\n|Beauty and the Beast|160.0      |1266.115964 |7.913224775000001|\n+--------------------+-----------+------------+-----------------+\n```\n\nTest for null with `isNull()`, never `== None`: a comparison with null gives\nnull, so the filter would keep nothing. Note Beauty and the Beast's ROI, 7.91:\nit is the standalone `median_roi` in `results.md`.\n\n### Drill 8 — Top film per year (window with `partitionBy`)\n\n```python\nw = Window.partitionBy(F.year(\"release_date\")).orderBy(F.desc(\"revenue_musd\"))\n(df.withColumn(\"rank_in_year\", F.row_number().over(w))\n   .filter(\"rank_in_year = 1\")\n   .select(F.year(\"release_date\").alias(\"year\"), \"title\", \"revenue_musd\")\n   .orderBy(\"year\")\n   .show(truncate=False))\n```\n\n```text\n+----+--------------------------------------------+------------+\n|year|title                                       |revenue_musd|\n+----+--------------------------------------------+------------+\n|1997|Titanic                                     |2264.162353 |\n|2009|Avatar                                      |2923.706026 |\n|2011|Harry Potter and the Deathly Hallows: Part 2|1341.511219 |\n|2012|The Avengers                                |1518.815515 |\n|2013|Frozen                                      |1274.219009 |\n|2015|Star Wars: The Force Awakens                |2068.223624 |\n|2017|Star Wars: The Last Jedi                    |1334.407706 |\n|2018|Avengers: Infinity War                      |2052.415039 |\n|2019|Avengers: Endgame                           |2942.186933 |\n+----+--------------------------------------------+------------+\n```\n\nUnlike `reorder_and_reset`, this window has a `partitionBy`, so each year\ncan be numbered in parallel and no single-partition warning appears.\n\n### Drill 9 — Exact vs approximate median ROI\n\n```python\ndf.select(F.median(\"roi\").alias(\"exact_median\"),\n          F.percentile_approx(\"roi\", 0.5).alias(\"approx\")).show()\n```\n\n```text\n+-----------------+-----------------+\n|     exact_median|           approx|\n+-----------------+-----------------+\n|7.944507124342106|7.913224775000001|\n+-----------------+-----------------+\n```\n\nWith 18 values (an even count), the exact median averages the 9th and 10th;\n`percentile_approx` returns the 9th. Repeat it grouped by franchise and\nstandalone to see the gap grow on the 2-film group.\n\n### Drill 10 — Spark SQL: directors with more than one film (and a trap)\n\n```python\ndf.createOrReplaceTempView(\"movies\")\nspark.sql(\"\"\"\n    SELECT director, COUNT(*) AS n FROM movies\n    GROUP BY director HAVING n > 1 ORDER BY n DESC, director\n\"\"\").show(truncate=False)\n```\n\n```text\n+-----------------------+---+\n|director               |n  |\n+-----------------------+---+\n|James Cameron          |2  |\n|Jennifer Lee|Chris Buck|2  |\n|Joss Whedon            |2  |\n+-----------------------+---+\n```\n\nThe Russo brothers are missing. TMDB lists them as `Joe Russo|Anthony Russo`\non Endgame and `Anthony Russo|Joe Russo` on Infinity War, so the raw strings\ndiffer and each group has one film. That is why `top_directors` explodes the\nstring first. Exercise: rewrite the query with `explode(split(director,\n'\\\\|'))` and check both Russos show 2 films.\n\n### Drill 11 — A broken line and PERMISSIVE mode\n\n```python\nfrom src.cleaning import RAW_SCHEMA\nlines = ['{\"id\": \"1\", \"title\": \"Good\"}', '{\"id\": 2, \"title\": ']\nbad = (spark.read.schema(RAW_SCHEMA)\n       .option(\"mode\", \"PERMISSIVE\")\n       .option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")\n       .json(spark.sparkContext.parallelize(lines)))\nbad.select(\"id\", \"title\", \"_corrupt_record\").show(truncate=False)\n```\n\n```text\n+----+-----+-------------------+\n|id  |title|_corrupt_record    |\n+----+-----+-------------------+\n|1   |Good |NULL               |\n|NULL|NULL |{\"id\": 2, \"title\": |\n+----+-----+-------------------+\n```\n\nThe first line reads normally with `_corrupt_record` null. The second has\nnull `id` and `title`, and its raw text in `_corrupt_record`. This is exactly\nwhat `drop_corrupt_rows` removes. Change the mode to `\"FAILFAST\"` and run\n`.count()`: the read now fails with a `Py4JJavaError` on the bad line.\n\nWhen finished: `spark.stop()`.\n\n## Self-check\n\n1. In Drill 7, why `isNull()` and not `== None`?\n2. Why do Drill 4 (margin) and the ROI ranking give the same top 5?\n3. What is wrong with grouping on the raw `director` string?\n4. Drill 6 has a tie. How do you make the order stable?\n\nAnswers: (1) Any comparison with null gives null, and `filter` drops null\nconditions, so `== None` keeps no rows. (2) Margin = 1 − 1/ROI rises whenever\nROI rises. (3) Co-directors listed in a different order become different\ngroups; explode first. (4) Add a second sort key, e.g.\n`orderBy(F.desc(\"budget_musd\"), \"title\")`.\n\nNext: [14 · PySpark function reference](14-pyspark-function-reference.md)\n","study/14-pyspark-function-reference.md":"# 14 — PySpark Function Reference (A–Z)\r\n\r\n> Every PySpark function, method and class used in `src/`, `tests/` and\r\n> `analysis.ipynb`, each with the form used here, what it does, the line from\r\n> this project, and a gotcha. Use your browser's find (Ctrl+F) to jump to a\r\n> name. A pandas → PySpark table is at the end.\r\n>\r\n> Imports used in the code: `from pyspark.sql import functions as F`,\r\n> `from pyspark.sql import types as T`, `from pyspark.sql.window import Window`.\r\n> So `F.col` is `pyspark.sql.functions.col`, and so on.\r\n>\r\n> Pages: [05 DataFrames](05-dataframe-fundamentals.md) ·\r\n> [06 Cleaning](06-cleaning-line-by-line.md) ·\r\n> [07 Aggregations](07-aggregations-windows-sorting.md) ·\r\n> [08 KPIs](08-kpis-line-by-line.md) · [09 Charts](09-visualisation.md) ·\r\n> [11 Hard concepts](11-hard-concepts-explained.md)\r\n\r\n**Kinds:** *T* = transformation (lazy, returns a DataFrame); *A* = action\r\n(runs a job); *C* = builds a column expression; *S* = session/reader/schema.\r\n\r\n---\r\n\r\n## Operators on columns\r\n\r\n| Operator | Meaning | Line from this project | Gotcha |\r\n|---|---|---|---|\r\n| `&` | AND of two conditions | `has(\"genres\", \"Science Fiction\") & has(\"genres\", \"Action\") & has(\"cast\", \"Bruce Willis\")` | Use `&`, not `and`; wrap each comparison in brackets: `(a > 1) & (b \u003c 2)` |\r\n| `\\|` | OR | `(F.col(\"vote_average\") \u003c 0) \\| (F.col(\"vote_average\") > 10)` | Same: not `or`, and brackets matter because `\\|` binds tighter than `\u003c` |\r\n| `~` | NOT | `~F.trim(F.col(col)).isin(PLACEHOLDERS)` | `~` of null is null, so a null text stays null (which is the goal here) |\r\n| `>`, `\u003c=`, `==`, `!=` | comparisons, give a boolean column | `F.col(col) > 0`, `joined != \"\"` | Comparing with null gives null, not False |\r\n| `-`, `/` | arithmetic on columns | `F.col(\"revenue_musd\") - F.col(\"budget_musd\")` | Under ANSI, `/ 0` raises `DIVIDE_BY_ZERO`; dividing by null gives null |\r\n| `col[...]` | field of a struct, or field of every struct in an array | `F.filter(...)[\"name\"]`, `c[\"job\"]` | Works on `array\u003cstruct>`; on `array\u003cstring>` Spark wants an integer index |\r\n\r\n## A\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.agg` | T | `df.agg(expr, ...)` / `groupBy(...).agg(...)` | computes aggregates over the whole table or per group | `df.agg(F.count(\"*\").alias(\"rows\"), F.count_distinct(\"id\")...)` in `validate` | Without `groupBy` it returns exactly one row |\r\n| `Column.alias` | C | `expr.alias(\"name\")` | names the result column | `F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\")` | Without it the column gets a long auto name like `round(sum(revenue_musd), 1)` |\r\n| `F.array_contains` | C | `F.array_contains(array_col, value)` | true if the array holds `value` as a whole element | `F.array_contains(F.split(F.col(col), r\"\\|\"), value)` in `has` | Exact match: \"Bruce Willis Jr\" ≠ \"Bruce Willis\" |\r\n| `T.ArrayType` | S | `T.ArrayType(element_type)` | schema type for a list | `T.ArrayType(T.StructType(fields))` in `_named` | The element type must be given; that is the point of an explicit schema |\r\n| `Column.asc` | C | `F.col(c).asc()` | ascending sort order | `order = F.col(col).asc() if ascending else F.col(col).desc()` | Nulls come **first** in ascending order; `rank` drops them before sorting |\r\n| `Row.asDict` | — | `row.asDict()` | a `Row` as a Python dict | `return checks.asDict()` in `validate` | Nested `Row`s stay `Row`s unless `recursive=True` |\r\n| `F.avg` | C | `F.avg(col)` | mean, skipping nulls | `F.round(F.avg(\"revenue_musd\"), 1).alias(\"mean_revenue\")` | Nulls are skipped, so the divisor is the count of non-null values |\r\n\r\n## B\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `Column.between` | C | `col.between(lo, hi)` | `lo \u003c= col \u003c= hi` | `F.col(column).between(low_fence, high_fence)` in `plot_boxplot` | Both ends inclusive |\r\n| `SparkSession.builder` | S | `SparkSession.builder.appName(...).master(...).config(...).getOrCreate()` | configures and creates the session | `spark_session.get_spark` | `getOrCreate` reuses a running session, and some settings (master) cannot change once it exists |\r\n\r\n## C\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.cache` | T | `df.cache()` | keep the result in memory after the first action | `df_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()` | Lazy: nothing is stored until an action runs (`validate` here) |\r\n| `Column.cast` | C | `col.cast(\"int\")` | change type | `F.least(F.floor(...), F.lit(bins - 1)).cast(\"int\")` | Under ANSI a bad cast raises; safe here because the value is already a number |\r\n| `F.coalesce` | C | `F.coalesce(a, b)` | first non-null of its arguments | `F.coalesce(F.size(\"credits.cast\"), F.lit(0))` | Different from `DataFrame.coalesce` (partitions) |\r\n| `DataFrame.coalesce` | T | `df.coalesce(1)` | reduce the number of partitions without a shuffle | `df_movies.coalesce(1).write.mode(\"overwrite\").parquet(...)` | One partition means one task: fine for 18 rows, slow for big writes |\r\n| `F.col` | C | `F.col(\"name\")`, `F.col(\"struct.field\")` | refers to a column; dot reaches into structs | `F.col(\"belongs_to_collection.name\")` | A name with a dot inside it would need backticks |\r\n| `DataFrame.collect` | A | `df.collect()` | all rows to the driver as a list of `Row` | `rows = df.limit(max_rows).collect()` in `md_table` | Risky on big data; `limit` first |\r\n| `DataFrame.columns` | — | `df.columns` | list of column names (no job) | `len(df_movies.columns)` → 25 | A property, no brackets |\r\n| `F.concat_ws` | C | `F.concat_ws(sep, array_or_cols)` | joins strings with a separator, skipping nulls | `F.concat_ws(\"\\|\", F.col(f\"{column}.{name_key}\"))` | Empty or null array gives `\"\"`, not null; hence the `F.when(joined != \"\", joined)` |\r\n| `T.StructType` / `T.StructField` | S | `T.StructType([T.StructField(\"id\", T.StringType()), ...])` | a hand-written schema / one field of it | `RAW_SCHEMA` in `cleaning.py` | Fields not listed are skipped when reading JSON |\r\n| `DataFrame.count` | A | `df.count()` | number of rows | `bad = df_raw.filter(F.col(\"_corrupt_record\").isNotNull()).count()` | Every call is a job; cache before counting repeatedly |\r\n| `F.count` | C | `F.count(\"*\")`, `F.count(col)` | rows per group / non-null values | `F.count(\"*\").alias(\"movies\")` | `count(\"*\")` counts nulls; `count(col)` does not |\r\n| `F.count_if` | C | `F.count_if(condition)` | number of rows where the condition is true | `F.count_if(F.col(\"title\").isNull()).alias(\"null_titles\")` | Null conditions are not counted |\r\n| `F.count_distinct` | C | `F.count_distinct(col)` | number of distinct non-null values | `F.count_distinct(\"id\").alias(\"distinct_ids\")` | Exact, so it shuffles; `approx_count_distinct` is the cheap version |\r\n| `DataFrame.createOrReplaceTempView` | S | `df.createOrReplaceTempView(\"movies\")` | lets `spark.sql` query the DataFrame by name | Drill 10 in [13](13-glossary-and-practice.md) (not in `src/`) | The view lives only in this session |\r\n\r\n## D\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `Column.desc` / `F.desc` | C | `F.col(c).desc()` / `F.desc(\"count\")` | descending sort order | `.orderBy(F.desc(\"count\"), col)` in `inspect_anomalies` | Nulls come **last** in descending order |\r\n| `T.DoubleType` / `LongType` / `StringType` | S | `T.DoubleType()` | schema types | `@F.udf(returnType=T.DoubleType())` | Note the brackets: the type is an instance |\r\n| `DataFrame.drop` | T | `df.drop(*names)` | remove columns | `df.drop(*DROP_COLUMNS)` | Silently ignores names that are not there |\r\n| `DataFrame.dropDuplicates` | T | `df.dropDuplicates([\"id\"])` | one row per id | `filter_released_and_dedup` | Which duplicate survives is not defined; shuffles |\r\n| `DataFrame.dropna` | T | `df.dropna(subset=[...])`, `df.dropna(thresh=10)` | drop rows with nulls in given columns / with fewer than `thresh` non-nulls | `.dropna(subset=[\"id\", \"title\"]).dropna(thresh=10)` | `thresh` counts non-null values across **all** columns |\r\n\r\n## E\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `Column.eqNullSafe` | C | `a.eqNullSafe(b)` | equality where null == null is true | notebook: `~F.col(\"roi\").eqNullSafe(F.col(\"roi_from_udf\"))` | Plain `==` would say null rows \"differ\" by giving null |\r\n| `DataFrame.explain` | — | `df.explain()` | prints the physical plan | notebook: `df_cleaned.explain()`, `both.explain()` | Read bottom up; `InMemoryTableScan` means the data came from the cache |\r\n| `F.explode` | C | `F.explode(array_col)` | one row per array element | `F.explode(F.split(\"director\", r\"\\|\"))` in `top_directors` | Rows with a null or empty array disappear |\r\n| `F.expr` | C | `F.expr(\"sql text\")` | a SQL expression as a column | `F.expr(\"try_cast(budget AS DOUBLE)\")` | Errors in the SQL text show up only when the plan is analysed |\r\n\r\n## F\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.filter` | T | `df.filter(condition)` or `df.filter(\"sql\")` | keep rows where the condition is true | `df.filter(F.col(\"status\") == \"Released\")` | Rows where the condition is null are dropped too |\r\n| `F.filter` | C | `F.filter(array_col, lambda x: ...)` | keep array elements matching a condition (higher-order function) | `F.filter(\"credits.crew\", lambda c: c[\"job\"] == \"Director\")` | The lambda is turned into a Spark expression; ordinary Python code inside it will not work |\r\n| `DataFrame.first` | A | `df.first()` | the first row as a `Row` (or `None`) | `df.agg(...).first()` | \"First\" is only meaningful after `orderBy` |\r\n| `F.floor` | C | `F.floor(x)` | round down | `F.floor((F.col(column) - lo) / width)` | Returns a long; cast if you need int |\r\n\r\n## G\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `SparkSession.builder.getOrCreate` | S | `.getOrCreate()` | create the session or return the running one | `get_spark` | The notebook, tests and `main` each call `get_spark`, but within one process they share one session |\r\n| `DataFrame.groupBy` | T | `df.groupBy(col_or_expr).agg(...)` / `.count()` | groups rows; follow with an aggregate | `df.withColumn(\"group\", group).groupBy(\"group\").agg(...)` | Shuffles; output has `shuffle.partitions` partitions (AQE may merge) |\r\n\r\n## I\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `Column.isin` | C | `col.isin(list)` | true if the value is in the list | `F.trim(F.col(col)).isin(PLACEHOLDERS)` | Null is not \"in\" anything: gives null |\r\n| `Column.isNull` / `isNotNull` | C | `F.col(c).isNull()` | null test | `df.filter(F.col(col).isNotNull())` in `rank` | Never test with `== None` |\r\n\r\n## L\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `F.least` | C | `F.least(a, b)` | the smaller value | `F.least(F.floor(...), F.lit(bins - 1))` | Skips nulls; returns null only if all are null |\r\n| `DataFrame.limit` | T | `df.limit(n)` | at most n rows | `.limit(n)` in `rank`; `df.limit(max_rows)` in `md_table` | Without `orderBy` first, *which* n rows is not defined |\r\n| `F.lit` | C | `F.lit(value)` | a constant as a column | `F.lit(0)`, `F.lit(bins - 1)` | Needed where a function wants a column, not a Python value |\r\n\r\n## M\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `F.max` / `F.min` | C | `F.max(col)` | largest / smallest value, skipping nulls | `F.min(column).alias(\"lo\")` in `plot_distribution` | Both null if the column is all null; the code checks `if lo is None` |\r\n| `F.median` | C | `F.median(col)` | exact median (Spark 3.4+) | Drill 9 in [13](13-glossary-and-practice.md) (not in `src/`) | Exact, so it sorts; averages the two middle values |\r\n| `DataFrame.write.mode` | A | `df.write.mode(\"overwrite\").parquet(path)` | write mode then format | `df_movies.coalesce(1).write.mode(\"overwrite\").parquet(str(CLEAN_PATH))` | Default mode `\"error\"` fails if the folder exists |\r\n\r\n## O\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.orderBy` | T | `df.orderBy(col1, col2)` | sort | `.orderBy(order, \"title\")` in `rank` | Global sort shuffles; add a tie-breaker for stable output |\r\n| `Window.orderBy` | S | `Window.orderBy(\"id\")` | window ordered by `id`, no partition | `F.row_number().over(Window.orderBy(\"id\")) - 1` | No `partitionBy` → all rows in one partition (warning in the log) |\r\n| `F.when(...).otherwise(...)` | C | `F.when(cond, a).otherwise(b)` | if / else | `F.when(F.col(\"belongs_to_collection\").isNotNull(), \"franchise\").otherwise(\"standalone\")` | Without `otherwise`, unmatched rows are null (used on purpose in cleaning) |\r\n| `DataFrameReader.option` | S | `.option(\"mode\", \"PERMISSIVE\")` | sets a reader option | `.option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")` | The corrupt column must also be in the schema |\r\n| `Column.over` | C | `F.row_number().over(window)` | applies a window function | `reorder_and_reset` | Window functions need `over` |\r\n\r\n## P\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `SparkContext.parallelize` | S | `spark.sparkContext.parallelize(list)` | turns a Python list into an RDD | `tests/helpers.raw_df` | Used only so tests can feed JSON strings to `spark.read.json` |\r\n| `DataFrameWriter.parquet` | A | `.parquet(path)` | writes Parquet (a folder) | `main.run` | On Windows needs winutils + `HADOOP_HOME` |\r\n| `DataFrameReader.parquet` | S | `spark.read.parquet(path)` | reads Parquet with its stored schema | notebook: `spark.read.parquet(CLEAN_PATH).count()` | No schema to give: Parquet carries it |\r\n| `F.percentile_approx` | C | `F.percentile_approx(col, 0.5)` or `(col, [0.25, 0.5, 0.75])` | approximate percentile(s) | `F.round(F.percentile_approx(\"roi\", 0.5), 2).alias(\"median_roi\")` | Returns an actual value, never interpolates: standalone median ROI 7.91 is one film's ROI |\r\n| `DataFrame.printSchema` | — | `df.printSchema()` | prints column names and types as a tree | notebook: `df_raw.printSchema()` | No job; reads the plan only |\r\n\r\n## R\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `spark.read.json` | S | `spark.read.schema(S).option(...).json(path_or_rdd)` | reads JSON Lines | `cleaning.load_raw` | Without `.schema(...)` it infers, which costs a pass over the data |\r\n| `F.round` | C | `F.round(col, n)` | round to n decimals | `F.round(F.avg(\"vote_average\"), 2)` | Half-up rounding; display only, the cached data keeps full precision |\r\n| `F.row_number` | C | `F.row_number().over(w)` | 1, 2, 3 ... in window order | `reorder_and_reset` | Starts at 1; the code subtracts 1 |\r\n\r\n## S\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrameReader.schema` | S | `spark.read.schema(RAW_SCHEMA)` | gives the schema, no inference | `cleaning.load_raw` | A field typed wrong in the schema reads as null in PERMISSIVE mode |\r\n| `DataFrame.select` | T | `df.select(col, ...)`, `df.select([list])` | pick or compute columns | `df.select(idx.alias(\"idx\"), *FINAL_COLUMNS)` | Columns not selected are gone |\r\n| `SparkContext.setLogLevel` | S | `spark.sparkContext.setLogLevel(\"WARN\")` | how much Spark logs | `get_spark`, from `SPARK_LOG_LEVEL` | Only affects messages after the call |\r\n| `DataFrame.show` | A | `df.show(n, truncate=...)` | prints rows | notebook cells | Prints, returns `None`; truncates text at 20 characters by default |\r\n| `F.size` | C | `F.size(array_col)` | number of elements | `F.size(\"credits.cast\")` | Null array gives -1 or null depending on settings; the code wraps it in `F.coalesce(..., F.lit(0))` |\r\n| `F.split` | C | `F.split(col, regex)` | string → array | `F.split(F.col(col), r\"\\|\")` | The pattern is a regex: escape `\\|` |\r\n| `SparkSession.stop` | S | `spark.stop()` | shuts down Spark and the JVM | `finally: spark.stop()` in `main` | After it, any DataFrame from this session is unusable |\r\n| `F.sum` | C | `F.sum(col)` | total, skipping nulls | `F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\")` | Summing exploded rows double counts |\r\n| `DataFrame.summary` | A | `df.summary(\"count\", \"mean\", ...)` | count, mean, min, percentiles, max per column | notebook EDA cell | Percentiles here are approximate too |\r\n\r\n## T\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.toPandas` | A | `df.toPandas()` | all rows to the driver as pandas | `.orderBy(\"year\").toPandas()` in `plot_yearly_box_office` | Driver memory risk; reduce first. Uses Arrow when enabled |\r\n| `DataFrame.transform` | T | `df.transform(func, *args)` | calls `func(df, *args)`; keeps chains readable | `.transform(pipe_join_names, \"genres\", \"name\")` | Extra arguments need Spark 3.3+ |\r\n| `F.trim` | C | `F.trim(col)` | removes spaces at both ends | `F.trim(F.col(col)).isin(PLACEHOLDERS)` | Why a tagline of `\"  \"` counts as the placeholder `\"\"` |\r\n| `try_cast` (SQL) | C | `F.expr(\"try_cast(x AS DOUBLE)\")` | cast that gives null on bad input | `convert_dtypes` | Plain `CAST` raises under ANSI |\r\n| `try_to_timestamp` (SQL) | C | `F.expr(\"CAST(try_to_timestamp(d, 'yyyy-MM-dd') AS DATE)\")` | parse a date, null if it does not match | `convert_dtypes` | Pattern letters are case-sensitive: `MM` month, `mm` minutes |\r\n\r\n## U\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `F.udf` | C | `@F.udf(returnType=T.DoubleType())` | wraps a Python function as a column function | `kpis.roi_udf` | Runs row by row in Python; not used in the pipeline |\r\n| `SparkContext.uiWebUrl` | — | `spark.sparkContext.uiWebUrl` | address of the Spark UI | logged by `get_spark` | Port 4040, or 4041+ if another Spark is running |\r\n| `DataFrame.unpersist` | — | `df.unpersist()` | drop it from the cache | `df_raw.unpersist()`, `found.unpersist()` | Immediate, not lazy |\r\n\r\n## W, Y\r\n\r\n| Name | Kind | Form used | What it does | Line from this project | Gotcha |\r\n|---|---|---|---|---|---|\r\n| `DataFrame.withColumn` | T | `df.withColumn(name, expr)` | add or replace one column | `.withColumn(\"profit_musd\", F.col(\"revenue_musd\") - F.col(\"budget_musd\"))` | Many calls in a loop make a long plan; fine at this size |\r\n| `F.year` | C | `F.year(date_col)` | year as an integer | `df.groupBy(F.year(\"release_date\").alias(\"year\"))` | Null date → null year, which forms its own group |\r\n\r\n## pandas → PySpark for what this lab does\r\n\r\n| Task | pandas (DEM02 version) | PySpark (this lab) |\r\n|---|---|---|\r\n| Read JSON Lines | `pd.read_json(path, lines=True)` | `spark.read.schema(RAW_SCHEMA).json(path)` |\r\n| Drop columns | `df.drop(columns=[...])` | `df.drop(*cols)` |\r\n| New column | `df[\"roi\"] = df.revenue / df.budget` | `df.withColumn(\"roi\", F.col(\"revenue_musd\") / F.col(\"budget_musd\"))` |\r\n| Coerce to number | `pd.to_numeric(s, errors=\"coerce\")` | `F.expr(\"try_cast(x AS DOUBLE)\")` |\r\n| Parse dates | `pd.to_datetime(s, errors=\"coerce\")` | `F.expr(\"CAST(try_to_timestamp(d, 'yyyy-MM-dd') AS DATE)\")` |\r\n| Replace with NaN | `s.replace(0, np.nan)` | `F.when(F.col(c) > 0, F.col(c))` |\r\n| Join list of dicts | `s.apply(lambda l: \"\\|\".join(d[\"name\"] for d in l))` | `F.concat_ws(\"\\|\", F.col(\"genres.name\"))` |\r\n| value_counts | `s.str.split(\"\\|\").explode().value_counts()` | `explode(split(...))` + `groupBy().count().orderBy(desc)` |\r\n| Drop duplicates | `df.drop_duplicates(\"id\")` | `df.dropDuplicates([\"id\"])` |\r\n| Drop NA | `df.dropna(subset=[...])`, `df.dropna(thresh=10)` | same names: `df.dropna(subset=[...])`, `df.dropna(thresh=10)` |\r\n| Filter rows | `df[df.status == \"Released\"]` | `df.filter(F.col(\"status\") == \"Released\")` |\r\n| Reorder columns | `df[cols]` | `df.select(*cols)` |\r\n| Reset index | `df.reset_index(drop=True)` | `F.row_number().over(Window.orderBy(\"id\")) - 1` |\r\n| Sort, top n | `df.nlargest(5, \"roi\")` | `df.orderBy(F.desc(\"roi\")).limit(5)` |\r\n| Group and aggregate | `df.groupby(\"g\").agg(...)` | `df.groupBy(\"g\").agg(...)` |\r\n| Median | `s.median()` (exact) | `F.percentile_approx(c, 0.5)` (approximate) |\r\n| Quantiles | `s.quantile([.25, .5, .75])` (interpolated) | `F.percentile_approx(c, [0.25, 0.5, 0.75])` (real values) |\r\n| Histogram | `ax.hist(s, bins=20)` | bucket with `F.floor`, `groupBy().count()`, then `ax.bar` |\r\n| Boxplot | `ax.boxplot(s)` | quartiles in Spark, then `ax.bxp([stats])` |\r\n| Contains whole item | `\"X\" in s.split(\"\\|\")` | `F.array_contains(F.split(c, r\"\\|\"), \"X\")` |\r\n| Save | `df.to_parquet(path)` | `df.write.mode(\"overwrite\").parquet(path)` |\r\n| Look at rows | `df.head()` | `df.show(5)` / `df.first()` |\r\n| Describe | `df.describe()` | `df.summary()` |\r\n\r\nNext: [15 · Review-day runbook](15-review-day-runbook.md)\r\n","study/15-review-day-runbook.md":"# 15 — Review-Day Runbook\r\n\r\nEverything needed for the review is already on disk: the raw API file, the\r\nclean Parquet, `reports/results.md`, the final report and the eight charts.\r\nNothing has to be fetched during the review. This page is the order to show\r\nthings in, the exact commands, what each prints, and how long it takes on\r\nthis laptop.\r\n\r\n> **Help:** if a reviewer asks \"why?\" at any step, the answers are in [12 · Code-review defense](12-code-review-defense.md) and [11 · Hard concepts](11-hard-concepts-explained.md). If Spark itself will not start, see [01 · Setting up Spark on Windows](01-setup-windows.md).\r\n\r\n## What state the project is in\r\n\r\n| Item | Where | State |\r\n|---|---|---|\r\n| Raw API answers | `data/raw_movies.jsonl` | 18 lines, fetched 4 November 2026; no API key needed to rerun |\r\n| Clean table | `data/movies_clean.parquet/` | 18 rows, 25 columns |\r\n| All tables | `reports/results.md` | made by `python -m src.main` |\r\n| Report | `reports/final_report.md` | summary, method, results, limitations |\r\n| Charts | `reports/chart1.png` … `chart8.png` | 5 question charts + revenue histogram + 2 boxplots |\r\n| Notebook | `analysis.ipynb` | runs the same functions step by step |\r\n| Tests | `tests/` | 32 tests, all pass |\r\n\r\n`data/` is git-ignored (except `data/README.md`), so the raw file exists on\r\nthis laptop but not in a fresh clone.\r\n\r\n**Measured on this laptop** (Windows 11, Python 3.13, PySpark 4.3, Java 17):\r\n\r\n| Command | Time | Result |\r\n|---|---|---|\r\n| `python -m src.main` | **39.3 s**; an earlier run the same morning took 82.5 s | `wrote reports/results.md and 8 charts` |\r\n| Notebook, run top to bottom | **50.3 s** | all cells run, Parquet rewritten, Spark stopped |\r\n| `pytest` (all 32) | **590 s** (9 min 50 s) | `32 passed` |\r\n| `pytest tests/test_tmdb_client.py` | **4 s** (`5 passed in 0.53s`) | no Spark needed |\r\n\r\nThe full test run is too slow to do live. Run it the evening before and\r\nshow the result line, or run only the client tests live.\r\n\r\n---\r\n\r\n## 10 minutes before the review\r\n\r\nOpen PowerShell in the lab folder. Every Spark command below starts with the\r\ntwo Windows variables, so it works in a fresh window:\r\n\r\n```powershell\r\ncd C:\\Workstation\\Amalitech\\Week-5\\Data-Analysis-using-SparknPyspark\r\n$env:HADOOP_HOME=\"C:\\Users\\User\\hadoop\"; $env:PATH=\"C:\\Users\\User\\hadoop\\bin;\"+$env:PATH\r\n```\r\n\r\n**1. Java and PySpark are there** (a few seconds):\r\n\r\n```powershell\r\njava -version\r\npython -c \"import pyspark; print(pyspark.__version__)\"\r\n```\r\n\r\nMust show Java 17 and `4.3.0`.\r\n\r\n**2. The raw file is there** (instant):\r\n\r\n```powershell\r\n(Get-Content data\\raw_movies.jsonl | Measure-Object -Line).Lines\r\n```\r\n\r\nMust print `18`. If the file is missing, `python -m src.main` would try to\r\ncall the API; see \"If something fails live\" below.\r\n\r\n**3. Close other Spark sessions.** A Jupyter kernel or a test run still open\r\nholds port 4040. Spark then moves to 4041 and logs `WARN Utils: Service\r\n'SparkUI' could not bind on port 4040`. Harmless, but two JVMs compete for\r\nmemory and the run gets slower. Restart or shut down any open notebook\r\nkernel.\r\n\r\n**4. Open these:**\r\n- VS Code on the lab folder, with `src/cleaning.py` and `src/main.py` ready\r\n- `reports/final_report.md` in the Markdown preview\r\n- `analysis.ipynb` in Jupyter or VS Code (do not run it yet)\r\n- the study browser: `study/index.html`\r\n- the PowerShell window with the two variables set\r\n\r\n---\r\n\r\n## The demo, in order (about 15 minutes)\r\n\r\nFor each stage: open the file, run the command if there is one, point at the\r\nresult, say the one line.\r\n\r\n### Stage 1 — The task and the layout (1 min)\r\n\r\nOpen `Data-Analysis-using-SparknPyspark.md` (the spec) and `README.md`.\r\n\r\n> \"Four steps: fetch 19 TMDB IDs, clean, KPIs, charts. The repo mirrors my\r\n> pandas version: one module per step in `src/`, a `main.py` that runs it all,\r\n> a notebook that runs the same functions step by step, and 32 tests.\"\r\n\r\nPoint at the README's \"spark choices\" list: it is your outline for the\r\n\"why Spark like this?\" questions.\r\n\r\n### Stage 2 — Step 1, fetching (2 min)\r\n\r\nOpen `src/tmdb_client.py`. Point at `append_to_response=credits`, the\r\n`RETRYABLE` set, `time.sleep(2 ** attempt)`, the 404 branch, and the\r\ntemp-file-then-`os.replace` in `save_jsonl`.\r\n\r\n> \"Plain Python, one call per film with credits included. ID 0 is a 404 and\r\n> is skipped, so 18 films. Busy and server errors retry with back-off; a bad\r\n> key stops at once. The file is written to a temp name and renamed, so Spark\r\n> never reads a half-written file.\"\r\n\r\nDo **not** run `--fetch` live. Show the file instead:\r\n\r\n```powershell\r\nGet-Content data\\raw_movies.jsonl -TotalCount 1\r\n```\r\n\r\nPrints the first film (Avengers: Endgame) as one long JSON line.\r\n\r\n### Stage 3 — Step 2, cleaning (3 min)\r\n\r\nOpen `src/cleaning.py`. Show, in this order:\r\n\r\n1. `RAW_SCHEMA` and its comment: schema on read, strings in the raw layer.\r\n2. `load_raw`: PERMISSIVE and `_corrupt_record`.\r\n3. `clean()`: twelve `.transform` steps in spec order.\r\n4. `convert_dtypes`: `try_cast` because of ANSI mode.\r\n5. `reorder_and_reset`: the window with no `partitionBy`, and its docstring.\r\n6. `validate`: six checks in one `agg`, raises on failure.\r\n\r\n> \"Each rule is its own function, chained in spec order. Bad values become\r\n> null instead of failing, then `validate` checks the result in one pass and\r\n> stops the run if anything is off.\"\r\n\r\n### Stage 4 — Run the pipeline (about 40 s, up to 1 min 20 s)\r\n\r\n```powershell\r\n$env:HADOOP_HOME=\"C:\\Users\\User\\hadoop\"; $env:PATH=\"C:\\Users\\User\\hadoop\\bin;\"+$env:PATH; python -m src.main\r\n```\r\n\r\nWhile it runs (39 s here, up to 82 s if the laptop is busy), say what is\r\nhappening. The lines that matter, in order:\r\n\r\n```text\r\nINFO src.spark_session: spark 4.3.0 on local[*], ui at http://...:4040\r\nINFO main: raw rows: 18, unreadable lines: 0\r\nWARN WindowExec: No Partition Defined for Window operation! Moving all data to a single partition, ...\r\nINFO src.cleaning: data checks passed on 18 rows\r\nINFO main: wrote ...\\data\\movies_clean.parquet\r\nINFO main: wrote reports/results.md and 8 charts\r\n```\r\n\r\nNoise you will also see, all harmless here:\r\n\r\n| Line | Why it is harmless |\r\n|---|---|\r\n| `Missing Python executable 'C:\\Program Files\\Python313\\python.exe'...` | the launcher looks for Python in the wrong place; `get_spark()` sets `PYSPARK_PYTHON` itself |\r\n| `The system cannot find the path specified.` | same launcher check |\r\n| `WARNING: Using incubator modules: jdk.incubator.vector` | Java 17 message at JVM start |\r\n| `[Stage 3:> (0 + 1) / 1]` progress bars | Spark's job progress; one per job |\r\n| `WARN SparkStringUtils: Truncated the string representation of a plan` | the plan of the wide raw table is long; only its log text is cut |\r\n| `WARN WindowExec: No Partition Defined ...` (several times) | the `idx` window; expected, named in the docstring and README |\r\n| `SUCCESS: The process with PID ... has been terminated.` | Windows cleaning up the Spark processes at `spark.stop()` |\r\n\r\nPoint at the WindowExec warning on purpose:\r\n\r\n> \"That warning is the reset index: a window with no partition puts all rows\r\n> in one partition. Fine for 18 rows; the docstring says I would key on `id`\r\n> instead at scale.\"\r\n\r\n### Stage 5 — The results (3 min)\r\n\r\nOpen `reports/final_report.md` (the summary for people) and then\r\n`reports/results.md` (every table). Read out:\r\n\r\n| Point at | Say |\r\n|---|---|\r\n| `## data` line | \"18 raw, 0 unreadable lines, 18 clean, 25 columns, checks passed.\" |\r\n| nulls per column | \"Only `belongs_to_collection` has nulls: the 2 standalone films.\" |\r\n| top revenue | \"Endgame 2,942.19 million.\" |\r\n| low profit | \"The 'worst' film still made 1,034.41 million profit: survivorship bias.\" |\r\n| top / low roi | \"Avatar 12.34, The Last Jedi 4.45.\" |\r\n| searches | \"0 matches for both; the tests prove the searches work.\" |\r\n| franchise vs standalone | \"16 vs 2 films; the standalone side is Titanic and Beauty and the Beast.\" |\r\n| franchises | \"The Avengers Collection: 4 films, 7,918.80.\" |\r\n| directors | \"James Cameron first; the Russos each get full credit for co-directed films.\" |\r\n\r\n### Stage 6 — The charts (2 min)\r\n\r\nOpen `reports/chart1.png` to `chart8.png` in order. One line each (detail in\r\n[09 · Charts](09-visualisati
