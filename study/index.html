n| title | profit_musd |\r\n|---|---|\r\n| Star Wars: The Last Jedi | 1,034.41 |\r\n| Incredibles 2 | 1,043.23 |\r\n| Beauty and the Beast | 1,106.12 |\r\n| Frozen | 1,124.22 |\r\n| Jurassic World: Fallen Kingdom | 1,140.47 |\r\n\r\n### top roi (budget >= 10M)\r\n\r\n| title | roi |\r\n|---|---|\r\n| Avatar | 12.34 |\r\n| Titanic | 11.32 |\r\n| Jurassic World | 11.14 |\r\n| Harry Potter and the Deathly Hallows: Part 2 | 10.73 |\r\n| Frozen II | 9.69 |\r\n\r\n### low roi (budget >= 10M)\r\n\r\n| title | roi |\r\n|---|---|\r\n| Star Wars: The Last Jedi | 4.45 |\r\n| Avengers: Age of Ultron | 5.98 |\r\n| Incredibles 2 | 6.22 |\r\n| The Lion King | 6.39 |\r\n| Black Panther | 6.75 |\r\n\r\n### most voted\r\n\r\n| title | vote_count |\r\n|---|---|\r\n| The Avengers | 40259 |\r\n| Avatar | 34959 |\r\n| Avengers: Infinity War | 33324 |\r\n| Avengers: Endgame | 29209 |\r\n| Titanic | 28009 |\r\n\r\n### top rated (>= 10 votes)\r\n\r\n| title | vote_average |\r\n|---|---|\r\n| Avengers: Endgame | 8.25 |\r\n| Avengers: Infinity War | 8.25 |\r\n| The Avengers | 8.08 |\r\n| Harry Potter and the Deathly Hallows: Part 2 | 8.08 |\r\n| Titanic | 7.90 |\r\n\r\n### low rated (>= 10 votes)\r\n\r\n| title | vote_average |\r\n|---|---|\r\n| Jurassic World: Fallen Kingdom | 6.52 |\r\n| Jurassic World | 6.70 |\r\n| Star Wars: The Last Jedi | 6.73 |\r\n| Beauty and the Beast | 6.97 |\r\n| The Lion King | 7.10 |\r\n\r\n### most popular\r\n\r\n| title | popularity |\r\n|---|---|\r\n| Avengers: Endgame | 64.93 |\r\n| Avengers: Infinity War | 54.46 |\r\n| The Avengers | 42.38 |\r\n| Avengers: Age of Ultron | 35.97 |\r\n| Titanic | 35.22 |\r\n\r\n## searches (step 3.2)\r\n\r\n### search 1: sci-fi action with bruce willis\r\n\r\n0 matches.\r\n\r\n_no rows_\r\n\r\n### search 2: uma thurman, directed by quentin tarantino\r\n\r\n0 matches.\r\n\r\n_no rows_\r\n\r\n## franchise vs standalone (step 3.3)\r\n\r\n| group | movies | mean_revenue | median_roi | mean_budget | mean_popularity | mean_rating |\r\n|---|---|---|---|---|---|---|\r\n| franchise | 16 | 1,691.70 | 7.71 | 218.00 | 27.06 | 7.40 |\r\n| standalone | 2 | 1,765.10 | 7.91 | 180.00 | 26.53 | 7.44 |\r\n\r\n## most successful franchises (step 3.4)\r\n\r\n| franchise | movies | total_revenue | mean_revenue | total_budget | mean_budget | mean_rating |\r\n|---|---|---|---|---|---|---|\r\n| The Avengers Collection | 4 | 7,918.80 | 1,979.70 | 1,111.00 | 277.80 | 7.96 |\r\n| Star Wars Collection | 2 | 3,402.60 | 1,701.30 | 545.00 | 272.50 | 6.98 |\r\n| Jurassic Park Collection | 2 | 2,982.00 | 1,491.00 | 320.00 | 160.00 | 6.61 |\r\n| Avatar Collection | 1 | 2,923.70 | 2,923.70 | 237.00 | 237.00 | 7.61 |\r\n| Frozen Collection | 2 | 2,727.90 | 1,364.00 | 300.00 | 150.00 | 7.23 |\r\n| The Lion King (Reboot) Collection | 1 | 1,662.00 | 1,662.00 | 260.00 | 260.00 | 7.10 |\r\n| The Fast and the Furious Collection | 1 | 1,515.40 | 1,515.40 | 190.00 | 190.00 | 7.21 |\r\n| Black Panther Collection | 1 | 1,349.90 | 1,349.90 | 200.00 | 200.00 | 7.36 |\r\n| Harry Potter Collection | 1 | 1,341.50 | 1,341.50 | 125.00 | 125.00 | 8.08 |\r\n| The Incredibles Collection | 1 | 1,243.20 | 1,243.20 | 200.00 | 200.00 | 7.45 |\r\n\r\n## most successful directors (step 3.5)\r\n\r\n| director | movies | total_revenue | mean_rating |\r\n|---|---|---|---|\r\n| James Cameron | 2 | 5,187.90 | 7.76 |\r\n| Anthony Russo | 2 | 4,994.60 | 8.25 |\r\n| Joe Russo | 2 | 4,994.60 | 8.25 |\r\n| Joss Whedon | 2 | 2,924.20 | 7.68 |\r\n| Chris Buck | 2 | 2,727.90 | 7.23 |\r\n| Jennifer Lee | 2 | 2,727.90 | 7.23 |\r\n| J.J. Abrams | 1 | 2,068.20 | 7.24 |\r\n| Colin Trevorrow | 1 | 1,671.50 | 6.70 |\r\n| Jon Favreau | 1 | 1,662.00 | 7.10 |\r\n| James Wan | 1 | 1,515.40 | 7.21 |\r\n\r\n## charts (step 4)\r\n\r\n![chart1](chart1.png)\r\n\r\n![chart2](chart2.png)\r\n\r\n![chart3](chart3.png)\r\n\r\n![chart4](chart4.png)\r\n\r\n![chart5](chart5.png)\r\n\r\n![chart6](chart6.png)\r\n\r\n![chart7](chart7.png)\r\n\r\n![chart8](chart8.png)\r\n\r\n","src/main.py":"\"\"\"Run the whole lab: fetch (if needed) -> clean -> checks -> kpis -> charts.\n\n    python -m src.main            # reuse data/raw_movies.jsonl if it is there\n    python -m src.main --fetch    # call the api again first\n\nwrites data/movies_clean.parquet, reports/results.md and reports/chart*.png.\nthe notebook runs the same functions step by step.\n\"\"\"\nimport argparse\nimport logging\nimport sys\nfrom pathlib import Path\n\nimport matplotlib\nimport matplotlib.pyplot as plt\nfrom matplotlib.axes import Axes\nfrom pyspark.sql import DataFrame, SparkSession\nfrom pyspark.sql import functions as F\n\nfrom src import cleaning, kpis, visualize\nfrom src.spark_session import get_spark\nfrom src.tmdb_client import RAW_PATH, fetch_all, save_jsonl\n\nROOT = Path(__file__).resolve().parents[1]\nCLEAN_PATH = ROOT / \"data\" / \"movies_clean.parquet\"\nREPORTS = ROOT / \"reports\"\n\nlog = logging.getLogger(\"main\")\n\n\ndef md_table(df: DataFrame, max_rows: int = 50) -> str:\n    \"\"\"Small spark DataFrame -> markdown table for results.md.\"\"\"\n    rows = df.limit(max_rows).collect()\n    if not rows:\n        return \"_no rows_\\n\"\n\n    def fmt(v: object) -> str:\n        if v is None:\n            return \"\"\n        if isinstance(v, float):\n            return f\"{v:,.2f}\"\n        return str(v).replace(\"|\", \"\\\\|\")\n\n    head = \"| \" + \" | \".join(df.columns) + \" |\\n|\" + \"---|\" * len(df.columns) + \"\\n\"\n    return head + \"\".join(\"| \" + \" | \".join(fmt(r[c]) for c in df.columns) + \" |\\n\" for r in rows)\n\n\ndef save_chart(ax: Axes, name: str) -> Path:\n    # root=True gives the Figure, not a SubFigure, so tight_layout is there\n    fig = ax.get_figure(root=True)\n    assert fig is not None\n    fig.tight_layout()\n    path = REPORTS / name\n    fig.savefig(path, dpi=120)\n    plt.close(fig)\n    return path\n\n\ndef run(spark: SparkSession, out: list[str]) -> list[Path]:\n    df_raw = cleaning.load_raw(spark, RAW_PATH).cache()\n    # counting only _corrupt_record straight off the file is not allowed in\n    # spark, the cache above is what makes this count work\n    bad = df_raw.filter(F.col(\"_corrupt_record\").isNotNull()).count()\n    raw_rows = df_raw.count()\n    log.info(\"raw rows: %d, unreadable lines: %d\", raw_rows, bad)\n\n    # cache because every kpi, table and chart below reads this same table.\n    # without it spark would redo the read + clean for each one.\n    df_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()\n    checks = cleaning.validate(df_movies)\n    df_raw.unpersist()\n\n    # parquet keeps the types (dates stay dates) and is columnar, so the next\n    # job only reads the columns it needs. coalesce(1): 18 rows do not need\n    # 4 tiny files. overwrite makes a rerun give the same output.\n    df_movies.coalesce(1).write.mode(\"overwrite\").parquet(str(CLEAN_PATH))\n    log.info(\"wrote %s\", CLEAN_PATH)\n\n    out.append(\"# results\\n\\nmade by `python -m src.main`. money columns are in million usd.\\n\")\n    out.append(f\"## data\\n\\nraw: {raw_rows} movies ({bad} unreadable lines). after cleaning: \"\n               f\"{checks['rows']} movies, {len(df_movies.columns)} columns. data checks passed.\\n\")\n    out.append(\"### cleaned movies\\n\\n\" + md_table(df_movies.select(\n        \"idx\", \"id\", \"title\", \"release_date\", \"budget_musd\", \"revenue_musd\", \"vote_count\",\n        \"vote_average\", \"popularity\", \"runtime\", \"director\")))\n\n    out.append(\"## value counts (step 2.4)\\n\")\n    extracted = [\"genres\", \"original_language\", \"production_countries\", \"spoken_languages\",\n                 \"belongs_to_collection\"]\n    for col, counts in cleaning.inspect_anomalies(df_movies, extracted, n=15).items():\n        out.append(f\"### {col}\\n\\n\" + md_table(counts))\n    nulls = df_movies.select([F.count_if(F.col(c).isNull()).alias(c) for c in df_movies.columns])\n    out.append(\"### nulls per column after cleaning\\n\\n\" + md_table(nulls))\n\n    out.append(\"## best and worst movies (step 3.1)\\n\")\n    for name, frame in kpis.rankings(df_movies).items():\n        out.append(f\"### {name}\\n\\n\" + md_table(frame))\n\n    out.append(\"## searches (step 3.2)\\n\")\n    for name, frame in [(\"search 1: sci-fi action with bruce willis\",\n                         kpis.search_willis_scifi_action(df_movies)),\n                        (\"search 2: uma thurman, directed by quentin tarantino\",\n                         kpis.search_thurman_tarantino(df_movies))]:\n        found = frame.cache()\n        out.append(f\"### {name}\\n\\n{found.count()} matches.\\n\\n\" + md_table(found))\n        found.unpersist()\n\n    out.append(\"## franchise vs standalone (step 3.3)\\n\\n\" + md_table(kpis.franchise_vs_standalone(df_movies)))\n    out.append(\"## most successful franchises (step 3.4)\\n\\n\" + md_table(kpis.top_franchises(df_movies)))\n    out.append(\"## most successful directors (step 3.5)\\n\\n\" + md_table(kpis.top_directors(df_movies)))\n\n    charts = [\n        save_chart(visualize.plot_revenue_vs_budget(df_movies), \"chart1.png\"),\n        save_chart(visualize.plot_roi_by_genre(df_movies), \"chart2.png\"),\n        save_chart(visualize.plot_popularity_vs_rating(df_movies), \"chart3.png\"),\n        save_chart(visualize.plot_yearly_box_office(df_movies), \"chart4.png\"),\n        save_chart(visualize.plot_franchise_vs_standalone(df_movies), \"chart5.png\"),\n        save_chart(visualize.plot_distribution(df_movies, \"revenue_musd\"), \"chart6.png\"),\n        save_chart(visualize.plot_boxplot(df_movies, \"runtime\"), \"chart7.png\"),\n        save_chart(visualize.plot_boxplot(df_movies, \"popularity\"), \"chart8.png\"),\n    ]\n    out.append(\"## charts (step 4)\\n\\n\" + \"\".join(f\"![{p.stem}]({p.name})\\n\\n\" for p in charts))\n    df_movies.unpersist()\n    return charts\n\n\ndef main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--fetch\", action=\"store_true\", help=\"call the tmdb api even if the raw file exists\")\n    args = ap.parse_args()\n    logging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s: %(message)s\")\n    # no window, just files. set here and not at import, so importing main\n    # from the notebook does not turn off the inline charts.\n    matplotlib.use(\"Agg\")\n\n    if args.fetch or not RAW_PATH.exists():\n        save_jsonl(fetch_all())\n\n    REPORTS.mkdir(exist_ok=True)\n    spark = get_spark()\n    out: list[str] = []\n    try:\n        charts = run(spark, out)\n    except Exception:\n        log.exception(\"pipeline failed, nothing more written\")\n        sys.exit(1)\n    finally:\n        # always give the jvm back, even when a step failed\n        spark.stop()\n\n    (REPORTS / \"results.md\").write_text(\"\\n\".join(out), encoding=\"utf-8\")\n    log.info(\"wrote reports/results.md and %d charts\", len(charts))\n\n\nif __name__ == \"__main__\":\n    main()\n","src/spark_session.py":"import logging\r\nimport os\r\nimport sys\r\nimport warnings\r\nfrom pathlib import Path\r\n\r\nfrom dotenv import load_dotenv\r\nfrom pyspark.sql import SparkSession\r\n\r\nlog = logging.getLogger(__name__)\r\n\r\n\r\ndef _saved_user_env(name: str) -> str | None:\r\n    \"\"\"Read a user env var straight from the registry (windows only).\"\"\"\r\n    if sys.platform != \"win32\":\r\n        return None\r\n    import winreg\r\n\r\n    try:\r\n        with winreg.OpenKey(winreg.HKEY_CURRENT_USER, \"Environment\") as key:\r\n            value, _ = winreg.QueryValueEx(key, name)\r\n    except OSError:\r\n        return None\r\n    return str(value)\r\n\r\n\r\ndef ensure_hadoop_home() -> None:\r\n    \"\"\"On windows, point the jvm at winutils.exe before spark starts.\r\n\r\n    spark needs winutils.exe + hadoop.dll to write any file on windows.\r\n    setx only reaches programs opened after it, so a vs code that was\r\n    already open (and the jupyter kernel it starts) never sees HADOOP_HOME\r\n    and the parquet write dies with \"HADOOP_HOME and hadoop.home.dir are\r\n    unset\". so: real env var first, then .env, then the value saved in the\r\n    registry. the bin folder goes on PATH too, that is where hadoop.dll is.\r\n    \"\"\"\r\n    if sys.platform != \"win32\":\r\n        return\r\n    home = os.getenv(\"HADOOP_HOME\") or _saved_user_env(\"HADOOP_HOME\")\r\n    if not home or not (Path(home) / \"bin\" / \"winutils.exe\").exists():\r\n        warnings.warn(\r\n            \"HADOOP_HOME is not set or has no bin\\\\winutils.exe, \"\r\n            \"reads work but writing parquet will fail (see study/01 §4)\",\r\n            stacklevel=2,\r\n        )\r\n        return\r\n    os.environ[\"HADOOP_HOME\"] = home\r\n    bin_dir = str(Path(home) / \"bin\")\r\n    if bin_dir.lower() not in os.environ.get(\"PATH\", \"\").lower():\r\n        os.environ[\"PATH\"] = bin_dir + os.pathsep + os.environ.get(\"PATH\", \"\")\r\n\r\n\r\ndef get_spark(app_name: str = \"tmdb-movie-analysis\") -> SparkSession:\r\n    \"\"\"Build (or reuse) the one SparkSession the notebook, main and tests share.\r\n\r\n    every setting comes from here so the notebook and the script never\r\n    disagree. the master comes from SPARK_MASTER so the same code can be\r\n    pointed at a cluster later; on my laptop it stays local[*].\r\n    \"\"\"\r\n    # on windows the workers can pick up a different python than the driver\r\n    # and then crash on import. pin both to the python running this file.\r\n    os.environ.setdefault(\"PYSPARK_PYTHON\", sys.executable)\r\n    os.environ.setdefault(\"PYSPARK_DRIVER_PYTHON\", sys.executable)\r\n    # pyspark 4.3 warns on every toPandas() when pandas 3 is installed. the\r\n    # calls i make (small tables, plain columns) work fine, so hide that one.\r\n    warnings.filterwarnings(\"ignore\", message=\"PySpark does not yet fully support pandas\")\r\n\r\n    load_dotenv()  # so the SPARK_ settings (and HADOOP_HOME) in .env count, not only real env vars\r\n    # has to happen before getOrCreate, the jvm copies the env when it starts\r\n    ensure_hadoop_home()\r\n    master = os.getenv(\"SPARK_MASTER\", \"local[*]\")\r\n    spark = (\r\n        SparkSession.builder\r\n        .appName(app_name)\r\n        .master(master)\r\n        # default is 200 shuffle partitions. for 18 rows that is 200 near\r\n        # empty tasks after every groupBy. AQE would merge them anyway, but\r\n        # starting small keeps the spark ui readable.\r\n        .config(\"spark.sql.shuffle.partitions\", os.getenv(\"SPARK_SHUFFLE_PARTITIONS\", \"4\"))\r\n        .config(\"spark.sql.adaptive.enabled\", \"true\")\r\n        .config(\"spark.sql.adaptive.coalescePartitions.enabled\", \"true\")\r\n        # dates: same answer on every machine, no matter the laptop timezone\r\n        .config(\"spark.sql.session.timeZone\", \"UTC\")\r\n        # arrow makes toPandas() a columnar copy instead of row by row.\r\n        # fallback means it still works if pyarrow is missing.\r\n        .config(\"spark.sql.execution.arrow.pyspark.enabled\", \"true\")\r\n        .config(\"spark.sql.execution.arrow.pyspark.fallback.enabled\", \"true\")\r\n        .getOrCreate()\r\n    )\r\n    spark.sparkContext.setLogLevel(os.getenv(\"SPARK_LOG_LEVEL\", \"WARN\"))\r\n    log.info(\"spark %s on %s, ui at %s\", spark.version, master, spark.sparkContext.uiWebUrl)\r\n    return spark\r\n","src/tmdb_client.py":"\"\"\"Step 1: get the 19 movie ids from the TMDB api and land them raw on disk.\r\n\r\nthis part is plain python, no spark. 19 http calls do not need a cluster.\r\nspark starts at step 2 when it reads the file this writes.\r\n\"\"\"\r\nimport json\r\nimport logging\r\nimport os\r\nimport time\r\nfrom pathlib import Path\r\nfrom typing import Any\r\n\r\nimport requests\r\nfrom dotenv import load_dotenv\r\n\r\nlog = logging.getLogger(__name__)\r\n\r\n# one movie as tmdb sends it. nested and loose, so a plain dict, not a class\r\nMovie = dict[str, Any]\r\n\r\n# id 0 is not a real movie. the brief puts it in to see if the code copes.\r\nMOVIE_IDS = [\r\n    0, 299534, 19995, 140607, 299536, 597, 135397,\r\n    420818, 24428, 168259, 99861, 284054, 12445,\r\n    181808, 330457, 351286, 109445, 321612, 260513,\r\n]\r\n\r\nRAW_PATH = Path(__file__).resolve().parents[1] / \"data\" / \"raw_movies.jsonl\"\r\nTIMEOUT = 20\r\nRETRYABLE = {429, 500, 502, 503, 504}\r\n\r\n\r\ndef fetch_movie(\r\n    session: requests.Session, base_url: str, movie_id: int, retries: int = 3\r\n) -> Movie | None:\r\n    \"\"\"One movie plus its credits, or None if tmdb does not have it.\r\n\r\n    append_to_response=credits puts cast and crew in the same answer, so it\r\n    is one call per movie instead of two. i keep the credits raw here and\r\n    flatten them in spark, so the raw file is exactly what the api sent.\r\n    \"\"\"\r\n    url = f\"{base_url}/movie/{movie_id}\"\r\n    for attempt in range(1, retries + 1):\r\n        try:\r\n            r = session.get(url, params={\"append_to_response\": \"credits\"}, timeout=TIMEOUT)\r\n        except requests.RequestException as e:\r\n            log.warning(\"movie %s: network error %s (try %d)\", movie_id, e, attempt)\r\n        else:\r\n            if r.status_code == 404:\r\n                log.warning(\"movie %s: not found, skip it\", movie_id)\r\n                return None\r\n            if r.status_code not in RETRYABLE:\r\n                # 401 means a bad key. retrying will not fix that so let it fail.\r\n                r.raise_for_status()\r\n                return r.json()\r\n            log.warning(\"movie %s: http %s (try %d)\", movie_id, r.status_code, attempt)\r\n        # wait 2s, 4s, 8s. hammering a 429 just gets more 429s.\r\n        time.sleep(2 ** attempt)\r\n    log.error(\"movie %s: gave up after %d tries\", movie_id, retries)\r\n    return None\r\n\r\n\r\ndef fetch_all(movie_ids: list[int] | None = None) -> list[Movie]:\r\n    load_dotenv()\r\n    api_key = os.getenv(\"TMDB_API_KEY\", \"\")\r\n    base_url = os.getenv(\"TMDB_BASE_URL\", \"https://api.themoviedb.org/3\")\r\n    if movie_ids is None:\r\n        movie_ids = MOVIE_IDS\r\n    if api_key == \"\":\r\n        raise SystemExit(\"no TMDB_API_KEY in .env. copy .env.example to .env and add the key.\")\r\n\r\n    # one session reuses the tcp connection for all 19 calls. the key goes in\r\n    # the session params so it is never part of a url i log.\r\n    session = requests.Session()\r\n    session.params = {\"api_key\": api_key}\r\n\r\n    out: list[Movie] = []\r\n    for mid in movie_ids:\r\n        m = fetch_movie(session, base_url, mid)\r\n        if m is not None:\r\n            out.append(m)\r\n        time.sleep(0.1)\r\n    log.info(\"fetched %d of %d ids\", len(out), len(movie_ids))\r\n    return out\r\n\r\n\r\ndef save_jsonl(records: list[Movie], path: str | Path = RAW_PATH) -> Path:\r\n    \"\"\"One movie per line. spark reads json lines in parallel, a single big\r\n    json array it can only read as one piece (multiLine).\"\"\"\r\n    path = Path(path)\r\n    path.parent.mkdir(parents=True, exist_ok=True)\r\n    # write to a temp file then rename, so a crash halfway never leaves\r\n    # spark a half written file to read\r\n    tmp = path.with_suffix(\".tmp\")\r\n    with open(tmp, \"w\", encoding=\"utf-8\") as f:\r\n        for rec in records:\r\n            f.write(json.dumps(rec, ensure_ascii=False) + \"\\n\")\r\n    os.replace(tmp, path)\r\n    log.info(\"saved %d movies to %s\", len(records), path)\r\n    return path\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    logging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s: %(message)s\")\r\n    save_jsonl(fetch_all())\r\n","src/cleaning.py":"\"\"\"Step 2: clean the raw movies with spark.\r\n\r\nsame steps and names as my pandas version (src/cleaning.py in DEM02), but\r\nevery function takes a spark DataFrame and gives a new one back. nothing\r\nruns until something asks for a result (count, show, write), so clean() is\r\njust building a plan.\r\n\"\"\"\r\nimport logging\r\nfrom pathlib import Path\r\nfrom typing import Any\r\n\r\nfrom pyspark.sql import DataFrame, SparkSession\r\nfrom pyspark.sql import functions as F\r\nfrom pyspark.sql import types as T\r\nfrom pyspark.sql.window import Window\r\n\r\nlog = logging.getLogger(__name__)\r\n\r\nDROP_COLUMNS = [\"adult\", \"imdb_id\", \"original_title\", \"video\", \"homepage\"]\r\n\r\nFINAL_COLUMNS = [\r\n    \"id\", \"title\", \"tagline\", \"release_date\", \"genres\", \"belongs_to_collection\",\r\n    \"original_language\", \"budget_musd\", \"revenue_musd\", \"production_companies\",\r\n    \"production_countries\", \"vote_count\", \"vote_average\", \"popularity\", \"runtime\",\r\n    \"overview\", \"spoken_languages\", \"poster_path\", \"cast\", \"cast_size\", \"director\", \"crew_size\",\r\n]\r\n\r\n# text tmdb (and people) use when there is no value\r\nPLACEHOLDERS = [\"\", \"No Data\", \"No overview found.\", \"N/A\", \"n/a\"]\r\n\r\n\r\ndef _named(*extra: str) -> T.ArrayType:\r\n    # array of {id, name, ...} structs, the shape tmdb uses for genres,\r\n    # companies and friends\r\n    fields = [T.StructField(\"id\", T.LongType()), T.StructField(\"name\", T.StringType())]\r\n    fields += [T.StructField(f, T.StringType()) for f in extra]\r\n    return T.ArrayType(T.StructType(fields))\r\n\r\n\r\n# i write the schema out instead of letting spark guess it.\r\n# - guessing (inferSchema) reads the whole file once just to work out types.\r\n#   fine for 18 movies, slow for 18 million.\r\n# - a guess can change from one file to the next. a file where every cast\r\n#   list is empty gets guessed as array\u003cstring> and then cast.name breaks.\r\n# - fields i do not list are just skipped, so new api fields can not break me.\r\n# the plain fields come in as strings on purpose: this is the raw layer, and\r\n# convert_dtypes does the real typing with try_cast so one bad value turns\r\n# into a null instead of killing the job.\r\nRAW_SCHEMA = T.StructType([\r\n    T.StructField(\"id\", T.StringType()),\r\n    T.StructField(\"title\", T.StringType()),\r\n    T.StructField(\"tagline\", T.StringType()),\r\n    T.StructField(\"release_date\", T.StringType()),\r\n    T.StructField(\"status\", T.StringType()),\r\n    T.StructField(\"adult\", T.StringType()),\r\n    T.StructField(\"imdb_id\", T.StringType()),\r\n    T.StructField(\"original_title\", T.StringType()),\r\n    T.StructField(\"video\", T.StringType()),\r\n    T.StructField(\"homepage\", T.StringType()),\r\n    T.StructField(\"original_language\", T.StringType()),\r\n    T.StructField(\"overview\", T.StringType()),\r\n    T.StructField(\"poster_path\", T.StringType()),\r\n    T.StructField(\"budget\", T.StringType()),\r\n    T.StructField(\"revenue\", T.StringType()),\r\n    T.StructField(\"runtime\", T.StringType()),\r\n    T.StructField(\"vote_count\", T.StringType()),\r\n    T.StructField(\"vote_average\", T.StringType()),\r\n    T.StructField(\"popularity\", T.StringType()),\r\n    T.StructField(\"belongs_to_collection\", T.StructType([\r\n        T.StructField(\"id\", T.LongType()), T.StructField(\"name\", T.StringType())])),\r\n    T.StructField(\"genres\", _named()),\r\n    T.StructField(\"production_companies\", _named(\"origin_country\")),\r\n    T.StructField(\"production_countries\", T.ArrayType(T.StructType([\r\n        T.StructField(\"iso_3166_1\", T.StringType()), T.StructField(\"name\", T.StringType())]))),\r\n    T.StructField(\"spoken_languages\", T.ArrayType(T.StructType([\r\n        T.StructField(\"english_name\", T.StringType()),\r\n        T.StructField(\"iso_639_1\", T.StringType()),\r\n        T.StructField(\"name\", T.StringType())]))),\r\n    T.StructField(\"credits\", T.StructType([\r\n        T.StructField(\"cast\", T.ArrayType(T.StructType([\r\n            T.StructField(\"name\", T.StringType()),\r\n            T.StructField(\"character\", T.StringType())]))),\r\n        T.StructField(\"crew\", T.ArrayType(T.StructType([\r\n            T.StructField(\"name\", T.StringType()),\r\n            T.StructField(\"job\", T.StringType())]))),\r\n    ])),\r\n    # a line that is not valid json lands here instead of failing the read\r\n    T.StructField(\"_corrupt_record\", T.StringType()),\r\n])\r\n\r\n\r\ndef load_raw(spark: SparkSession, path: str | Path) -> DataFrame:\r\n    \"\"\"Read the json lines file with my schema. bad lines go to _corrupt_record.\"\"\"\r\n    return (\r\n        spark.read\r\n        .schema(RAW_SCHEMA)\r\n        .option(\"mode\", \"PERMISSIVE\")\r\n        .option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")\r\n        .json(str(path))\r\n    )\r\n\r\n\r\ndef drop_corrupt_rows(df: DataFrame) -> DataFrame:\r\n    # i count these in main.py and log them. here they just get dropped.\r\n    return df.filter(F.col(\"_corrupt_record\").isNull()).drop(\"_corrupt_record\")\r\n\r\n\r\ndef drop_irrelevant_columns(df: DataFrame) -> DataFrame:\r\n    # drop() skips names that are not there, so no \"if col in columns\" check\r\n    return df.drop(*DROP_COLUMNS)\r\n\r\n\r\ndef extract_collection_name(df: DataFrame) -> DataFrame:\r\n    # belongs_to_collection is {id, name} or null. .name on a null struct is\r\n    # just null, so no special case for standalone films.\r\n    return df.withColumn(\"belongs_to_collection\", F.col(\"belongs_to_collection.name\"))\r\n\r\n\r\ndef pipe_join_names(df: DataFrame, column: str, name_key: str) -> DataFrame:\r\n    \"\"\"[{name: \"Action\"}, {name: \"Drama\"}] -> \"Action|Drama\", empty list -> null.\r\n\r\n    genres.name on an array of structs gives an array of only the names,\r\n    so concat_ws can join it. no python loop, this all stays in the jvm.\r\n    \"\"\"\r\n    joined = F.concat_ws(\"|\", F.col(f\"{column}.{name_key}\"))\r\n    # concat_ws gives \"\" for an empty list. when() with no otherwise() is null.\r\n    return df.withColumn(column, F.when(joined != \"\", joined))\r\n\r\n\r\ndef extract_credits(df: DataFrame) -> DataFrame:\r\n    \"\"\"cast, cast_size, director and crew_size out of the credits struct.\r\n\r\n    the pandas version did this in the api client. here the raw file keeps\r\n    the credits as they came and spark does it, so i can redo it without\r\n    calling the api again.\r\n    \"\"\"\r\n    cast_names = F.concat_ws(\"|\", F.col(\"credits.cast.name\"))\r\n    # F.filter keeps only the crew entries whose job is Director. a film can\r\n    # have two directors, so i keep all of them, not just the first one.\r\n    directors = F.concat_ws(\"|\", F.filter(\"credits.crew\", lambda c: c[\"job\"] == \"Director\")[\"name\"])\r\n    return (\r\n        df.withColumn(\"cast\", F.when(cast_names != \"\", cast_names))\r\n        .withColumn(\"cast_size\", F.coalesce(F.size(\"credits.cast\"), F.lit(0)))\r\n        .withColumn(\"director\", F.when(directors != \"\", directors))\r\n        .withColumn(\"crew_size\", F.coalesce(F.size(\"credits.crew\"), F.lit(0)))\r\n        .drop(\"credits\")\r\n    )\r\n\r\n\r\ndef inspect_anomalies(df: DataFrame, columns: list[str], n: int = 10) -> dict[str, DataFrame]:\r\n    \"\"\"value_counts for the columns i built, to spot odd values before i trust them.\r\n\r\n    a \"A|B\" cell counts once for A and once for B. gives back the small count\r\n    tables so a test can check this ran.\r\n    \"\"\"\r\n    out: dict[str, DataFrame] = {}\r\n    for col in columns:\r\n        counts = (\r\n            df.select(F.explode(F.split(F.col(col), r\"\\|\")).alias(col))\r\n            .groupBy(col).count()\r\n            .orderBy(F.desc(\"count\"), col)\r\n            .limit(n)\r\n        )\r\n        out[col] = counts\r\n    return out\r\n\r\n\r\ndef convert_dtypes(df: DataFrame) -> DataFrame:\r\n    # spark 4 has ansi mode on, so a plain .cast(\"double\") on \"abc\" throws and\r\n    # the whole job dies. try_cast gives null instead, which is what\r\n    # pd.to_numeric(errors=\"coerce\") did in the pandas version.\r\n    return (\r\n        df.withColumn(\"id\", F.expr(\"try_cast(id AS BIGINT)\"))\r\n        .withColumn(\"budget\", F.expr(\"try_cast(budget AS DOUBLE)\"))\r\n        .withColumn(\"revenue\", F.expr(\"try_cast(revenue AS DOUBLE)\"))\r\n        .withColumn(\"popularity\", F.expr(\"try_cast(popularity AS DOUBLE)\"))\r\n        .withColumn(\"vote_count\", F.expr(\"try_cast(vote_count AS BIGINT)\"))\r\n        .withColumn(\"vote_average\", F.expr(\"try_cast(vote_average AS DOUBLE)\"))\r\n        .withColumn(\"runtime\", F.expr(\"try_cast(runtime AS DOUBLE)\"))\r\n        .withColumn(\"release_date\", F.expr(\"CAST(try_to_timestamp(release_date, 'yyyy-MM-dd') AS DATE)\"))\r\n    )\r\n\r\n\r\ndef clean_unrealistic_values(df: DataFrame) -> DataFrame:\r\n    # 0 budget / revenue / runtime means \"tmdb does not know\", not zero\r\n    for col in [\"budget\", \"revenue\", \"runtime\"]:\r\n        df = df.withColumn(col, F.when(F.col(col) > 0, F.col(col)))\r\n    df = (\r\n        df.withColumn(\"budget_musd\", F.col(\"budget\") / 1_000_000)\r\n        .withColumn(\"revenue_musd\", F.col(\"revenue\") / 1_000_000)\r\n        .drop(\"budget\", \"revenue\")\r\n    )\r\n    # a movie nobody voted on shows 0.0, that is not a rating\r\n    df = df.withColumn(\"vote_average\", F.when(F.col(\"vote_count\") > 0, F.col(\"vote_average\")))\r\n    for col in [\"overview\", \"tagline\"]:\r\n        df = df.withColumn(col, F.when(~F.trim(F.col(col)).isin(PLACEHOLDERS), F.col(col)))\r\n    return df\r\n\r\n\r\ndef filter_released_and_dedup(df: DataFrame) -> DataFrame:\r\n    return (\r\n        df.filter(F.col(\"status\") == \"Released\")\r\n        .drop(\"status\")\r\n        # same id twice -> keep one. which one is not fixed in spark, fine here\r\n        # because a repeat is the same api answer twice.\r\n        .dropDuplicates([\"id\"])\r\n        .dropna(subset=[\"id\", \"title\"])\r\n        # keep rows that have at least 10 real values\r\n        .dropna(thresh=10)\r\n    )\r\n\r\n\r\ndef reorder_and_reset(df: DataFrame) -> DataFrame:\r\n    \"\"\"Final column order plus a 0-based idx, like reset_index in pandas.\r\n\r\n    spark rows have no index. row_number over a window with no partitionBy\r\n    pulls every row into one partition to number them. ok for 18 movies;\r\n    on a big table i would drop idx and just use id as the key.\r\n    \"\"\"\r\n    idx = F.row_number().over(Window.orderBy(\"id\")) - 1\r\n    return df.select(idx.alias(\"idx\"), *FINAL_COLUMNS)\r\n\r\n\r\ndef clean(df_raw: DataFrame) -> DataFrame:\r\n    \"\"\"All of step 2 in the order the brief lists it.\"\"\"\r\n    return (\r\n        df_raw.transform(drop_corrupt_rows)\r\n        .transform(drop_irrelevant_columns)\r\n        .transform(extract_collection_name)\r\n        .transform(pipe_join_names, \"genres\", \"name\")\r\n        .transform(pipe_join_names, \"spoken_languages\", \"english_name\")\r\n        .transform(pipe_join_names, \"production_countries\", \"name\")\r\n        .transform(pipe_join_names, \"production_companies\", \"name\")\r\n        .transform(extract_credits)\r\n        .transform(convert_dtypes)\r\n        .transform(clean_unrealistic_values)\r\n        .transform(filter_released_and_dedup)\r\n        .transform(reorder_and_reset)\r\n    )\r\n\r\n\r\ndef validate(df: DataFrame) -> dict[str, Any]:\r\n    \"\"\"Checks that must hold before anyone reads a number from this table.\r\n\r\n    one pass over the data with a single agg, not one count() per rule.\r\n    raises instead of printing, so a bad run stops here and does not write\r\n    a wrong parquet or wrong charts.\r\n    \"\"\"\r\n    checks = df.agg(\r\n        F.count(\"*\").alias(\"rows\"),\r\n        F.count_distinct(\"id\").alias(\"distinct_ids\"),\r\n        F.count_if(F.col(\"title\").isNull()).alias(\"null_titles\"),\r\n        F.count_if(F.col(\"budget_musd\") \u003c= 0).alias(\"bad_budget\"),\r\n        F.count_if(F.col(\"revenue_musd\") \u003c= 0).alias(\"bad_revenue\"),\r\n        F.count_if((F.col(\"vote_average\") \u003c 0) | (F.col(\"vote_average\") > 10)).alias(\"bad_rating\"),\r\n    ).first()\r\n    # an agg with no groupBy always gives exactly one row, this is for the type checker\r\n    assert checks is not None\r\n    problems: list[str] = []\r\n    if checks[\"rows\"] == 0:\r\n        problems.append(\"no rows left after cleaning\")\r\n    if checks[\"distinct_ids\"] != checks[\"rows\"]:\r\n        problems.append(\"duplicate ids\")\r\n    for name in [\"null_titles\", \"bad_budget\", \"bad_revenue\", \"bad_rating\"]:\r\n        if checks[name] > 0:\r\n            problems.append(f\"{checks[name]} rows with {name}\")\r\n    if problems:\r\n        raise ValueError(\"data checks failed: \" + \"; \".join(problems))\r\n    log.info(\"data checks passed on %d rows\", checks[\"rows\"])\r\n    return checks.asDict()\r\n","src/kpis.py":"\"\"\"Step 3: profit, roi, best / worst lists, searches, franchise and director tables.\"\"\"\r\nfrom pyspark.sql import Column, DataFrame\r\nfrom pyspark.sql import functions as F\r\nfrom pyspark.sql import types as T\r\n\r\nROI_MIN_BUDGET_MUSD = 10.0\r\nMIN_VOTES = 10\r\n\r\n\r\ndef add_profit_roi(df: DataFrame) -> DataFrame:\r\n    # null budget or revenue gives a null profit / roi, never a fake 0.\r\n    # dividing by a null budget is null too, so no divide by zero.\r\n    return (\r\n        df.withColumn(\"profit_musd\", F.col(\"revenue_musd\") - F.col(\"budget_musd\"))\r\n        .withColumn(\"roi\", F.col(\"revenue_musd\") / F.col(\"budget_musd\"))\r\n    )\r\n\r\n\r\ndef rank(\r\n    df: DataFrame, col: str, n: int = 5, ascending: bool = False, where: Column | None = None\r\n) -> DataFrame:\r\n    \"\"\"The ranking function the brief asks for. every best / worst list uses it.\r\n\r\n    rows where col is null are dropped first, otherwise a film with no budget\r\n    would sit at the top of \"lowest roi\". title breaks ties so the same input\r\n    always gives the same list.\r\n    \"\"\"\r\n    if where is not None:\r\n        df = df.filter(where)\r\n    order = F.col(col).asc() if ascending else F.col(col).desc()\r\n    return (\r\n        df.filter(F.col(col).isNotNull())\r\n        .orderBy(order, \"title\")\r\n        .select(\"title\", col)\r\n        .limit(n)\r\n    )\r\n\r\n\r\ndef rankings(df: DataFrame, n: int = 5) -> dict[str, DataFrame]:\r\n    \"\"\"All ten lists from step 3.1, by name.\"\"\"\r\n    rich = F.col(\"budget_musd\") >= ROI_MIN_BUDGET_MUSD\r\n    voted = F.col(\"vote_count\") >= MIN_VOTES\r\n    return {\r\n        \"top revenue\": rank(df, \"revenue_musd\", n),\r\n        \"top budget\": rank(df, \"budget_musd\", n),\r\n        \"top profit\": rank(df, \"profit_musd\", n),\r\n        \"low profit\": rank(df, \"profit_musd\", n, ascending=True),\r\n        \"top roi (budget >= 10M)\": rank(df, \"roi\", n, where=rich),\r\n        \"low roi (budget >= 10M)\": rank(df, \"roi\", n, ascending=True, where=rich),\r\n        \"most voted\": rank(df, \"vote_count\", n),\r\n        \"top rated (>= 10 votes)\": rank(df, \"vote_average\", n, where=voted),\r\n        \"low rated (>= 10 votes)\": rank(df, \"vote_average\", n, ascending=True, where=voted),\r\n        \"most popular\": rank(df, \"popularity\", n),\r\n    }\r\n\r\n\r\n# a real spark udf, only here to compare with the built in maths in\r\n# add_profit_roi. a python udf ships every row from the jvm to a python\r\n# worker and back, and spark can not optimise what is inside it. so the\r\n# pipeline never calls this, the notebook just shows both give the same roi.\r\n@F.udf(returnType=T.DoubleType())\r\ndef roi_udf(revenue: float | None, budget: float | None) -> float | None:\r\n    if revenue is None or budget is None or budget == 0:\r\n        return None\r\n    return revenue / budget\r\n\r\n\r\ndef has(col: str, value: str) -> Column:\r\n    \"\"\"True when the \"A|B|C\" column has value as a whole item.\r\n\r\n    split + array_contains, not contains(): \"Bruce Willis Jr\" must not match\r\n    \"Bruce Willis\".\r\n    \"\"\"\r\n    return F.array_contains(F.split(F.col(col), r\"\\|\"), value)\r\n\r\n\r\ndef search_willis_scifi_action(df: DataFrame) -> DataFrame:\r\n    return (\r\n        df.filter(has(\"genres\", \"Science Fiction\") & has(\"genres\", \"Action\") & has(\"cast\", \"Bruce Willis\"))\r\n        .orderBy(F.desc(\"vote_average\"))\r\n        .select(\"title\", \"genres\", \"vote_average\")\r\n    )\r\n\r\n\r\ndef search_thurman_tarantino(df: DataFrame) -> DataFrame:\r\n    return (\r\n        df.filter(has(\"cast\", \"Uma Thurman\") & has(\"director\", \"Quentin Tarantino\"))\r\n        .orderBy(\"runtime\")\r\n        .select(\"title\", \"director\", \"runtime\")\r\n    )\r\n\r\n\r\ndef franchise_vs_standalone(df: DataFrame) -> DataFrame:\r\n    group = F.when(F.col(\"belongs_to_collection\").isNotNull(), \"franchise\").otherwise(\"standalone\")\r\n    # roi is a median: one huge film moves the mean and not the median.\r\n    # percentile_approx because an exact median needs a full sort.\r\n    return (\r\n        df.withColumn(\"group\", group)\r\n        .groupBy(\"group\")\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.avg(\"revenue_musd\"), 1).alias(\"mean_revenue\"),\r\n            F.round(F.percentile_approx(\"roi\", 0.5), 2).alias(\"median_roi\"),\r\n            F.round(F.avg(\"budget_musd\"), 1).alias(\"mean_budget\"),\r\n            F.round(F.avg(\"popularity\"), 2).alias(\"mean_popularity\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(\"group\")\r\n    )\r\n\r\n\r\ndef top_franchises(df: DataFrame, n: int = 10) -> DataFrame:\r\n    # most successful = most total revenue, rating breaks ties\r\n    return (\r\n        df.filter(F.col(\"belongs_to_collection\").isNotNull())\r\n        .groupBy(F.col(\"belongs_to_collection\").alias(\"franchise\"))\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\"),\r\n            F.round(F.avg(\"revenue_musd\"), 1).alias(\"mean_revenue\"),\r\n            F.round(F.sum(\"budget_musd\"), 1).alias(\"total_budget\"),\r\n            F.round(F.avg(\"budget_musd\"), 1).alias(\"mean_budget\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(F.desc(\"total_revenue\"), F.desc(\"mean_rating\"), \"franchise\")\r\n        .limit(n)\r\n    )\r\n\r\n\r\ndef top_directors(df: DataFrame, n: int = 10) -> DataFrame:\r\n    # explode gives a co-directed film one row per director so both get credit.\r\n    # co-directors tie on every number, so the name is the last sort key,\r\n    # otherwise the russos can swap places from one run to the next.\r\n    return (\r\n        df.filter(F.col(\"director\").isNotNull())\r\n        .withColumn(\"director\", F.explode(F.split(\"director\", r\"\\|\")))\r\n        .groupBy(\"director\")\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(F.desc(\"total_revenue\"), F.desc(\"mean_rating\"), \"director\")\r\n        .limit(n)\r\n    )\r\n","src/visualize.py":"\"\"\"Step 4: the charts. same 7 plots as the pandas version.\r\n\r\nrule i follow here: spark does the counting and grouping, and only the\r\nsmall answer comes back to the driver with toPandas(). toPandas on the full\r\ntable would copy every row into driver memory, which is fine for 18 movies\r\nand a crash for a real table. the two scatter plots are the only ones that\r\nneed one point per movie; on big data i would .sample() them first.\r\n\"\"\"\r\nfrom typing import Any\r\n\r\nimport matplotlib.pyplot as plt\r\nfrom matplotlib.axes import Axes\r\nfrom matplotlib.ticker import MaxNLocator\r\nfrom pyspark.sql import DataFrame\r\nfrom pyspark.sql import functions as F\r\n\r\n\r\ndef plot_revenue_vs_budget(df: DataFrame) -> Axes:\r\n    pdf = df.select(\"title\", \"budget_musd\", \"revenue_musd\").dropna().toPandas()\r\n    fig, ax = plt.subplots()\r\n    ax.scatter(pdf[\"budget_musd\"], pdf[\"revenue_musd\"])\r\n    # anything above this line made more than it cost\r\n    top = pdf[\"budget_musd\"].max()\r\n    ax.plot([0, top], [0, top], linestyle=\"--\", color=\"grey\", label=\"revenue = budget\")\r\n    ax.set_xlabel(\"budget (musd)\")\r\n    ax.set_ylabel(\"revenue (musd)\")\r\n    ax.set_title(\"revenue vs budget\")\r\n    ax.legend()\r\n    return ax\r\n\r\n\r\ndef plot_roi_by_genre(df: DataFrame) -> Axes:\r\n    \"\"\"Mean roi per genre, sorted, with the film count on the label.\r\n\r\n    with 18 films some genres have only 1 or 2, so a tall bar can be one\r\n    film. the n= on the label shows which bars are too thin to mean much.\r\n    \"\"\"\r\n    pdf = (\r\n        df.filter(F.col(\"roi\").isNotNull())\r\n        .withColumn(\"genre\", F.explode(F.split(\"genres\", r\"\\|\")))\r\n        .groupBy(\"genre\")\r\n        .agg(F.avg(\"roi\").alias(\"mean_roi\"), F.count(\"*\").alias(\"n\"))\r\n        .orderBy(F.desc(\"mean_roi\"))\r\n        .toPandas()\r\n    )\r\n    labels = [f\"{g}\\n(n={n})\" for g, n in zip(pdf[\"genre\"], pdf[\"n\"])]\r\n    fig, ax = plt.subplots(figsize=(10, 5))\r\n    ax.bar(labels, pdf[\"mean_roi\"])\r\n    ax.set_xlabel(\"genre, with number of films\")\r\n    ax.set_ylabel(\"mean roi\")\r\n    ax.set_title(\"roi by genre\")\r\n    plt.setp(ax.get_xticklabels(), rotation=45, ha=\"right\")\r\n    fig.tight_layout()\r\n    return ax\r\n\r\n\r\ndef plot_popularity_vs_rating(df: DataFrame) -> Axes:\r\n    pdf = df.select(\"popularity\", \"vote_average\").dropna().toPandas()\r\n    fig, ax = plt.subplots()\r\n    ax.scatter(pdf[\"popularity\"], pdf[\"vote_average\"])\r\n    ax.set_xlabel(\"popularity\")\r\n    ax.set_ylabel(\"rating\")\r\n    ax.set_title(\"popularity vs rating\")\r\n    return ax\r\n\r\n\r\ndef plot_yearly_box_office(df: DataFrame) -> Axes:\r\n    pdf = (\r\n        df.filter(F.col(\"revenue_musd\").isNotNull())\r\n        .groupBy(F.year(\"release_date\").alias(\"year\"))\r\n        .agg(F.avg(\"revenue_musd\").alias(\"mean_revenue\"))\r\n        .orderBy(\"year\")\r\n        .toPandas()\r\n    )\r\n    fig, ax = plt.subplots()\r\n    ax.plot(pdf[\"year\"], pdf[\"mean_revenue\"], marker=\"o\")\r\n    ax.set_xlabel(\"year\")\r\n    ax.set_ylabel(\"mean revenue (musd)\")\r\n    ax.set_title(\"box office by year\")\r\n    return ax\r\n\r\n\r\ndef plot_franchise_vs_standalone(df: DataFrame) -> Axes:\r\n    group = F.when(F.col(\"belongs_to_collection\").isNotNull(), \"franchise\").otherwise(\"standalone\")\r\n    pdf = (\r\n        df.groupBy(group.alias(\"group\"))\r\n        .agg(F.avg(\"revenue_musd\").alias(\"mean_revenue\"), F.count(\"*\").alias(\"n\"))\r\n        .orderBy(\"group\")\r\n        .toPandas()\r\n    )\r\n    labels = [f\"{g} (n={n})\" for g, n in zip(pdf[\"group\"], pdf[\"n\"])]\r\n    fig, ax = plt.subplots()\r\n    ax.bar(labels, pdf[\"mean_revenue\"])\r\n    ax.set_xlabel(\"group\")\r\n    ax.set_ylabel(\"mean revenue (musd)\")\r\n    ax.set_title(\"franchise vs standalone\")\r\n    return ax\r\n\r\n\r\ndef plot_distribution(df: DataFrame, column: str, bins: int = 20) -> Axes:\r\n    \"\"\"Histogram of one numeric column with the median marked.\r\n\r\n    the pandas version handed all values to ax.hist. here spark puts each\r\n    value in a bucket and counts them, so only `bins` numbers come back no\r\n    matter how big the table is.\r\n    \"\"\"\r\n    stats = df.agg(\r\n        F.min(column).alias(\"lo\"),\r\n        F.max(column).alias(\"hi\"),\r\n        F.percentile_approx(column, 0.5).alias(\"median\"),\r\n    ).first()\r\n    assert stats is not None  # agg with no groupBy always gives one row\r\n    lo, hi, median = stats[\"lo\"], stats[\"hi\"], stats[\"median\"]\r\n    fig, ax = plt.subplots()\r\n    if lo is None:\r\n        ax.set_title(f\"{column} distribution (no values)\")\r\n        return ax\r\n\r\n    width = (hi - lo) / bins if hi > lo else 1.0\r\n    # the max value would land in bucket number `bins`, least() puts it in the last one\r\n    bucket = F.least(F.floor((F.col(column) - lo) / width), F.lit(bins - 1)).cast(\"int\")\r\n    rows = df.filter(F.col(column).isNotNull()).groupBy(bucket.alias(\"b\")).count().collect()\r\n    counts: dict[int, int] = {r[\"b\"]: r[\"count\"] for r in rows}\r\n    lefts = [lo + i * width for i in range(bins)]\r\n    heights = [counts.get(i, 0) for i in range(bins)]\r\n    ax.bar(lefts, heights, width=width, align=\"edge\")\r\n    ax.axvline(median, linestyle=\"--\", color=\"black\")\r\n    ax.set_xlabel(column)\r\n    ax.set_ylabel(\"movies\")\r\n    ax.yaxis.set_major_locator(MaxNLocator(integer=True))  # no half movies on the axis\r\n    ax.set_title(f\"{column} distribution (median={median:g})\")\r\n    return ax\r\n\r\n\r\ndef plot_boxplot(df: DataFrame, column: str) -> Axes:\r\n    \"\"\"Horizontal boxplot of one column, quick outlier view.\r\n\r\n    the box numbers (quartiles, whiskers) are worked out in spark and given\r\n    to ax.bxp, which draws a box from numbers instead of from raw values.\r\n    only the outliers themselves come back as rows.\r\n    \"\"\"\r\n    quartiles = df.agg(F.percentile_approx(column, [0.25, 0.5, 0.75]).alias(\"q\")).first()\r\n    assert quartiles is not None\r\n    q1, med, q3 = quartiles[\"q\"]\r\n    iqr = q3 - q1\r\n    low_fence, high_fence = q1 - 1.5 * iqr, q3 + 1.5 * iqr\r\n    inside = df.filter(F.col(column).between(low_fence, high_fence))\r\n    whis = inside.agg(F.min(column).alias(\"lo\"), F.max(column).alias(\"hi\")).first()\r\n    assert whis is not None\r\n    fliers: list[float] = [\r\n        r[column]\r\n        for r in df.filter((F.col(column) \u003c low_fence) | (F.col(column) > high_fence))\r\n        .select(column).collect()\r\n    ]\r\n    box: dict[str, Any] = {\"med\": med, \"q1\": q1, \"q3\": q3, \"whislo\": whis[\"lo\"], \"whishi\": whis[\"hi\"],\r\n           \"fliers\": fliers, \"label\": \"\"}\r\n    fig, ax = plt.subplots()\r\n    ax.bxp([box], orientation=\"horizontal\")\r\n    ax.set_yticks([])\r\n    ax.set_xlabel(column)\r\n    ax.set_title(f\"{column} boxplot\")\r\n    return ax\r\n","tests/conftest.py":"from collections.abc import Iterator\r\n\r\nimport pytest\r\nfrom pyspark.sql import SparkSession\r\n\r\nfrom src.spark_session import get_spark\r\n\r\n\r\n@pytest.fixture(scope=\"session\")\r\ndef spark() -> Iterator[SparkSession]:\r\n    # one spark for the whole test run. starting the jvm takes a few seconds,\r\n    # doing it per test would make the suite crawl.\r\n    s = get_spark(\"tmdb-tests\")\r\n    yield s\r\n    s.stop()\r\n","tests/helpers.py":"\"\"\"Fake movie records so the tests never need the api or the raw file.\r\n\r\nsame shape as one line of data/raw_movies.jsonl (a /movie/{id} answer with\r\nappend_to_response=credits), with only the fields the code reads.\r\n\"\"\"\r\nimport json\r\nfrom collections.abc import Sequence\r\n\r\nfrom pyspark.sql import DataFrame, Row, SparkSession\r\n\r\nfrom src import cleaning, kpis\r\nfrom src.tmdb_client import Movie\r\n\r\n\r\ndef movie(**changes: object) -> Movie:\r\n    m: Movie = {\r\n        \"adult\": False, \"id\": 1, \"imdb_id\": \"tt1\", \"original_title\": \"T\", \"video\": False,\r\n        \"homepage\": \"\", \"title\": \"Test Movie\", \"tagline\": \"a tagline\", \"status\": \"Released\",\r\n        \"release_date\": \"2019-04-24\", \"original_language\": \"en\", \"overview\": \"some plot.\",\r\n        \"budget\": 100_000_000, \"revenue\": 500_000_000, \"runtime\": 120,\r\n        \"vote_count\": 100, \"vote_average\": 7.5, \"popularity\": 20.0, \"poster_path\": \"/p.jpg\",\r\n        \"belongs_to_collection\": {\"id\": 9, \"name\": \"Test Collection\"},\r\n        \"genres\": [{\"id\": 28, \"name\": \"Action\"}, {\"id\": 878, \"name\": \"Science Fiction\"}],\r\n        \"production_companies\": [{\"id\": 1, \"name\": \"Studio A\"}],\r\n        \"production_countries\": [{\"iso_3166_1\": \"US\", \"name\": \"United States of America\"}],\r\n        \"spoken_languages\": [{\"english_name\": \"English\", \"iso_639_1\": \"en\", \"name\": \"English\"}],\r\n        \"credits\": {\"cast\": [{\"name\": \"Actor One\"}, {\"name\": \"Actor Two\"}],\r\n                    \"crew\": [{\"name\": \"Dir One\", \"job\": \"Director\"},\r\n                             {\"name\": \"Writer\", \"job\": \"Screenplay\"}]},\r\n    }\r\n    m.update(changes)\r\n    return m\r\n\r\n\r\ndef raw_df(spark: SparkSession, records: list[Movie], extra_lines: Sequence[str] = ()) -> DataFrame:\r\n    \"\"\"Read fake records the same way main.py reads the file: json text + my schema.\"\"\"\r\n    lines = [json.dumps(r) for r in records] + list(extra_lines)\r\n    rdd = spark.sparkContext.parallelize(lines)\r\n    return (spark.read.schema(cleaning.RAW_SCHEMA)\r\n            .option(\"mode\", \"PERMISSIVE\")\r\n            .option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")\r\n            .json(rdd))\r\n\r\n\r\ndef cleaned(spark: SparkSession, *records: Movie) -> DataFrame:\r\n    return cleaning.clean(raw_df(spark, list(records)))\r\n\r\n\r\ndef enriched(spark: SparkSession, *records: Movie) -> DataFrame:\r\n    return kpis.add_profit_roi(cleaned(spark, *records))\r\n\r\n\r\ndef first(df: DataFrame) -> Row:\r\n    \"\"\"df.first() is typed Row | None. every test table here has rows, so\r\n    this saves an \"is not None\" check in each test.\"\"\"\r\n    row = df.first()\r\n    assert row is not None, \"expected at least one row\"\r\n    return row\r\n","tests/test_cleaning.py":"import pytest\r\nfrom pyspark.sql import SparkSession\r\n\r\nfrom src import cleaning\r\nfrom tests.helpers import cleaned, first, movie, raw_df\r\n\r\n\r\ndef test_final_columns() -> None:\r\n    assert len(cleaning.FINAL_COLUMNS) == 22\r\n    assert cleaning.FINAL_COLUMNS[0] == \"id\"\r\n\r\n\r\ndef test_columns_come_out_in_brief_order(spark: SparkSession) -> None:\r\n    assert cleaned(spark, movie()).columns == [\"idx\", *cleaning.FINAL_COLUMNS]\r\n\r\n\r\ndef test_nested_columns_become_pipe_text(spark: SparkSession) -> None:\r\n    row = first(cleaned(spark, movie()))\r\n    assert row.genres == \"Action|Science Fiction\"\r\n    assert row.belongs_to_collection == \"Test Collection\"\r\n    assert row.spoken_languages == \"English\"\r\n    assert row.cast == \"Actor One|Actor Two\"\r\n    assert row.cast_size == 2 and row.crew_size == 2\r\n    assert row.director == \"Dir One\"\r\n\r\n\r\ndef test_two_directors_both_kept(spark: SparkSession) -> None:\r\n    crew = [{\"name\": \"A\", \"job\": \"Director\"}, {\"name\": \"B\", \"job\": \"Director\"}]\r\n    row = first(cleaned(spark, movie(credits={\"cast\": [], \"crew\": crew})))\r\n    assert row.director == \"A|B\"\r\n\r\n\r\ndef test_empty_lists_become_null(spark: SparkSession) -> None:\r\n    # with inferSchema this broke: all empty lists got guessed as array\u003cstring>.\r\n    # the fixed schema means one movie on its own is enough now.\r\n    row = first(cleaned(spark, movie(credits={\"cast\": [], \"crew\": []}, genres=[])))\r\n    assert row.cast is None and row.director is None and row.genres is None\r\n    assert row.cast_size == 0\r\n\r\n\r\ndef test_zero_money_is_null_and_rest_is_millions(spark: SparkSession) -> None:\r\n    row = first(cleaned(spark, movie(budget=0, revenue=2_500_000)))\r\n    assert row.budget_musd is None\r\n    assert row.revenue_musd == 2.5\r\n\r\n\r\ndef test_no_votes_means_no_rating(spark: SparkSession) -> None:\r\n    row = first(cleaned(spark, movie(vote_count=0, vote_average=0.0)))\r\n    assert row.vote_average is None\r\n\r\n\r\ndef test_placeholders_become_null(spark: SparkSession) -> None:\r\n    row = first(cleaned(spark, movie(overview=\"No Data\", tagline=\"  \")))\r\n    assert row.overview is None and row.tagline is None\r\n\r\n\r\ndef test_bad_values_become_null_not_a_crash(spark: SparkSession) -> None:\r\n    row = first(cleaned(spark, movie(release_date=\"not a date\", budget=\"lots\")))\r\n    assert row.release_date is None and row.budget_musd is None\r\n\r\n\r\ndef test_broken_json_line_is_dropped(spark: SparkSession) -> None:\r\n    df = cleaning.clean(raw_df(spark, [movie()], extra_lines=['{\"id\": 2, \"title\": ']))\r\n    assert df.count() == 1\r\n\r\n\r\ndef test_dupes_unreleased_and_no_title_removed(spark: SparkSession) -> None:\r\n    df = cleaned(spark,\r\n                 movie(id=1), movie(id=1),\r\n                 movie(id=2, status=\"Post Production\"),\r\n                 movie(id=3, title=None),\r\n                 movie(id=4))\r\n    assert sorted(r.id for r in df.collect()) == [1, 4]\r\n\r\n\r\ndef test_idx_starts_at_zero(spark: SparkSession) -> None:\r\n    df = cleaned(spark, movie(id=30), movie(id=10), movie(id=20))\r\n    assert [(r.idx, r.id) for r in df.orderBy(\"idx\").collect()] == [(0, 10), (1, 20), (2, 30)]\r\n\r\n\r\ndef test_inspect_anomalies_splits_cells(spark: SparkSession) -> None:\r\n    df = cleaned(spark, movie(id=1), movie(id=2, genres=[{\"id\": 28, \"name\": \"Action\"}]))\r\n    counts = cleaning.inspect_anomalies(df, [\"genres\"])[\"genres\"]\r\n    assert {r.genres: r[\"count\"] for r in counts.collect()} == {\"Action\": 2, \"Science Fiction\": 1}\r\n\r\n\r\ndef test_validate_passes_on_good_data(spark: SparkSession) -> None:\r\n    assert cleaning.validate(cleaned(spark, movie(id=1), movie(id=2)))[\"rows\"] == 2\r\n\r\n\r\ndef test_validate_stops_on_empty_table(spark: SparkSession) -> None:\r\n    with pytest.raises(ValueError, match=\"no rows\"):\r\n        cleaning.validate(cleaned(spark, movie(status=\"Rumored\")))\r\n","tests/test_kpis.py":"from pyspark.sql import SparkSession\r\nfrom pyspark.sql import functions as F\r\n\r\nfrom src import kpis\r\nfrom tests.helpers import enriched, first, movie\r\n\r\n\r\ndef test_profit_and_roi(spark: SparkSession) -> None:\r\n    row = first(enriched(spark, movie(budget=100_000_000, revenue=450_000_000)))\r\n    assert row.profit_musd == 350.0\r\n    assert row.roi == 4.5\r\n\r\n\r\ndef test_rank_skips_nulls_and_uses_threshold(spark: SparkSession) -> None:\r\n    df = enriched(spark,\r\n                  movie(id=1, title=\"Cheap\", budget=5_000_000, revenue=100_000_000),  # roi 20, budget \u003c 10M\r\n                  movie(id=2, title=\"Big\", budget=100_000_000, revenue=300_000_000),  # roi 3\r\n                  movie(id=3, title=\"NoBudget\", budget=0, revenue=900_000_000))       # roi null\r\n    top = kpis.rank(df, \"roi\", where=F.col(\"budget_musd\") >= kpis.ROI_MIN_BUDGET_MUSD).collect()\r\n    assert [r.title for r in top] == [\"Big\"]\r\n    low = [r.title for r in kpis.rank(df, \"roi\", ascending=True).collect()]\r\n    assert low[0] == \"Big\" and \"NoBudget\" not in low\r\n\r\n\r\ndef test_rankings_has_all_ten_lists(spark: SparkSession) -> None:\r\n    assert len(kpis.rankings(enriched(spark, movie()))) == 10\r\n\r\n\r\ndef test_has_matches_whole_names_only(spark: SparkSession) -> None:\r\n    df = enriched(spark, movie(credits={\"cast\": [{\"name\": \"Bruce Willis Jr\"}], \"crew\": []}))\r\n    assert df.filter(kpis.has(\"cast\", \"Bruce Willis\")).count() == 0\r\n\r\n\r\ndef test_willis_search(spark: SparkSession) -> None:\r\n    credits = {\"cast\": [{\"name\": \"Bruce Willis\"}], \"crew\": []}\r\n    hit = movie(id=1, title=\"Die Hard in Space\", credits=credits)\r\n    miss = movie(id=2, title=\"Other\", genres=[{\"id\": 18, \"name\": \"Drama\"}], credits=credits)\r\n    titles = [r.title for r in kpis.search_willis_scifi_action(enriched(spark, hit, miss)).collect()]\r\n    assert titles == [\"Die Hard in Space\"]\r\n\r\n\r\ndef test_tarantino_search_shortest_first(spark: SparkSession) -> None:\r\n    credits = {\"cast\": [{\"name\": \"Uma Thurman\"}],\r\n               \"crew\": [{\"name\": \"Quentin Tarantino\", \"job\": \"Director\"}]}\r\n    df = enriched(spark, movie(id=1, title=\"Long\", runtime=150, credits=credits),\r\n                  movie(id=2, title=\"Short\", runtime=110, credits=credits))\r\n    assert [r.title for r in kpis.search_thurman_tarantino(df).collect()] == [\"Short\", \"Long\"]\r\n\r\n\r\ndef test_codirectors_both_get_the_revenue(spark: SparkSession) -> None:\r\n    crew = [{\"name\": \"A\", \"job\": \"Director\"}, {\"name\": \"B\", \"job\": \"Director\"}]\r\n    df = enriched(spark, movie(credits={\"cast\": [], \"crew\": crew}, revenue=200_000_000))\r\n    assert {r.director: r.total_revenue for r in kpis.top_directors(df).collect()} == {\"A\": 200.0, \"B\": 200.0}\r\n\r\n\r\ndef test_franchise_split(spark: SparkSession) -> None:\r\n    df = enriched(spark, movie(id=1), movie(id=2, belongs_to_collection=None))\r\n    assert {r.group: r.movies for r in kpis.franchise_vs_standalone(df).collect()} == {\r\n        \"franchise\": 1, \"standalone\": 1}\r\n\r\n\r\ndef test_top_franchises_sums_revenue(spark: SparkSession) -> None:\r\n    df = enriched(spark, movie(id=1, revenue=100_000_000), movie(id=2, revenue=300_000_000))\r\n    row = first(kpis.top_franchises(df))\r\n    assert row.franchise == \"Test Collection\" and row.movies == 2 and row.total_revenue == 400.0\r\n\r\n\r\ndef test_udf_gives_same_roi_as_builtin(spark: SparkSession) -> None:\r\n    df = enriched(spark, movie(id=1), movie(id=2, budget=0))\r\n    rows = df.select(\"roi\", kpis.roi_udf(\"revenue_musd\", \"budget_musd\").alias(\"u\")).collect()\r\n    assert all(r.roi == r.u for r in rows)\r\n","tests/test_tmdb_client.py":"import json\r\nfrom pathlib import Path\r\nfrom typing import Any\r\n\r\nimport pytest\r\nimport requests\r\n\r\nimport src.tmdb_client as tmdb_client\r\nfrom src.tmdb_client import MOVIE_IDS, fetch_movie, save_jsonl\r\n\r\n\r\nclass FakeResponse(requests.Response):\r\n    # a real Response subclass, so fetch_movie gets the type it asks for\r\n    def __init__(self, data: object, status: int) -> None:\r\n        super().__init__()\r\n        self.data = data\r\n        self.status_code = status\r\n\r\n    def json(self, **kwargs: Any) -> Any:\r\n        return self.data\r\n\r\n    def raise_for_status(self) -> None:\r\n        if self.status_code >= 400:\r\n            raise RuntimeError(f\"http {self.status_code}\")\r\n\r\n\r\nclass FakeSession(requests.Session):\r\n    \"\"\"Answers with the statuses in the list, one per call.\"\"\"\r\n\r\n    def __init__(self, statuses: list[int], data: object = None) -> None:\r\n        super().__init__()\r\n        self.statuses = list(statuses)\r\n        self.data = data\r\n        self.calls = 0\r\n\r\n    def get(self, url: str | bytes, **kwargs: Any) -> requests.Response:  # pyright: ignore[reportIncompatibleMethodOverride]\r\n        self.calls += 1\r\n        return FakeResponse(self.data, self.statuses.pop(0))\r\n\r\n\r\ndef no_wait(seconds: float) -> None:\r\n    pass\r\n\r\n\r\ndef no_sleep(monkeypatch: pytest.MonkeyPatch) -> None:\r\n    monkeypatch.setattr(tmdb_client.time, \"sleep\", no_wait)\r\n\r\n\r\ndef test_movie_ids_match_lab_spec() -> None:\r\n    assert len(MOVIE_IDS) == 19\r\n    assert MOVIE_IDS[0] == 0\r\n\r\n\r\ndef test_404_is_skipped(monkeypatch: pytest.MonkeyPatch) -> None:\r\n    no_sleep(monkeypatch)\r\n    assert fetch_movie(FakeSession([404]), \"http://x\", 0) is None\r\n\r\n\r\ndef test_429_then_ok_retries(monkeypatch: pytest.MonkeyPatch) -> None:\r\n    no_sleep(monkeypatch)\r\n    s = FakeSession([429, 200], data={\"id\": 597, \"title\": \"Titanic\"})\r\n    found = fetch_movie(s, \"http://x\", 597)\r\n    assert found is not None and found[\"title\"] == \"Titanic\"\r\n    assert s.calls == 2\r\n\r\n\r\ndef test_gives_up_after_three_tries(monkeypatch: pytest.MonkeyPatch) -> None:\r\n    no_sleep(monkeypatch)\r\n    s = FakeSession([503, 503, 503])\r\n    assert fetch_movie(s, \"http://x\", 597) is None\r\n    assert s.calls == 3\r\n\r\n\r\ndef test_save_jsonl_one_movie_per_line(tmp_path: Path) -> None:\r\n    path = save_jsonl([{\"id\": 1}, {\"id\": 2}], tmp_path / \"raw.jsonl\")\r\n    lines = path.read_text(encoding=\"utf-8\").splitlines()\r\n    assert [json.loads(x)[\"id\"] for x in lines] == [1, 2]\r\n    assert not (tmp_path / \"raw.tmp\").exists()\r\n","tests/test_visualize.py":"import matplotlib\r\nmatplotlib.use(\"Agg\")\r\nimport matplotlib.pyplot as plt\r\nfrom matplotlib.patches import Rectangle\r\nfrom pyspark.sql import SparkSession\r\n\r\nfrom src import visualize\r\nfrom tests.helpers import enriched, movie\r\n\r\n\r\ndef test_histogram_counts_every_movie(spark: SparkSession) -> None:\r\n    df = enriched(spark, *[movie(id=i, runtime=90 + i * 10) for i in range(1, 6)])\r\n    ax = visualize.plot_distribution(df, \"runtime\", bins=4)\r\n    assert sum(p.get_height() for p in ax.patches if isinstance(p, Rectangle)) == 5\r\n    plt.close(\"all\")\r\n\r\n\r\ndef test_boxplot_draws(spark: SparkSession) -> None:\r\n    df = enriched(spark, *[movie(id=i, runtime=100 + i) for i in range(1, 6)], movie(id=9, runtime=400))\r\n    ax = visualize.plot_boxplot(df, \"runtime\")\r\n    assert ax.get_title() == \"runtime boxplot\"\r\n    plt.close(\"all\")\r\n","requirements.txt":"# DEM05 lab 1: tmdb analysis with pyspark. tested on python 3.13, pyspark 4.3, java 17\r\npyspark>=4.0\r\npyarrow>=15.0\r\npandas>=2.0\r\nrequests>=2.31\r\nmatplotlib>=3.10\r\npython-dotenv>=1.0\r\njupyter>=1.0\r\npytest>=8.0\r\n# type checking (pyright) and the stubs that give pandas / requests real types\r\npyright>=1.1.400\r\npandas-stubs>=2.2\r\ntypes-requests>=2.31\r\n",".env.example":"# copy to .env and fill in. .env is gitignored, never commit it.\r\n# key from themoviedb.org -> settings -> api -> \"api key\" (v3)\r\nTMDB_API_KEY=\r\nTMDB_BASE_URL=https://api.themoviedb.org/3\r\n# optional spark settings, these are the defaults\r\nSPARK_MASTER=local[*]\r\nSPARK_SHUFFLE_PARTITIONS=4\r\nSPARK_LOG_LEVEL=WARN\r\n# windows only, the folder above bin\\winutils.exe. only needed if it is not\r\n# already a user env var (get_spark reads that one from the registry too)\r\n# HADOOP_HOME=C:\\Users\\User\\hadoop\r\n"}</script><!--EMBED_END-->

/* ================= markdown renderer (dependency-free) ================= */
/*__RENDERER_START__*/
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
  s = escapeHtml(s).replace(/\\\|/g, "|");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(>])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) =>
    /^https?:/.test(src) ? '<img alt="' + alt + '" src="' + src + '">' :
    '<img style="max-width:100%" alt="' + alt + '" src="' + BASE + resolvePath(currentPath(), src) + '">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
  return s;
}
function renderMarkdown(src) {
  const fences = [];
  src = src.replace(/^[ \t]*```([^\n]*)\r?\n([\s\S]*?)^[ \t]*```[ \t]*$/gm, (m, lang, code) => {
    fences.push({ lang: lang.trim().toLowerCase(), code: code.replace(/\n$/, "") });
    return "\u0002" + (fences.length - 1) + "\u0002\n";
  });
  const lines = src.split(/\r?\n/);
  const out = [];
  let i = 0;
  const reFence = /^\s*\u0002(\d+)\u0002\s*$/;
  const reUl = /^(\s*)[-*]\s+(.*)$/;
  const reOl = /^(\s*)\d+\.\s+(.*)$/;
  const isBlockStart = l =>
    /^(#{1,6})\s/.test(l) || reFence.test(l) || /^\s*>/.test(l) ||
    reUl.test(l) || reOl.test(l) || /^\s*\|/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "") { i++; continue; }

    let m = line.match(reFence);
    if (m) { const f = fences[+m[1]]; out.push('<pre class="code"><code>' + (f.lang === "sql" ? highlightSql(f.code) : escapeHtml(f.code)) + "</code></pre>"); i++; continue; }

    m = line.match(/^(#{1,6})\s+(.*)/);
    if (m) {
      const lv = m[1].length;
      const id = "h-" + m[2].toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      out.push("<h" + lv + ' id="' + id + '">' + inlineMd(m[2]) + "</h" + lv + ">");
      i++; continue;
    }

    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote><p>" + buf.filter(b => b.trim()).map(inlineMd).join(" ") + "</p></blockquote>");
      continue;
    }

    // table: header row + |---| separator + body rows
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/\\\|/g, "\u0003").replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim().replace(/\u0003/g, "|"));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      let t = "<table><thead><tr>" + head.map(c => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of rows) t += "<tr>" + r.map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>";
      out.push(t + "</tbody></table>");
      continue;
    }

    // lists with indent-based nesting
    if (reUl.test(line) || reOl.test(line)) {
      const items = [];
      while (i < lines.length && (reUl.test(lines[i]) || reOl.test(lines[i]))) {
        const mm = lines[i].match(reUl) || lines[i].match(reOl);
        const ordered = !lines[i].match(reUl);
        items.push({ indent: Math.floor(mm[1].replace(/\t/g, "  ").length / 2), ordered, text: mm[2] });
        i++;
        while (i < lines.length && /^\s+\S/.test(lines[i]) && !reUl.test(lines[i]) && !reOl.test(lines[i]) && !isBlockStart(lines[i])) {
          items[items.length - 1].text += " " + lines[i].trim(); i++;
        }
      }
      out.push(buildList(items));
      continue;
    }

    // paragraph
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
    out.push("<p>" + inlineMd(buf.join(" ")) + "</p>");
  }
  return out.join("\n");
}
function buildList(items) {
  let pos = 0;
  function build(depth) {
    const type = items[pos].ordered ? "ol" : "ul";
    let html = "<" + type + ">";
    while (pos < items.length && items[pos].indent === depth) {
      const it = items[pos];
      pos++;
      let cls = "", extra = "", inner = it.text;
      const task = it.text.match(/^\[( |x)\]\s+(.*)/i);
      if (task) {
        cls = ' class="task"';
        extra = '<input type="checkbox" disabled' + (task[1].toLowerCase() === "x" ? " checked" : "") + ">";
        inner = task[2];
      }
      html += "<li" + cls + ">" + extra + inlineMd(inner);
      if (pos < items.length && items[pos].indent > depth) html += build(items[pos].indent);
      html += "</li>";
    }
    return html + "</" + type + ">";
  }
  return build(items[0].indent);
}
const SQL_KW = new Set(("select from where join left right full inner outer cross lateral on using group by order having limit as and or not " +
  "null is in between like distinct case when then else end insert into values update set delete truncate create table index if exists " +
  "drop cascade alter sequence restart with primary key foreign references restrict check constraint unique default serial comment " +
  "begin commit rollback analyze explain buffers union all desc asc filter over do declare raise exception notice returns language " +
  "function execute get stacked diagnostics others temp temporary interval date timestamp int integer smallint bigint varchar char " +
  "text numeric decimal void array of epoch month quarter year").split(" "));
function highlightSql(src) {
  const re = /(--[^\n]*)|('(?:[^']|'')*')|(\$\$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(\s*\()?/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += escapeHtml(src.slice(last, m.index));
    if (m[1]) out += '<span class="sql-com">' + escapeHtml(m[1]) + "</span>";
    else if (m[2]) out += '<span class="sql-str">' + escapeHtml(m[2]) + "</span>";
    else if (m[3]) out += '<span class="sql-kw">$$</span>';
    else if (m[4]) out += '<span class="sql-num">' + m[4] + "</span>";
    else {
      const w = m[5], lw = w.toLowerCase();
      if (SQL_KW.has(lw)) out += '<span class="sql-kw">' + w + "</span>" + (m[6] || "");
      else if (m[6]) out += '<span class="sql-fn">' + w + "</span>" + m[6];
      else out += w;
    }
    last = re.lastIndex;
  }
  return out + escapeHtml(src.slice(last));
}

/* ================= fetching & routing ================= */
/* Content sources, in priority order:
   1. EMBEDDED — JSON snapshot inside this file (offline/file:// mode, Android)
   2. fetch ../-relative — desktop dev over HTTP (auto-picks up edits)
   Refresh the snapshot with: node study/build.js  */
let EMBEDDED = null;
try {
  const el = document.getElementById("embedded-data");
  const t = el && el.textContent.trim();
  if (t && t !== "null") EMBEDDED = JSON.parse(t);
} catch (e) { EMBEDDED = null; }

const BASE = "../";
const cache = new Map();
async function loadFile(path) {
  const inEmbed = EMBEDDED && Object.prototype.hasOwnProperty.call(EMBEDDED, path);
  if (location.protocol === "file:") {
    if (inEmbed) return EMBEDDED[path];
    throw new Error("file:// and this page has no embedded copy of " + path);
  }
  if (cache.has(path)) return cache.get(path);
  try {
    const res = await fetch(encodeURI(BASE + path), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const text = await res.text();
    cache.set(path, text);
    return text;
  } catch (err) {
    if (inEmbed) return EMBEDDED[path];
    throw err;
  }
}
function resolvePath(base, rel) {
  if (rel.startsWith("/")) return rel.slice(1);
  const dirs = base.split("/").slice(0, -1);
  for (const part of rel.split("/")) {
    if (part === ".") continue;
    else if (part === "..") dirs.pop();
    else dirs.push(part);
  }
  return dirs.join("/");
}
function renderSidebar(active) {
  navEl.innerHTML = NAV.map(g =>
    '<div class="group"><h2>' + g.group + "</h2>" + g.items.map(it =>
      '<a href="#/' + it.path + '" data-path="' + it.path + '"' +
      (it.path === active ? ' class="active"' : "") + ">" + it.title +
      '<span class="path">' + it.path + "</span></a>"
    ).join("") + "</div>"
  ).join("");
}
function pager(path) {
  const idx = FLAT.findIndex(it => it.path === path);
  const prev = idx > 0 ? FLAT[idx - 1] : null;
  const next = idx >= 0 && idx < FLAT.length - 1 ? FLAT[idx + 1] : null;
  if (!prev && !next) return "";
  return '<div class="pager">' +
    (prev ? '<a href="#/' + prev.path + '"><span class="dir">Previous</span><span class="t">' + prev.title + "</span></a>" : "<span></span>") +
    (next ? '<a class="next" href="#/' + next.path + '"><span class="dir">Next</span><span class="t">' + next.title + "</span></a>" : "<span></span>") +
    "</div>";
}
function fileHint(path) {
  return '<div class="crumbs">' + path.split("/").join(" / ") + " · <b>" + path.split("/").pop() + "</b></div>";
}
function welcomeHtml() {
  const cards = NAV.map(g =>
    '<div class="card"><h3>' + g.group + "</h3><ul>" +
    g.items.map(it => '<li><a href="#/' + it.path + '">' + it.title + "</a></li>").join("") +
    "</ul></div>"
  ).join("");
  return "<h1>TMDB Movie Analysis with PySpark</h1><p>Study guide and code browser for DEM05 Lab 1. Written for someone who has never used Spark: every page ties the idea to the real code and the real results.</p>" +
    '<div class="grid">' + cards + "</div>" +
    "<h2>Suggested reading order</h2><p><strong>01 Setup</strong> \u2192 <strong>02 What Spark is</strong> \u2192 <strong>03 Python</strong> (skip if confident) \u2192 then build the lab with <strong>04\u201310</strong>, one lab step at a time. Before the review: <strong>11 Hard concepts</strong> \u2192 <strong>12 Code-review defense</strong> \u2192 <strong>13 Practice</strong> \u2192 <strong>15 Runbook</strong>. <strong>14</strong> is an A\u2013Z lookup of every PySpark function in the code. Every code file shows an <em>Explained in</em> link, and the search box (top right) searches every page.</p>" +
    pager(FLAT[0].path);
}
function fileProtocolWarning() {
  return '<div class="card warn"><h3>This page needs to be served over HTTP</h3>' +
    "<p>You opened <code>index.html</code> directly from disk, and browsers block reading the .md files from a <code>file://</code> page. From inside the <code>study/</code> folder run:</p>" +
    '<pre class="code"><code>node serve.js\n# then open http://localhost:8080</code></pre>' +
    "<p>The zero-dependency server always maps to the repository root, so all docs, deliverables and SQL resolve.</p></div>";
}
function splitHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\//, ""));
  const i = raw.indexOf("#");
  return i < 0 ? { path: raw, anchor: "" } : { path: raw.slice(0, i), anchor: raw.slice(i + 1) };
}
function tocHtml() {
  const hs = [...content.querySelectorAll("article h2, article h3")];
  if (hs.filter(h => h.tagName === "H2").length < 3) return;
  let items = "", open = false;
  for (const h of hs) {
    const link = '<a href="#' + h.id + '">' + h.textContent + "</a>";
    if (h.tagName === "H2") { items += (open ? "</ul></li>" : "") + "<li>" + link + "<ul>"; open = true; }
    else if (open) items += "<li>" + link + "</li>";
  }
  if (open) items += "</ul></li>";
  const h1 = content.querySelector("h1");
  const box = '<details class="toc" open><summary>On this page</summary><ul class="toc-l">' + items + "</ul></details>";
  if (h1) h1.insertAdjacentHTML("afterend", box); else content.insertAdjacentHTML("afterbegin", box);
}
function explainedHtml(path) {
  const ex = EXPLAINED[path];
  if (!ex) return "";
  return '<div class="explained"><b>Explained in:</b> ' +
    ex.map(([href, label]) => '<a href="#/' + href + '">' + label + "</a>").join("") + "</div>";
}
function scrollToAnchor(anchor, smooth) {
  const el = anchor && (document.getElementById(anchor) || document.getElementById("h-" + anchor));
  const behavior = smooth ? "smooth" : "instant";
  if (el) el.scrollIntoView({ behavior }); else window.scrollTo({ top: 0, behavior });
}
let shownPath = null;
async function show(path, anchor) {
  if (path === shownPath) { scrollToAnchor(anchor, true); return; }
  shownPath = path;
  renderSidebar(path);
  document.getElementById("content").innerHTML = fileHint(path) + "Loading…";
  try {
    const raw = await loadFile(path);
    const html = path.endsWith(".md")
      ? renderMarkdown(raw)
      : '<pre class="code"><code>' + (path.endsWith(".sql") ? highlightSql(raw) : escapeHtml(raw)) + "</code></pre>";
    content.innerHTML = fileHint(path) + explainedHtml(path) + html + pager(path);
    if (path.endsWith(".md")) tocHtml();
  } catch (err) {
    content.innerHTML = fileHint(path) +
      '<div class="card"><h3>Could not load <code>' + escapeHtml(path) + "</code></h3><p>" +
      escapeHtml(err.message) + " — the file may not exist yet.</p></div>" +
      (location.protocol === "file:" && !EMBEDDED ? fileProtocolWarning() : "") + pager(path);
  }

  document.body.classList.remove("nav-open");
}
window.addEventListener("hashchange", () => {
  const { path, anchor } = splitHash();
  if (path) show(path, anchor);
  else { shownPath = null; content.innerHTML = welcomeHtml(); renderSidebar(""); }
});
/* internal md/sql links navigate in-app */
content.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || /^https?:|^#\//.test(href)) return;
  if (/^#(?!\/)/.test(href)) {                 // same-page section link
    e.preventDefault();
    history.replaceState(null, "", "#/" + currentPath() + href);
    scrollToAnchor(href.slice(1), true);
    return;
  }
  const m = href.match(/^([^#]+\.(?:md|sql|txt|py|example))(#.*)?$/);
  if (m) {
    e.preventDefault();
    location.hash = "/" + resolvePath(currentPath(), m[1]) + (m[2] || "");
  }
});
function currentPath() { return splitHash().path || "README.md"; }

/* ================= full-text search ================= */
const searchEl = document.getElementById("search");
let searchTimer = null;
function titleOf(path) { const it = FLAT.find(x => x.path === path); return it ? it.title : path; }
function anchorId(text) { return "h-" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function markHit(line, q) {
  const i = line.toLowerCase().indexOf(q);
  const start = Math.max(0, i - 60), s = line.slice(start, i + q.length + 80);
  const j = i - start;
  return (start > 0 ? "…" : "") + escapeHtml(s.slice(0, j)) + "<mark>" + escapeHtml(s.slice(j, j + q.length)) + "</mark>" + escapeHtml(s.slice(j + q.length));
}
async function runSearch(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { const { path, anchor } = splitHash(); shownPath = null; path ? show(path, anchor) : (content.innerHTML = welcomeHtml()); return; }
  const hits = [];
  for (const it of FLAT) {
    let raw;
    try { raw = await loadFile(it.path); } catch { continue; }
    let sec = "", secId = "", n = 0;
    for (const line of raw.split(/\r?\n/)) {
      const h = it.path.endsWith(".md") && line.match(/^#{1,6}\s+(.*)/);
      if (h) { sec = h[1]; secId = anchorId(h[1]); }
      if (line.toLowerCase().includes(q)) {
        hits.push({ path: it.path, sec, secId, line: line.trim() });
        if (++n >= 6) break;
      }
    }
  }
  shownPath = null;
  content.innerHTML = "<h1>Search: " + escapeHtml(q) + "</h1><p>" + hits.length + " match" + (hits.length === 1 ? "" : "es") +
    " (up to 6 per page). Press Esc to clear.</p>" +
    hits.slice(0, 150).map(h => '<div class="hit"><a class="doc" href="#/' + h.path + (h.secId ? "#" + h.secId : "") + '">' + titleOf(h.path) + "</a>" +
      (h.sec ? '<div class="sec">§ ' + escapeHtml(h.sec) + "</div>" : "") + '<div class="line">' + markHit(h.line, q) + "</div></div>").join("");
  window.scrollTo(0, 0);
}
searchEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(searchEl.value), 200); });
searchEl.addEventListener("keydown", e => { if (e.key === "Escape") { searchEl.value = ""; runSearch(""); } });
content.addEventListener("click", e => { if (e.target.closest(".hit a")) searchEl.value = ""; });
/* theme + menu */
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hc-theme", next); } catch {}
};
try { const t = localStorage.getItem("hc-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
document.getElementById("menuBtn").onclick = () => document.body.classList.toggle("nav-open");

/* boot */
const boot = splitHash();
if (boot.path) show(boot.path, boot.anchor); else { content.innerHTML = welcomeHtml(); renderSidebar(""); }
if (location.protocol === "file:" && !EMBEDDED) content.insertAdjacentHTML("afterbegin", fileProtocolWarning());
</script>
