ty War | 2,052.42 | Avengers: Infinity War | 1,752.42 | Frozen II | 9.69 |\r\n\r\n| low profit | | low roi (budget ≥ 10M) | | low rated (≥ 10 votes) | |\r\n|---|---|---|---|---|---|\r\n| Star Wars: The Last Jedi | 1,034.41 | Star Wars: The Last Jedi | 4.45 | Jurassic World: Fallen Kingdom | 6.52 |\r\n| Incredibles 2 | 1,043.23 | Avengers: Age of Ultron | 5.98 | Jurassic World | 6.70 |\r\n| Beauty and the Beast | 1,106.12 | Incredibles 2 | 6.22 | Star Wars: The Last Jedi | 6.73 |\r\n| Frozen | 1,124.22 | The Lion King | 6.39 | Beauty and the Beast | 6.97 |\r\n| Jurassic World: Fallen Kingdom | 1,140.47 | Black Panther | 6.75 | The Lion King | 7.10 |\r\n\r\nThe other four lists (top budget, most voted, top rated, most popular) are\r\nin `results.md`. What to read from them:\r\n\r\n- **Endgame tops revenue, Avatar tops profit and ROI.** Endgame's 356.00\r\n  budget is the largest, so its profit and ROI fall behind Avatar's.\r\n  Revenue alone rewards big spending; profit and ROI do not.\r\n- **\"Low profit\" is still over 1 billion.** The worst film here, The Last\r\n  Jedi, made 1,034.41 M profit. These are the 18 biggest earners TMDB\r\n  knows, so \"worst\" means \"least spectacular hit\", not \"flop\". The same\r\n  goes for \"low rated\": 6.52 is the lowest rating in the set.\r\n- **Popularity tracks the Avengers.** The top four \"most popular\" are\r\n  Avengers films; popularity is TMDB's current-interest score, not\r\n  quality.\r\n\r\n## 4. A real Spark UDF: roi_udf\r\n\r\nIn Spark, **UDF** has a precise meaning: a Python function registered so\r\nSpark can call it on every row. `kpis.py` has one, kept only for\r\ncomparison:\r\n\r\n```python\r\n# a real spark udf, only here to compare with the built in maths in\r\n# add_profit_roi. a python udf ships every row from the jvm to a python\r\n# worker and back, and spark can not optimise what is inside it. so the\r\n# pipeline never calls this, the notebook just shows both give the same roi.\r\n@F.udf(returnType=T.DoubleType())\r\ndef roi_udf(revenue: float | None, budget: float | None) -> float | None:\r\n    if revenue is None or budget is None or budget == 0:\r\n        return None\r\n    return revenue / budget\r\n```\r\n\r\n- `@F.udf(returnType=T.DoubleType())` wraps the function; Spark must be\r\n  told the return type because it cannot look inside Python code.\r\n- The body is plain Python. It receives `None` for null, so it must handle\r\n  nulls itself (built-in arithmetic does that automatically).\r\n\r\n| | Built-in: `F.col(\"revenue_musd\") / F.col(\"budget_musd\")` | `roi_udf(\"revenue_musd\", \"budget_musd\")` |\r\n|---|---|---|\r\n| Where it runs | Inside the JVM, as generated code | In a separate Python worker process |\r\n| Data movement | None | Every row is serialised, sent to Python, computed, sent back |\r\n| Optimiser | Catalyst understands it and can move or merge it | A black box: no pushdown, no reordering |\r\n| Null handling | Automatic | Written by hand |\r\n| Speed on big data | Fast | Much slower (often many times) |\r\n\r\nThe rule from the code comment and the README: use a Python UDF only when\r\nno built-in function can do the job. Nothing in this lab needs one.\r\n\r\n`test_udf_gives_same_roi_as_builtin` proves the two agree:\r\n\r\n```python\r\ndef test_udf_gives_same_roi_as_builtin(spark: SparkSession) -> None:\r\n    df = enriched(spark, movie(id=1), movie(id=2, budget=0))\r\n    rows = df.select(\"roi\", kpis.roi_udf(\"revenue_musd\", \"budget_musd\").alias(\"u\")).collect()\r\n    assert all(r.roi == r.u for r in rows)\r\n```\r\n\r\nMovie 1 gives 5.0 from both. Movie 2 (budget 0, so `budget_musd` null)\r\ngives `None` from both; in Python `None == None` is `True`. The notebook\r\nshows the same comparison on the real 18 films.\r\n\r\n**So, which is \"the UDF\" the spec asks for?** Answer in a review: \"the\r\nspec means a reusable ranking function; that is `rank`. I also wrote a real\r\nSpark UDF, `roi_udf`, to show why the pipeline does not use one: same\r\nanswer, but every row leaves the JVM.\"\r\n\r\n## 5. has(): whole-item matching\r\n\r\nThe searches need \"does the cast include Bruce Willis?\". After cleaning,\r\n`cast` is a single string like `\"Robert Downey Jr.|Chris Evans|...\"`.\r\n\r\n```python\r\ndef has(col: str, value: str) -> Column:\r\n    \"\"\"True when the \"A|B|C\" column has value as a whole item.\r\n\r\n    split + array_contains, not contains(): \"Bruce Willis Jr\" must not match\r\n    \"Bruce Willis\".\r\n    \"\"\"\r\n    return F.array_contains(F.split(F.col(col), r\"\\|\"), value)\r\n```\r\n\r\n| Approach | `\"Bruce Willis Jr\\|Actor Two\"` contains \"Bruce Willis\"? |\r\n|---|---|\r\n| `F.col(\"cast\").contains(\"Bruce Willis\")` (substring) | **true**: wrong |\r\n| `has(\"cast\", \"Bruce Willis\")` (split, then exact item) | **false**: right |\r\n\r\n`F.split(..., r\"\\|\")` turns the string back into an array; `array_contains`\r\nchecks for an **exact** element. `test_has_matches_whole_names_only` builds\r\na film whose only cast member is \"Bruce Willis Jr\" and expects 0 matches.\r\n\r\n`has` returns a **Column** (a true/false expression), so it can be\r\ncombined with `&` and passed to `filter`. It is also case-sensitive and\r\nexact: \"bruce willis\" would not match.\r\n\r\n## 6. The two searches, and why both return 0 rows\r\n\r\n```python\r\ndef search_willis_scifi_action(df: DataFrame) -> DataFrame:\r\n    return (\r\n        df.filter(has(\"genres\", \"Science Fiction\") & has(\"genres\", \"Action\") & has(\"cast\", \"Bruce Willis\"))\r\n        .orderBy(F.desc(\"vote_average\"))\r\n        .select(\"title\", \"genres\", \"vote_average\")\r\n    )\r\n\r\n\r\ndef search_thurman_tarantino(df: DataFrame) -> DataFrame:\r\n    return (\r\n        df.filter(has(\"cast\", \"Uma Thurman\") & has(\"director\", \"Quentin Tarantino\"))\r\n        .orderBy(\"runtime\")\r\n        .select(\"title\", \"director\", \"runtime\")\r\n    )\r\n```\r\n\r\nThe spec's sort orders are followed: Search 1 \"best-rated first\"\r\n(`F.desc(\"vote_average\")`), Search 2 \"shortest to longest\"\r\n(`orderBy(\"runtime\")`, ascending by default).\r\n\r\nBoth return **0 matches** in `results.md`. That is the correct answer, not\r\na bug:\r\n\r\n- The 18 films are listed in `results.md`. None is a Bruce Willis film and\r\n  none is directed by Quentin Tarantino (the directors column shows\r\n  Cameron, the Russos, Whedon, and so on).\r\n- The search logic is proven on data where the answer is known:\r\n  `test_willis_search` builds \"Die Hard in Space\" (Action + Science Fiction,\r\n  Bruce Willis) and a Drama with Bruce Willis, and expects only the first;\r\n  `test_tarantino_search_shortest_first` builds a 150-minute and a\r\n  110-minute Tarantino film with Uma Thurman and expects\r\n  `[\"Short\", \"Long\"]`.\r\n\r\n`main.py` caches each search result before counting it, so the `count()`\r\nand the table come from one computation:\r\n\r\n```python\r\nfound = frame.cache()\r\nout.append(f\"### {name}\\n\\n{found.count()} matches.\\n\\n\" + md_table(found))\r\nfound.unpersist()\r\n```\r\n\r\n**Line to say in review:** \"The searches are correct and tested on fake\r\nfilms; the 18 films in the brief's ID list simply contain no Bruce Willis\r\nor Tarantino film. An empty result is a valid answer, and the report says\r\n'0 matches' instead of hiding it.\"\r\n\r\n## 7. franchise_vs_standalone\r\n\r\n```python\r\ndef franchise_vs_standalone(df: DataFrame) -> DataFrame:\r\n    group = F.when(F.col(\"belongs_to_collection\").isNotNull(), \"franchise\").otherwise(\"standalone\")\r\n    # roi is a median: one huge film moves the mean and not the median.\r\n    # percentile_approx because an exact median needs a full sort.\r\n    return (\r\n        df.withColumn(\"group\", group)\r\n        .groupBy(\"group\")\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.avg(\"revenue_musd\"), 1).alias(\"mean_revenue\"),\r\n            F.round(F.percentile_approx(\"roi\", 0.5), 2).alias(\"median_roi\"),\r\n            F.round(F.avg(\"budget_musd\"), 1).alias(\"mean_budget\"),\r\n            F.round(F.avg(\"popularity\"), 2).alias(\"mean_popularity\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(\"group\")\r\n    )\r\n```\r\n\r\nThe group label comes from the null in `belongs_to_collection` that\r\ncleaning kept on purpose. The five aggregates are exactly the spec's\r\nlist: mean revenue, median ROI, mean budget, mean popularity, mean rating.\r\n\r\n| group | movies | mean_revenue | median_roi | mean_budget | mean_popularity | mean_rating |\r\n|---|---|---|---|---|---|---|\r\n| franchise | 16 | 1,691.70 | 7.71 | 218.00 | 27.06 | 7.40 |\r\n| standalone | 2 | 1,765.10 | 7.91 | 180.00 | 26.53 | 7.44 |\r\n\r\n**What this does and does not show.** On paper, standalone films win on\r\nrevenue, ROI and rating. But the standalone group is **2 films**: Titanic\r\nand Beauty and the Beast. Its \"mean revenue\" is mostly Titanic, one of the\r\nthree highest-grossing films ever. Its \"median ROI\" with 2 values is one\r\nof the two values (see [07](07-aggregations-windows-sorting.md#h-3-medians-and-percentile-approx)).\r\nAnd the 18 IDs were picked by the lab author, all of them huge hits, not a\r\nrandom sample of films.\r\n\r\nSo the honest conclusion is: **this data cannot say whether franchises\r\nbeat standalone films.** The differences (1,765.10 vs 1,691.70; 7.44 vs\r\n7.40) are smaller than what swapping a single film would change. The one\r\nsolid pattern is cost: franchise films had the bigger mean budget (218.00\r\nvs 180.00). `test_franchise_split` checks the grouping itself on one film\r\nof each kind.\r\n\r\n## 8. top_franchises\r\n\r\n```python\r\ndef top_franchises(df: DataFrame, n: int = 10) -> DataFrame:\r\n    # most successful = most total revenue, rating breaks ties\r\n    return (\r\n        df.filter(F.col(\"belongs_to_collection\").isNotNull())\r\n        .groupBy(F.col(\"belongs_to_collection\").alias(\"franchise\"))\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\"),\r\n            F.round(F.avg(\"revenue_musd\"), 1).alias(\"mean_revenue\"),\r\n            F.round(F.sum(\"budget_musd\"), 1).alias(\"total_budget\"),\r\n            F.round(F.avg(\"budget_musd\"), 1).alias(\"mean_budget\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(F.desc(\"total_revenue\"), F.desc(\"mean_rating\"), \"franchise\")\r\n        .limit(n)\r\n    )\r\n```\r\n\r\n- `filter(... isNotNull())` drops the 2 standalone films; otherwise they\r\n  would form a \"null franchise\" group.\r\n- `groupBy(F.col(...).alias(\"franchise\"))` groups and renames in one step.\r\n- **The definition of \"most successful\" is a choice**, written in the\r\n  comment: highest total revenue, mean rating as tie-breaker. The spec\r\n  lists the measures but not how to rank them.\r\n- `\"franchise\"` is the **last sort key**. If two franchises ever tied on\r\n  total revenue and mean rating, the name decides, so the top 10 is the\r\n  same on every run (see §9 for the case where this really happens).\r\n\r\n| franchise | movies | total_revenue | mean_revenue | total_budget | mean_budget | mean_rating |\r\n|---|---|---|---|---|---|---|\r\n| The Avengers Collection | 4 | 7,918.80 | 1,979.70 | 1,111.00 | 277.80 | 7.96 |\r\n| Star Wars Collection | 2 | 3,402.60 | 1,701.30 | 545.00 | 272.50 | 6.98 |\r\n| Jurassic Park Collection | 2 | 2,982.00 | 1,491.00 | 320.00 | 160.00 | 6.61 |\r\n| Avatar Collection | 1 | 2,923.70 | 2,923.70 | 237.00 | 237.00 | 7.61 |\r\n| Frozen Collection | 2 | 2,727.90 | 1,364.00 | 300.00 | 150.00 | 7.23 |\r\n| ... 5 more with 1 film each | | | | | | |\r\n\r\nRead it carefully:\r\n\r\n- **Total revenue rewards the number of films in the sample.** The\r\n  Avengers lead because 4 of the 18 IDs are Avengers films. The real\r\n  Star Wars or Jurassic franchises have more films than appear here.\r\n- **By mean revenue, Avatar (1 film, 2,923.70) would be first.**\r\n- **By mean rating, Harry Potter (8.08, 1 film) would be first.**\r\n\r\nSo \"most successful franchise\" depends on the measure. Say which one you\r\nused and why: total revenue answers \"which franchise brought in the most\r\nmoney in this set\". `test_top_franchises_sums_revenue` checks that two\r\nfilms of 100 M and 300 M in one collection give `movies == 2` and\r\n`total_revenue == 400.0`.\r\n\r\n## 9. top_directors\r\n\r\n```python\r\ndef top_directors(df: DataFrame, n: int = 10) -> DataFrame:\r\n    # explode gives a co-directed film one row per director so both get credit.\r\n    # co-directors tie on every number, so the name is the last sort key,\r\n    # otherwise the russos can swap places from one run to the next.\r\n    return (\r\n        df.filter(F.col(\"director\").isNotNull())\r\n        .withColumn(\"director\", F.explode(F.split(\"director\", r\"\\|\")))\r\n        .groupBy(\"director\")\r\n        .agg(\r\n            F.count(\"*\").alias(\"movies\"),\r\n            F.round(F.sum(\"revenue_musd\"), 1).alias(\"total_revenue\"),\r\n            F.round(F.avg(\"vote_average\"), 2).alias(\"mean_rating\"),\r\n        )\r\n        .orderBy(F.desc(\"total_revenue\"), F.desc(\"mean_rating\"), \"director\")\r\n        .limit(n)\r\n    )\r\n```\r\n\r\nThe spec's three measures: number of films, total revenue, mean rating.\r\nThe `explode` gives each co-director a full row (pattern explained in\r\n[07](07-aggregations-windows-sorting.md#h-8-explode-then-group-and-the-double-counting-trap)).\r\n\r\n| director | movies | total_revenue | mean_rating |\r\n|---|---|---|---|\r\n| James Cameron | 2 | 5,187.90 | 7.76 |\r\n| Anthony Russo | 2 | 4,994.60 | 8.25 |\r\n| Joe Russo | 2 | 4,994.60 | 8.25 |\r\n| Joss Whedon | 2 | 2,924.20 | 7.68 |\r\n| Chris Buck | 2 | 2,727.90 | 7.23 |\r\n| Jennifer Lee | 2 | 2,727.90 | 7.23 |\r\n| J.J. Abrams | 1 | 2,068.20 | 7.24 |\r\n| Colin Trevorrow | 1 | 1,671.50 | 6.70 |\r\n| Jon Favreau | 1 | 1,662.00 | 7.10 |\r\n| James Wan | 1 | 1,515.40 | 7.21 |\r\n\r\nCheck one by hand: James Cameron = Titanic 2,264.16 + Avatar 2,923.71 =\r\n5,187.87 → 5,187.90. Mean rating (7.90 + 7.61) / 2 = 7.755, shown as 7.76.\r\n\r\nPoints for a review:\r\n\r\n- **Co-directors share credit in full.** Joe and Anthony Russo each get the\r\n  whole 4,994.60 (Endgame + Infinity War). Correct per director, but the\r\n  column cannot be summed into a total. `test_codirectors_both_get_the_revenue`\r\n  checks `{\"A\": 200.0, \"B\": 200.0}` for one 200 M film.\r\n- **Ties in the order, and the fix.** Co-directors tie on every number,\r\n  because they share the same films: Joe and Anthony Russo both have 2\r\n  films, 4,994.60 and 8.25; Jennifer Lee and Chris Buck both have 2 films,\r\n  2,727.90 and 7.23. With only `total_revenue` and `mean_rating` as sort\r\n  keys, Spark gives no guarantee which of each pair comes first, so the\r\n  table could change from one run to the next with no change in the data.\r\n  That was a real risk in an earlier version of this function. The code\r\n  now ends the sort with `\"director\"`, so ties are broken by name and the\r\n  order is fixed: Anthony Russo before Joe Russo and Chris Buck before\r\n  Jennifer Lee, on every run.\r\n- **Rating as tie-breaker, not as a measure of success.** Ranking by\r\n  mean rating instead would put the Russos (8.25) first.\r\n- **Small numbers.** No director has more than 2 films here. \"Most\r\n  successful director\" means \"most revenue from the films in this list\".\r\n\r\n## 10. How the KPIs are tested\r\n\r\n`tests/test_kpis.py` has 10 tests. They build tiny tables with\r\n`enriched(spark, movie(...), ...)` from `tests/helpers.py`, which runs the\r\nreal `cleaning.clean` and `kpis.add_profit_roi`, so every KPI test also\r\nexercises the cleaning path.\r\n\r\n| Test | Proves |\r\n|---|---|\r\n| `test_profit_and_roi` | 450 − 100 = 350.0; 450 / 100 = 4.5 |\r\n| `test_rank_skips_nulls_and_uses_threshold` | `where` excludes the 5 M budget film; null ROI never listed |\r\n| `test_rankings_has_all_ten_lists` | 10 lists |\r\n| `test_has_matches_whole_names_only` | \"Bruce Willis Jr\" is not \"Bruce Willis\" |\r\n| `test_willis_search` | Only the Action + Sci-Fi film matches |\r\n| `test_tarantino_search_shortest_first` | `[\"Short\", \"Long\"]` |\r\n| `test_codirectors_both_get_the_revenue` | Each co-director gets 200.0 |\r\n| `test_franchise_split` | 1 franchise, 1 standalone |\r\n| `test_top_franchises_sums_revenue` | 2 films, total 400.0 |\r\n| `test_udf_gives_same_roi_as_builtin` | UDF and built-in agree, including null |\r\n\r\n## Self-check\r\n\r\n1. What does the spec mean by \"define a UDF\", and which function is it? [A reusable ranking function: `rank`. `roi_udf` is a real Spark UDF kept only for comparison.]\r\n2. Why is `roi_udf` not used in the pipeline? [Every row goes from the JVM to a Python worker and back, and Catalyst cannot optimise it; the built-in division gives the same result.]\r\n3. Why `has()` and not `contains()`? [`contains` is a substring test, so \"Bruce Willis Jr\" would match \"Bruce Willis\".]\r\n4. Both searches return 0 rows. Is that a bug? [No. None of the 18 films has Bruce Willis or Tarantino; the tests prove the logic on fake films.]\r\n5. Standalone films have the higher mean revenue. Can you conclude standalone films earn more? [No. There are only 2 (Titanic and Beauty and the Beast), and the 18 films are hand-picked hits.]\r\n","study/09-visualisation.md":"# 09 — Charts with Matplotlib\r\n\r\nThis page covers Step 4 of the lab: how the eight charts in `reports/`\r\n(`chart1.png` to `chart8.png`) are made by `src/visualize.py`, why Spark hands\r\nonly small answers to pandas, and what each chart says about these 18 films.\r\n\r\n> **Help:** the KPI tables behind the charts are explained in [08 · KPIs line by line](08-kpis-line-by-line.md). `groupBy`, `explode` and sorting are taught in [07 · Aggregations, windows, sorting](07-aggregations-windows-sorting.md).\r\n\r\n## The one rule: Spark counts, Matplotlib draws\r\n\r\nMatplotlib cannot read a Spark DataFrame. It wants plain Python lists or\r\npandas columns, all of which live in the memory of one Python process. So\r\nevery function in `visualize.py` follows the rule written in its docstring:\r\n\r\n```python\r\n\"\"\"...spark does the counting and grouping, and only the\r\nsmall answer comes back to the driver with toPandas(). toPandas on the full\r\ntable would copy every row into driver memory, which is fine for 18 movies\r\nand a crash for a real table. the two scatter plots are the only ones that\r\nneed one point per movie; on big data i would .sample() them first.\r\n\"\"\"\r\n```\r\n\r\nThree steps per chart:\r\n\r\n1. **Spark** selects, filters, groups or buckets the data into a small table.\r\n2. **`.toPandas()`** (or `.collect()` / `.first()`) copies that small result to\r\n   the **driver**, the one Python process that runs your script.\r\n3. **Matplotlib** draws it.\r\n\r\n### Why the order matters (the driver-memory risk)\r\n\r\nIn real Spark the data is split into **partitions** (chunks) spread over\r\n**executors** (worker processes, often on other machines). No single machine\r\nholds the whole table. `toPandas()` pulls every row into the driver at once.\r\n\r\n| What is sent to the driver | Rows that land there |\r\n|---|---|\r\n| `plot_revenue_vs_budget`: two columns, one row per film | 18 |\r\n| `plot_roi_by_genre`: one row per genre after `groupBy` | 11 |\r\n| `plot_yearly_box_office`: one row per year after `groupBy` | 9 |\r\n| `plot_franchise_vs_standalone`: one row per group | 2 |\r\n| `plot_distribution`: one count per bucket, plus min/max/median | at most 20, plus 1 |\r\n| `plot_boxplot`: three quartiles, two whisker ends, the outliers | 1 + 1 + a few |\r\n| The whole TMDB catalogue (about a million films), without reducing first | a million: the driver may run out of memory |\r\n\r\nThe habit is: **reduce first, then convert**. Here the data is tiny, so the\r\nrule protects nothing yet; it is the habit a reviewer wants to see.\r\n\r\n> **Note:** `spark_session.py` turns on **Arrow**\r\n> (`spark.sql.execution.arrow.pyspark.enabled`), a columnar format that makes\r\n> `toPandas()` copy whole columns at once instead of row by row. PyArrow is in\r\n> `requirements.txt`. The `fallback.enabled` setting means `toPandas()` still\r\n> works, slowly, if PyArrow is missing.\r\n\r\n## Matplotlib in ten minutes\r\n\r\n**Matplotlib** is Python's standard plotting library. `matplotlib.pyplot`,\r\nimported as `plt`, is its main interface.\r\n\r\n### Figure and axes\r\n\r\n- A **figure** (`fig`) is the whole image, the PNG file.\r\n- An **axes** (`ax`) is one plot area inside it, with an x-axis and a y-axis.\r\n\r\n```python\r\nfig, ax = plt.subplots()                  # one figure, one axes, default 6.4 x 4.8 inches\r\nfig, ax = plt.subplots(figsize=(10, 5))   # wider, used for the genre bars\r\n```\r\n\r\nEvery `plot_*` function **returns `ax`**, not a file. The caller decides what\r\nto do with it: `main.py` saves it, the notebook shows it with `plt.show()`,\r\nand a test inspects it (`ax.patches`, `ax.get_title()`). From an `ax` you\r\nreach its figure with `ax.figure`.\r\n\r\n### The drawing methods this lab uses\r\n\r\n| Method | Draws | Used in |\r\n|---|---|---|\r\n| `ax.scatter(x, y)` | one dot per (x, y) pair | revenue vs budget, popularity vs rating |\r\n| `ax.plot(x, y, marker=\"o\")` | a line through points, with a dot at each | yearly box office |\r\n| `ax.plot([0, top], [0, top], linestyle=\"--\")` | a dashed straight line | the break-even line |\r\n| `ax.bar(x, heights)` | vertical bars | ROI by genre, franchise vs standalone |\r\n| `ax.bar(lefts, heights, width=w, align=\"edge\")` | bars that start at `lefts` and are `w` wide | the histogram buckets |\r\n| `ax.axvline(x, linestyle=\"--\")` | a vertical line across the plot | the median on the histogram |\r\n| `ax.bxp([stats])` | a boxplot from numbers you already computed | runtime and popularity boxplots |\r\n\r\n### Labels, ticks, saving\r\n\r\n| Call | What it does |\r\n|---|---|\r\n| `ax.set_xlabel(...)`, `ax.set_ylabel(...)`, `ax.set_title(...)` | axis labels and title |\r\n| `ax.legend()` | box naming every series that has a `label=` |\r\n| `plt.setp(ax.get_xticklabels(), rotation=45, ha=\"right\")` | tilt long x labels so they do not overlap |\r\n| `ax.yaxis.set_major_locator(MaxNLocator(integer=True))` | whole-number ticks only (\"no half movies\") |\r\n| `ax.set_yticks([])` | remove y ticks (the boxplot has only one box) |\r\n| `fig.tight_layout()` | shrink margins so labels are not cut off |\r\n| `fig.savefig(path, dpi=120)` | write the PNG at 120 dots per inch |\r\n| `plt.close(fig)` | free the figure's memory |\r\n\r\n### The Agg backend, and why it is set inside `main()`\r\n\r\nA **backend** is the part of Matplotlib that turns a drawing into pixels.\r\nSome open a window; `Agg` only writes image files.\r\n\r\n```python\r\ndef main() -> None:\r\n    ...\r\n    # no window, just files. set here and not at import, so importing main\r\n    # from the notebook does not turn off the inline charts.\r\n    matplotlib.use(\"Agg\")\r\n```\r\n\r\nIf `matplotlib.use(\"Agg\")` sat at the top of a module, a notebook that\r\nimported that module would lose its inline charts. Inside `main()`, only the\r\ncommand-line run switches to files. `tests/test_visualize.py` sets `Agg` at\r\nits own top, because tests should never open windows.\r\n\r\n## `visualize.py` and `save_chart`, function by function\r\n\r\n### `save_chart(ax, name)` in `main.py`\r\n\r\n```python\r\ndef save_chart(ax: Axes, name: str) -> Path:\r\n    # root=True gives the Figure, not a SubFigure, so tight_layout is there\r\n    fig = ax.get_figure(root=True)\r\n    assert fig is not None\r\n    fig.tight_layout()\r\n    path = REPORTS / name\r\n    fig.savefig(path, dpi=120)\r\n    plt.close(fig)\r\n    return path\r\n```\r\n\r\nOne helper so every chart is saved the same way, into `reports/`. It returns\r\nthe path, which `run()` uses to write the `![chart1](chart1.png)` links in\r\n`reports/results.md`. `plt.close(fig)` matters: Matplotlib keeps every open\r\nfigure in memory until it is closed, and warns after 20.\r\n\r\n### `plot_revenue_vs_budget(df)` → chart 1\r\n\r\n```python\r\npdf = df.select(\"title\", \"budget_musd\", \"revenue_musd\").dropna().toPandas()\r\nfig, ax = plt.subplots()\r\nax.scatter(pdf[\"budget_musd\"], pdf[\"revenue_musd\"])\r\n# anything above this line made more than it cost\r\ntop = pdf[\"budget_musd\"].max()\r\nax.plot([0, top], [0, top], linestyle=\"--\", color=\"grey\", label=\"revenue = budget\")\r\n```\r\n\r\n- Spark keeps three columns and drops rows with a null budget or revenue\r\n  (none here). `pdf` is the usual name for a **p**andas **D**ata**F**rame.\r\n- The dashed line runs from (0, 0) to (top, top). Every point on it has\r\n  revenue = budget: above it a film made money, below it lost money.\r\n\r\n### `plot_roi_by_genre(df)` → chart 2\r\n\r\n```python\r\npdf = (\r\n    df.filter(F.col(\"roi\").isNotNull())\r\n    .withColumn(\"genre\", F.explode(F.split(\"genres\", r\"\\|\")))\r\n    .groupBy(\"genre\")\r\n    .agg(F.avg(\"roi\").alias(\"mean_roi\"), F.count(\"*\").alias(\"n\"))\r\n    .orderBy(F.desc(\"mean_roi\"))\r\n    .toPandas()\r\n)\r\nlabels = [f\"{g}\\n(n={n})\" for g, n in zip(pdf[\"genre\"], pdf[\"n\"])]\r\n```\r\n\r\n- `F.split(\"genres\", r\"\\|\")` turns `\"Action|Science Fiction\"` into an array.\r\n  `|` is escaped because `split` takes a regular expression, where a bare `|`\r\n  means \"or\".\r\n- `F.explode` makes one row per genre, so a film with three genres counts\r\n  once in each. Spark then computes the mean ROI and the film count per\r\n  genre. Only 11 rows come back.\r\n- The label carries `n=`, so the reader sees which bars rest on one film. The\r\n  docstring: \"a tall bar can be one film.\"\r\n\r\n### `plot_popularity_vs_rating(df)` → chart 3\r\n\r\n```python\r\npdf = df.select(\"popularity\", \"vote_average\").dropna().toPandas()\r\nax.scatter(pdf[\"popularity\"], pdf[\"vote_average\"])\r\n```\r\n\r\nOne dot per film: popularity on x, rating on y.\r\n\r\n### `plot_yearly_box_office(df)` → chart 4\r\n\r\n```python\r\npdf = (\r\n    df.filter(F.col(\"revenue_musd\").isNotNull())\r\n    .groupBy(F.year(\"release_date\").alias(\"year\"))\r\n    .agg(F.avg(\"revenue_musd\").alias(\"mean_revenue\"))\r\n    .orderBy(\"year\")\r\n    .toPandas()\r\n)\r\nax.plot(pdf[\"year\"], pdf[\"mean_revenue\"], marker=\"o\")\r\n```\r\n\r\n`F.year` pulls the year from the date. Spark averages revenue per year, so\r\n9 rows come back. The line joins the yearly means in order.\r\n\r\n### `plot_franchise_vs_standalone(df)` → chart 5\r\n\r\n```python\r\ngroup = F.when(F.col(\"belongs_to_collection\").isNotNull(), \"franchise\").otherwise(\"standalone\")\r\npdf = (\r\n    df.groupBy(group.alias(\"group\"))\r\n    .agg(F.avg(\"revenue_musd\").alias(\"mean_revenue\"), F.count(\"*\").alias(\"n\"))\r\n    .orderBy(\"group\")\r\n    .toPandas()\r\n)\r\nlabels = [f\"{g} (n={n})\" for g, n in zip(pdf[\"group\"], pdf[\"n\"])]\r\n```\r\n\r\nSame split as `kpis.franchise_vs_standalone`: a film with a collection is a\r\nfranchise film. Two rows come back; the labels again show `n`.\r\n\r\n### `plot_distribution(df, column, bins=20)` → chart 6 (a Spark-side histogram)\r\n\r\nA **histogram** splits the range of a column into equal-width **buckets**\r\n(bins) and counts the values in each. The usual Matplotlib way, `ax.hist`,\r\nneeds every value in Python. Here Spark does the bucketing and counting:\r\n\r\n```python\r\nstats = df.agg(\r\n    F.min(column).alias(\"lo\"),\r\n    F.max(column).alias(\"hi\"),\r\n    F.percentile_approx(column, 0.5).alias(\"median\"),\r\n).first()\r\nassert stats is not None  # agg with no groupBy always gives one row\r\n...\r\nwidth = (hi - lo) / bins if hi > lo else 1.0\r\n# the max value would land in bucket number `bins`, least() puts it in the last one\r\nbucket = F.least(F.floor((F.col(column) - lo) / width), F.lit(bins - 1)).cast(\"int\")\r\nrows = df.filter(F.col(column).isNotNull()).groupBy(bucket.alias(\"b\")).count().collect()\r\ncounts: dict[int, int] = {r[\"b\"]: r[\"count\"] for r in rows}\r\nlefts = [lo + i * width for i in range(bins)]\r\nheights = [counts.get(i, 0) for i in range(bins)]\r\nax.bar(lefts, heights, width=width, align=\"edge\")\r\nax.axvline(median, linestyle=\"--\", color=\"black\")\r\n```\r\n\r\n| Code | What it does |\r\n|---|---|\r\n| `df.agg(min, max, percentile_approx).first()` | one Spark pass gives the range and the median |\r\n| `width = (hi - lo) / bins` | each bucket's width; `if hi > lo else 1.0` avoids dividing by 0 when all values are equal |\r\n| `F.floor((col - lo) / width)` | bucket number 0, 1, 2 ... for each value |\r\n| `F.least(..., F.lit(bins - 1))` | the maximum value computes to bucket `bins` (one past the end); this clamps it into the last bucket |\r\n| `groupBy(bucket).count().collect()` | Spark counts per bucket; at most 20 rows come back |\r\n| `dict(...)` | each `Row(b, count)` unpacks to a key and a value, e.g. `{0: 4, 1: 4, ...}` |\r\n| `counts.get(i, 0)` | empty buckets are missing from the result, so they default to 0 |\r\n| `align=\"edge\"` | each bar starts at its left edge, so the bars touch like a histogram |\r\n| `if lo is None: ...` | an all-null column gets an empty chart titled \"(no values)\" instead of a crash |\r\n\r\n`test_histogram_counts_every_movie` checks that the bar heights add up to the\r\nnumber of films (5 films, 4 bins → total height 5).\r\n\r\n### `plot_boxplot(df, column)` → charts 7 and 8 (a Spark-side boxplot)\r\n\r\nA **boxplot** summarises a column in a few numbers: the **median**; the\r\n**quartiles** Q1 and Q3 (25 % and 75 % of the values lie below them); the\r\n**whiskers**; and **outliers** drawn as circles. The box spans Q1 to Q3; its\r\nwidth is the **IQR** (interquartile range, Q3 − Q1). Points beyond the\r\n**fences**, Q1 − 1.5 × IQR and Q3 + 1.5 × IQR, are outliers. The whiskers\r\nreach the furthest values still inside the fences.\r\n\r\n```python\r\nquartiles = df.agg(F.percentile_approx(column, [0.25, 0.5, 0.75]).alias(\"q\")).first()\r\nassert quartiles is not None\r\nq1, med, q3 = quartiles[\"q\"]\r\niqr = q3 - q1\r\nlow_fence, high_fence = q1 - 1.5 * iqr, q3 + 1.5 * iqr\r\ninside = df.filter(F.col(column).between(low_fence, high_fence))\r\nwhis = inside.agg(F.min(column).alias(\"lo\"), F.max(column).alias(\"hi\")).first()\r\nassert whis is not None\r\nfliers = [\r\n    r[column]\r\n    for r in df.filter((F.col(column) \u003c low_fence) | (F.col(column) > high_fence))\r\n    .select(column).collect()\r\n]\r\nbox = {\"med\": med, \"q1\": q1, \"q3\": q3, \"whislo\": whis[\"lo\"], \"whishi\": whis[\"hi\"],\r\n       \"fliers\": fliers, \"label\": \"\"}\r\nax.bxp([box], orientation=\"horizontal\")\r\n```\r\n\r\n- `percentile_approx(column, [0.25, 0.5, 0.75])` returns all three quartiles\r\n  in one pass, as an array that unpacks into `q1, med, q3`.\r\n- `between(low_fence, high_fence)` keeps the non-outliers; their min and max\r\n  are the whisker ends.\r\n- Only the outliers (\"fliers\") come back as rows.\r\n- `ax.bxp` draws a box **from numbers you give it**. The usual `ax.boxplot`\r\n  needs every raw value and computes the numbers itself.\r\n\r\n> **Watch out: Spark fences differ from pandas fences.** `percentile_approx`\r\n> returns a value that is **in the data**; it never interpolates between two\r\n> values. pandas and NumPy (and so `ax.boxplot`) interpolate by default. On\r\n> 18 rows that moves Q1 and Q3, and so the fences. The notebook records the\r\n> effect on revenue: with Spark quartiles, Avatar (2,924) and Endgame (2,942)\r\n> fall inside the high fence (3,129), while the pandas version of this lab\r\n> flagged both as outliers. Neither is wrong; they use two definitions of a\r\n> quartile. Read them as \"the top two films\", not as bad data.\r\n\r\n`test_boxplot_draws` builds five films with runtimes 101–105 and one at 400,\r\nand checks the chart is drawn with the title \"runtime boxplot\".\r\n\r\n## What the eight charts show\r\n\r\n### Chart 1 — revenue vs budget\r\n\r\n**What you see.** 18 dots with budgets between 125 and 356 and revenues\r\nbetween about 1,240 and 2,940 (million USD). The dashed break-even line runs\r\nalong the bottom. Every dot is far above it. The two highest dots are Avatar\r\n(budget 237, revenue 2,923.71) and Endgame (356, 2,942.19).\r\n\r\n**What to say.** \"Every film earned at least 4.45 times its budget (the\r\nlowest ROI, Star Wars: The Last Jedi). That is **survivorship bias**: the\r\nspec's IDs are among the highest-grossing films ever, so only winners are in\r\nthe sample. Budget barely predicts revenue: The Last Jedi has the joint\r\nsecond-biggest budget (300 M), yet the lowest profit, 1,034.41 M.\"\r\n\r\n> **Survivorship bias:** conclusions drawn only from cases that \"survived\" a\r\n> filter. Here the filter is \"became a blockbuster\".\r\n\r\n### Chart 2 — ROI by genre\r\n\r\n**What you see.** 11 bars of mean ROI, sorted high to low, each labelled\r\nwith its film count. Comedy (n=1) is highest at about 9.7, then Romance (n=2)\r\nand Fantasy (n=4). Action (n=10) is lowest at about 7.4. Adventure (n=15)\r\nsits near 8.\r\n\r\n**What to say.** \"The tallest bar is one film: Comedy is only Frozen II, whose\r\nROI is 9.69. The two big genres, Adventure (15 films) and Action (10), sit in\r\nthe middle and at the bottom. With 18 films I would not claim any genre is\r\nmore profitable. A film with three genres also counts in three bars, so the\r\nbars are not independent.\"\r\n\r\n### Chart 3 — popularity vs rating\r\n\r\n**What you see.** Popularity on x (about 14 to 65), rating on y (6.52 to\r\n8.25). Most films sit at popularity 14–23. The two dots at the far right,\r\npopularity 64.93 and 54.46, are Endgame and Infinity War, both rated 8.25.\r\n\r\n**What to say.** \"Higher-rated films tend to be more popular here, but the\r\ntrend is driven by a few Avengers films. TMDB popularity is a current-activity\r\nscore (page views, votes, watch-list adds), so it rewards films people are\r\nlooking at now, not total audience.\"\r\n\r\n### Chart 4 — box office by year\r\n\r\n**What you see.** A line through 9 points, one per release year with a film:\r\n1997, 2009, 2011, 2012, 2013, 2015, 2017, 2018, 2019. It peaks at 2009\r\n(Avatar alone, 2,923.71), drops to about 1,250–1,700 for most later years,\r\nand rises again in 2019.\r\n\r\n**What to say.** \"Most years hold one film, so the line follows which films\r\nare in the list: 2009 is Avatar, 1997 is Titanic. A line also suggests values\r\nbetween the points, but 1998–2008 have no films at all. It is not a market\r\ntrend, and revenue is not adjusted for inflation.\"\r\n\r\n### Chart 5 — franchise vs standalone\r\n\r\n**What you see.** Two bars of mean revenue: franchise (n=16) 1,691.70 and\r\nstandalone (n=2) 1,765.10.\r\n\r\n**What to say.** \"The standalone bar is two films, Titanic and Beauty and the\r\nBeast. Titanic alone (2,264.16) lifts it above the franchise mean. Two data\r\npoints support no conclusion.\"\r\n\r\n> **Follow-up trap:** \"Is Beauty and the Beast really standalone?\" TMDB gives\r\n> it no collection, so by the spec's rule (`belongs_to_collection` is null) it\r\n> is. A person might call it part of Disney's remake series.\r\n\r\n### Chart 6 — revenue distribution\r\n\r\n**What you see.** A histogram of `revenue_musd` in 20 buckets from the lowest\r\nrevenue (Incredibles 2, 1,243.23) to the highest (Endgame, 2,942.19). Most\r\nfilms sit in the buckets around 1,250–1,750. A dashed line marks the median,\r\n1,453.68 (that is Frozen II's revenue: `percentile_approx` returns a real\r\nvalue). After a gap come films around 2,050, one near 2,264 and two near\r\n2,930.\r\n\r\n**What to say.** \"Revenue is right-skewed: most films earn 1.2 to 1.7 billion\r\nand a few earn far more. The mean is pulled above the median, so the median\r\nis the fairer 'typical film'.\"\r\n\r\n### Chart 7 — runtime boxplot\r\n\r\n**What you see.** A box from about 124 to 149 minutes, median about 135,\r\nwhiskers from 102 (Frozen) to 181 (Endgame), and one outlier circle at 194:\r\nTitanic.\r\n\r\n**What to say.** \"Titanic is the only runtime outlier. It is a real 194-minute\r\nfilm, not a data error, so it stays.\"\r\n\r\n### Chart 8 — popularity boxplot\r\n\r\n**What you see.** A narrow box from about 15 to 35, median about 19, and a\r\nlong right whisker reaching 64.93 (Endgame). No outlier circles.\r\n\r\n**What to say.** \"Popularity is the most skewed column. Endgame sits right at\r\nthe high fence, so it is a whisker end here, not an outlier. With\r\npandas-style quartiles the answer could flip, because the fences move.\"\r\n\r\n## Things a reviewer may point at\r\n\r\n| Comment | Honest answer |\r\n|---|---|\r\n| \"Why not `ax.hist` and `ax.boxplot`?\" | They need every value in Python. Bucketing and quartiles in Spark send back only the numbers, which is what scales. |\r\n| \"Your boxplot differs from pandas.\" | `percentile_approx` picks real values; pandas interpolates. Different quartile definitions, different fences. |\r\n| \"Chart 4 draws a line across 11 empty years.\" | True. Markers only, or bars, would be more honest for gappy years. |\r\n| \"Why not plot directly from Spark?\" | Spark has no plotting. Matplotlib needs data in local memory. |\r\n| \"Chart 1 has no titles on the dots.\" | True; the top films are in the revenue table in `results.md`. `ax.annotate` could label them. |\r\n\r\n## Self-check\r\n\r\n1. Why do the `plot_*` functions return `ax` instead of saving a file?\r\n2. In `plot_distribution`, what does `F.least(..., F.lit(bins - 1))` fix?\r\n3. Why is `matplotlib.use(\"Agg\")` inside `main()` and not at the top of a module?\r\n4. Why can a Spark boxplot and a pandas boxplot of the same column show different outliers?\r\n5. Comedy has the highest bar in chart 2. Why should you not trust it?\r\n\r\nAnswers: (1) So the caller decides: `main.py` saves, the notebook shows,\r\ntests inspect. (2) The maximum value would compute to bucket number `bins`,\r\none past the last; `least` clamps it into the last bucket. (3) So importing\r\nthe code from the notebook does not switch off inline charts. (4)\r\n`percentile_approx` returns real values while pandas interpolates, so Q1, Q3\r\nand the fences differ. (5) It is one film (n=1, Frozen II).\r\n\r\nNext: [10 · Pipeline and tests](10-pipeline-and-tests.md)\r\n","study/10-pipeline-and-tests.md":"# 10 — The Pipeline Script and the Tests\r\n\r\nThis page walks through `src/main.py`, the one command that runs the whole\r\nlab, then the 32 pytest tests in `tests/` that protect the fetch, cleaning,\r\nKPI and chart rules. It ends with a commit plan for the git deliverable.\r\n\r\n> **Help:** the functions `main.py` calls are explained in [06 · Cleaning line by line](06-cleaning-line-by-line.md) and [08 · KPIs line by line](08-kpis-line-by-line.md). The charts are in [09 · Charts with Matplotlib](09-visualisation.md).\r\n\r\n## Part 1 — `src/main.py`\r\n\r\n### What it does, in one table\r\n\r\n| Stage | Code | Output |\r\n|---|---|---|\r\n| 0. Arguments, logging, backend | `argparse` (`--fetch`), `logging.basicConfig`, `matplotlib.use(\"Agg\")` | — |\r\n| 1. Fetch if needed | `save_jsonl(fetch_all())` | `data/raw_movies.jsonl` |\r\n| 2. Start Spark | `get_spark()` | one local SparkSession |\r\n| 3. Read raw, count bad lines | `cleaning.load_raw(...).cache()`, two `count()`s | log line |\r\n| 4. Clean + metrics + checks | `cleaning.clean`, `kpis.add_profit_roi`, `.cache()`, `cleaning.validate` | the `df_movies` DataFrame |\r\n| 5. Save clean data | `df_movies.coalesce(1).write.mode(\"overwrite\").parquet(...)` | `data/movies_clean.parquet/` |\r\n| 6. Tables | `md_table(...)` on value counts, nulls, rankings, searches, franchises, directors | sections of `results.md` |\r\n| 7. Charts | eight `save_chart(visualize.plot_...(df_movies), \"chartN.png\")` | `reports/chart1.png` … `chart8.png` |\r\n| 8. Stop and write | `spark.stop()` in `finally`, then `write_text` | `reports/results.md` |\r\n\r\n### How to run it, and why `-m`\r\n\r\n```powershell\r\npython -m src.main            # reuse data/raw_movies.jsonl if it is there\r\npython -m src.main --fetch    # call the api again first\r\n```\r\n\r\n`src/` is a **package** (it has an `__init__.py`), and `main.py` imports its\r\nneighbours as `from src import cleaning, kpis, visualize`. `python -m\r\nsrc.main` runs the module *as part of the package*, with the current folder\r\n(the lab root) on Python's import path, so `src` can be found. Running\r\n`python src/main.py` would put `src/` itself on the path, and `from src\r\nimport ...` would fail. So always run from the lab folder, with `-m`.\r\n\r\n### `main()`: flags, the backend, and `finally`\r\n\r\n```python\r\ndef main() -> None:\r\n    ap = argparse.ArgumentParser()\r\n    ap.add_argument(\"--fetch\", action=\"store_true\", help=\"call the tmdb api even if the raw file exists\")\r\n    args = ap.parse_args()\r\n    logging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s: %(message)s\")\r\n    matplotlib.use(\"Agg\")\r\n\r\n    if args.fetch or not RAW_PATH.exists():\r\n        save_jsonl(fetch_all())\r\n\r\n    REPORTS.mkdir(exist_ok=True)\r\n    spark = get_spark()\r\n    out: list[str] = []\r\n    try:\r\n        charts = run(spark, out)\r\n    except Exception:\r\n        log.exception(\"pipeline failed, nothing more written\")\r\n        sys.exit(1)\r\n    finally:\r\n        # always give the jvm back, even when a step failed\r\n        spark.stop()\r\n\r\n    (REPORTS / \"results.md\").write_text(\"\\n\".join(out), encoding=\"utf-8\")\r\n```\r\n\r\n| Part | Why |\r\n|---|---|\r\n| `argparse`, `action=\"store_true\"` | `--fetch` takes no value: `args.fetch` is `True` if typed, else `False` |\r\n| `args.fetch or not RAW_PATH.exists()` | fetch when asked, **or** when there is no raw file yet. With the file on disk, no network is needed |\r\n| `matplotlib.use(\"Agg\")` inside `main()` | file-only drawing for the script; the notebook, which imports the same modules, keeps inline charts |\r\n| `try / except / finally` | any failure is logged with its stack trace (`log.exception`) and the script exits with code 1. `finally` runs in both cases, so the Spark JVM is always shut down |\r\n| `results.md` written **after** the `try` | if `run()` failed, `sys.exit(1)` already left, so a half-built `results.md` is never written |\r\n| `out = []` passed into `run` | `run` appends Markdown sections to the list; `main` joins and writes them at the end |\r\n\r\n### `run()`: read, count bad lines, cache\r\n\r\n```python\r\ndf_raw = cleaning.load_raw(spark, RAW_PATH).cache()\r\n# counting only _corrupt_record straight off the file is not allowed in\r\n# spark, the cache above is what makes this count work\r\nbad = df_raw.filter(F.col(\"_corrupt_record\").isNotNull()).count()\r\nraw_rows = df_raw.count()\r\nlog.info(\"raw rows: %d, unreadable lines: %d\", raw_rows, bad)\r\n```\r\n\r\n- `load_raw` reads the file with the explicit `RAW_SCHEMA` in **PERMISSIVE**\r\n  mode: a line that is not valid JSON does not crash the read; its text goes\r\n  into a `_corrupt_record` column and the other columns are null. See\r\n  [11 · Hard concepts §8](11-hard-concepts-explained.md#h-8-schema-on-read-raw-schema-permissive-and-corrupt-record).\r\n- Spark refuses a query on a raw JSON file whose only referenced column is\r\n  `_corrupt_record`; caching the DataFrame first makes it allowed. That is\r\n  what the comment means.\r\n- On this data: `raw: 18 movies (0 unreadable lines)` (first line of\r\n  `results.md`).\r\n\r\n### `run()`: clean, cache, validate, unpersist\r\n\r\n```python\r\ndf_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()\r\nchecks = cleaning.validate(df_movies)\r\ndf_raw.unpersist()\r\n```\r\n\r\n- Spark is **lazy**: `clean(...)` only builds a plan. Each **action** (an\r\n  operation that needs a real result: `count`, `collect`, `first`, `write`,\r\n  `toPandas`) runs the plan from the start. `df_movies` feeds the Parquet\r\n  write, 5 value-count tables, the null table, 10 rankings, 2 searches, 3\r\n  group tables and 8 charts. Without `cache()` each would redo the read and\r\n  every cleaning step.\r\n- `cache()` is itself lazy. `validate()` runs the first action on\r\n  `df_movies` (one `agg(...).first()`), so it is what fills the cache.\r\n- After that, nothing reads `df_raw` again, so `unpersist()` frees its\r\n  memory.\r\n- `validate()` checks rows > 0, unique ids, no null titles, no budget or\r\n  revenue ≤ 0, ratings within 0–10, all in **one** aggregation, and raises\r\n  `ValueError` if any fails. Because it raises, the `except` in `main()`\r\n  catches it and nothing is written. Here: \"data checks passed\" on 18 rows.\r\n\r\n### Saving to Parquet\r\n\r\n```python\r\ndf_movies.coalesce(1).write.mode(\"overwrite\").parquet(str(CLEAN_PATH))\r\n```\r\n\r\n- **Parquet** is a column-based file format. It stores the schema with the\r\n  data, compresses well, and lets a reader load only the columns it needs.\r\n  A CSV stores text and loses types: dates come back as strings.\r\n- `coalesce(1)` merges the partitions into one before writing, so the folder\r\n  holds one part file instead of several tiny ones. Unlike `repartition(1)`,\r\n  it does this without a shuffle.\r\n- `mode(\"overwrite\")` replaces the folder; the default mode (`\"error\"`)\r\n  would fail on the second run.\r\n- Spark writes a **folder**: `data/movies_clean.parquet/` with a `_SUCCESS`\r\n  marker and a `part-00000-...snappy.parquet` file.\r\n- On Windows this line needs **winutils** and `HADOOP_HOME`. Without them it\r\n  fails with `UnsatisfiedLinkError ... NativeIO$Windows`. See\r\n  [01 · Setting up Spark on Windows](01-setup-windows.md).\r\n\r\n### `md_table`: a DataFrame as a Markdown table\r\n\r\n```python\r\ndef md_table(df: DataFrame, max_rows: int = 50) -> str:\r\n    rows = df.limit(max_rows).collect()\r\n    if not rows:\r\n        return \"_no rows_\\n\"\r\n\r\n    def fmt(v: object) -> str:\r\n        if v is None:\r\n            return \"\"\r\n        if isinstance(v, float):\r\n            return f\"{v:,.2f}\"\r\n        return str(v).replace(\"|\", \"\\\\|\")\r\n\r\n    head = \"| \" + \" | \".join(df.columns) + \" |\\n|\" + \"---|\" * len(df.columns) + \"\\n\"\r\n    return head + \"\".join(\"| \" + \" | \".join(fmt(r[c]) for c in df.columns) + \" |\\n\" for r in rows)\r\n```\r\n\r\n| Line | Why |\r\n|---|---|\r\n| `df.limit(max_rows).collect()` | `limit` first, so at most 50 rows reach the driver. `collect()` returns a list of `Row` objects |\r\n| `\"_no rows_\\n\"` | an empty search shows a readable line, not a header with no body |\r\n| `v is None → \"\"` | a null shows as an empty cell |\r\n| `f\"{v:,.2f}\"` | floats get a thousands separator and 2 decimals: `2,942.19` |\r\n| `.replace(\"\\|\", \"\\\\\\|\")` | a `\\|` inside a value would break the Markdown table, so it is escaped |\r\n| `\"---\\|\" * n` | the separator row Markdown needs under the header |\r\n\r\nIntegers are not floats in Python, so `vote_count` prints as `40259`, with no\r\ncomma, while money prints as `2,942.19`.\r\n\r\n### Two more details in `run()`\r\n\r\n```python\r\nnulls = df_movies.select([F.count_if(F.col(c).isNull()).alias(c) for c in df_movies.columns])\r\n```\r\n\r\nOne `count_if(col IS NULL)` per column, computed in a single `select`.\r\nResult: 0 everywhere except `belongs_to_collection` (2: the standalone\r\nfilms).\r\n\r\n```python\r\nfound = frame.cache()\r\nout.append(f\"### {name}\\n\\n{found.count()} matches.\\n\\n\" + md_table(found))\r\nfound.unpersist()\r\n```\r\n\r\nEach search result is used twice (count, then table), so it is cached for\r\nthose two actions and released straight after.\r\n\r\n### How to read `reports/results.md`\r\n\r\n| Section | What it holds | Key number |\r\n|---|---|---|\r\n| data | raw lines, bad lines, rows and columns after cleaning | 18 raw, 0 unreadable, 18 clean, 25 columns |\r\n| cleaned movies | 11 key columns, ordered by `idx` (which follows `id`) | `idx 0` = Titanic (id 597) |\r\n| value counts (step 2.4) | one table per extracted column, top 15 | Adventure 15, Action 10, Science Fiction 10 |\r\n| nulls per column | one row of counts | only `belongs_to_collection` = 2 |\r\n| best and worst (step 3.1) | 10 top-5 tables | Endgame top revenue 2,942.19 |\r\n| searches (step 3.2) | match count + table | **0 matches** for both |\r\n| franchise vs standalone (step 3.3) | 2-row comparison | 16 vs 2 films |\r\n| most successful franchises (step 3.4) | top 10 by `total_revenue` | The Avengers Collection 7,918.80 |\r\n| most successful directors (step 3.5) | top 10 by `total_revenue` | James Cameron 5,187.90 |\r\n| charts (step 4) | image links to the 8 PNGs | — |\r\n\r\nMoney is in **million USD** everywhere. \"0 matches\" for both searches is the\r\nright answer for these 18 IDs; the tests prove the searches find a match\r\nwhen one exists.\r\n\r\n## Part 2 — pytest from zero\r\n\r\n### What a test is\r\n\r\n**pytest** is the standard Python test runner. A **test** is a function\r\nwhose name starts with `test_`, in a file whose name starts with `test_`.\r\npytest finds them, runs them, and reports which passed. Inside a test you\r\nuse **`assert`**: it does nothing when the condition is true and raises\r\n`AssertionError` when false; pytest shows both sides.\r\n\r\n```python\r\ndef test_profit_and_roi(spark: SparkSession) -> None:\r\n    row = first(enriched(spark, movie(budget=100_000_000, revenue=450_000_000)))\r\n    assert row.profit_musd == 350.0\r\n    assert row.roi == 4.5\r\n```\r\n\r\nRun all tests from the lab folder with `pytest` (or `python -m pytest -q`;\r\n`-q` is quiet, one dot per passing test). Result on this laptop:\r\n`32 passed in 590.11s (0:09:50)`, almost ten minutes (why, and how to speed\r\nit up, is at the end of this part).\r\n\r\n### Fixtures and `conftest.py`\r\n\r\nA **fixture** is a function that prepares something a test needs. A test\r\nasks for it by naming it as a parameter; pytest runs the fixture and passes\r\nthe result in.\r\n\r\n```python\r\n@pytest.fixture(scope=\"session\")\r\ndef spark() -> Iterator[SparkSession]:\r\n    # one spark for the whole test run. starting the jvm takes a few seconds,\r\n    # doing it per test would make the suite crawl.\r\n    s = get_spark(\"tmdb-tests\")\r\n    yield s\r\n    s.stop()\r\n```\r\n\r\n- `yield s` hands `s` to the tests; code after `yield` runs at the end as\r\n  cleanup.\r\n- `scope=\"session\"`: **one** SparkSession for the whole run. The default\r\n  scope, `\"function\"`, would start and stop Spark for every test.\r\n- It calls the same `get_spark()` as `main.py` and the notebook, so tests run\r\n  with the same settings.\r\n- `tests/conftest.py` is a special file name: pytest loads it first, and its\r\n  fixtures are available to every test file in the folder with no import.\r\n\r\n### `tests/helpers.py`: the test data\r\n\r\n`helpers.py` is a plain module (imported as `from tests.helpers import ...`;\r\n`tests/__init__.py` makes `tests` a package). It holds four functions.\r\n\r\n**`movie(**changes)`, a factory.** A **factory** is a function that builds\r\ntest data. `movie()` returns one complete, valid, fake TMDB record shaped\r\nlike a line of `raw_movies.jsonl`. `**changes` collects keyword arguments\r\ninto a dict, and `m.update(changes)` replaces only those keys:\r\n\r\n```python\r\nmovie(budget=0, revenue=2_500_000)        # everything normal except the money\r\nmovie(id=3, title=None)                   # a film with no title\r\n```\r\n\r\nEach test states only what is special about its case.\r\n\r\n**`raw_df(spark, records, extra_lines=())`.** Builds a raw DataFrame the\r\nsame way `main.py` reads the file:\r\n\r\n```python\r\nlines = [json.dumps(r) for r in records] + list(extra_lines)\r\nrdd = spark.sparkContext.parallelize(lines)\r\nreturn (spark.read.schema(cleaning.RAW_SCHEMA)\r\n        .option(\"mode\", \"PERMISSIVE\")\r\n        .option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")\r\n        .json(rdd))\r\n```\r\n\r\n`json.dumps` turns each dict into a JSON string; `parallelize` turns the\r\nPython list into an **RDD** (Spark's older, lower-level distributed list);\r\n`spark.read...json(rdd)` reads those strings with the real schema and\r\noptions. `extra_lines` lets a test add raw text, such as a broken JSON line.\r\n\r\n**`cleaned(spark, *records)`** = `cleaning.clean(raw_df(...))`, and\r\n**`enriched(spark, *records)`** = `kpis.add_profit_roi(cleaned(...))`. Short\r\nnames for the two most common set-ups.\r\n\r\n### Every test and the rule it protects\r\n\r\n**`tests/test_cleaning.py`** (15 tests, Step 2)\r\n\r\n| Test | Rule it protects |\r\n|---|---|\r\n| `test_final_columns` | `FINAL_COLUMNS` has 22 names and starts with `id` |\r\n| `test_columns_come_out_in_brief_order` | output is `idx` + the 22 columns, in spec order (2.10) |\r\n| `test_nested_columns_become_pipe_text` | genres → `\"Action\\|Science Fiction\"`, collection → its name, languages → `english_name`, cast joined, sizes = 2, director from crew (2.3) |\r\n| `test_two_directors_both_kept` | two directors give `\"A\\|B\"`, not just the first |\r\n| `test_empty_lists_become_null` | empty cast, crew, genres → null; `cast_size` → 0 |\r\n| `test_zero_money_is_null_and_rest_is_millions` | budget 0 → null; revenue 2,500,000 → 2.5 (2.6) |\r\n| `test_no_votes_means_no_rating` | `vote_count = 0` → `vote_average` null (2.6) |\r\n| `test_placeholders_become_null` | `\"No Data\"` and a blank tagline → null (2.6) |\r\n| `test_bad_values_become_null_not_a_crash` | `\"not a date\"` and budget `\"lots\"` → null, no crash (2.5) |\r\n| `test_broken_json_line_is_dropped` | a truncated line `{\"id\": 2, \"title\": ` is dropped; 1 row remains |\r\n| `test_dupes_unreleased_and_no_title_removed` | from ids 1, 1, 2 (Post Production), 3 (no title), 4 only 1 and 4 survive (2.7, 2.9) |\r\n| `test_idx_starts_at_zero` | ids 30, 10, 20 get `idx` 0, 1, 2 in id order (2.11) |\r\n| `test_inspect_anomalies_splits_cells` | `\"Action\\|Science Fiction\"` counts once per genre (2.4) |\r\n| `test_validate_passes_on_good_data` | `validate` returns `rows = 2` on two good films |\r\n| `test_validate_stops_on_empty_table` | a \"Rumored\" film is filtered out, leaving 0 rows; `validate` raises \"no rows\" |\r\n\r\n**`tests/test_kpis.py`** (10 tests, Step 3)\r\n\r\n| Test | Rule it protects |\r\n|---|---|\r\n| `test_profit_and_roi` | 450 − 100 = 350; 450 / 100 = 4.5 |\r\n| `test_rank_skips_nulls_and_uses_threshold` | a 5 M-budget film is excluded by `ROI_MIN_BUDGET_MUSD`; a film with no budget never appears in \"low roi\" |\r\n| `test_rankings_has_all_ten_lists` | `rankings` returns 10 tables |\r\n| `test_has_matches_whole_names_only` | `\"Bruce Willis Jr\"` does not match `\"Bruce Willis\"` |\r\n| `test_willis_search` | the Sci-Fi Action film is found, the Drama one is not |\r\n| `test_tarantino_search_shortest_first` | runtime 110 comes before 150 |\r\n| `test_codirectors_both_get_the_revenue` | co-directors A and B each get the film's 200 M |\r\n| `test_franchise_split` | collection → franchise; null → standalone |\r\n| `test_top_franchises_sums_revenue` | two films of 100 M and 300 M give `total_revenue` 400 |\r\n| `test_udf_gives_same_roi_as_builtin` | `roi_udf` and the built-in division agree, including a null budget |\r\n\r\n**`tests/test_tmdb_client.py`** (5 tests, Step 1, no network)\r\n\r\n| Test | Rule it protects |\r\n|---|---|\r\n| `test_movie_ids_match_lab_spec` | 19 IDs, the first is 0 |\r\n| `test_404_is_skipped` | a 404 returns `None` |\r\n| `test_429_then_ok_retries` | a 429 then a 200 gives the film, after 2 calls |\r\n| `test_gives_up_after_three_tries` | three 503s give `None` after exactly 3 calls |\r\n| `test_save_jsonl_one_movie_per_line` | one JSON object per line, and no `.tmp` file left behind |\r\n\r\nThese use a `FakeSession` whose `get()` returns a `FakeResponse` with the\r\nnext status from a list, so no real HTTP call is made. `monkeypatch` (a\r\nbuilt-in pytest fixture that swaps something out for one test) replaces\r\n`time.sleep` with a function that does nothing, so the back-off waits take\r\nno time. `tmp_path` (another built-in fixture) gives an empty temporary\r\nfolder.\r\n\r\n**`tests/test_visualize.py`** (2 tests, Step 4)\r\n\r\n| Test | Rule it protects |\r\n|---|---|\r\n| `test_histogram_counts_every_movie` | 5 films in 4 buckets: bar heights add up to 5 |\r\n| `test_boxplot_draws` | the Spark-side boxplot draws, with title \"runtime boxplot\" |\r\n\r\nThe search tests matter because the real data gives **0 matches** for both\r\nsearches. Without them a reviewer could ask: \"How do you know the search\r\nworks at all?\"\r\n\r\n### The schema-inference story\r\n\r\nAn earlier version read the raw file with Spark guessing the types\r\n(**schema inference**). A test where every record had `\"cast\": []` then\r\nfailed with `AnalysisException ... requires INTEGRAL type`:\r\n\r\n1. An empty list gives no clue what is inside it. Spark guessed\r\n   `array\u003cstring>`.\r\n2. `credits.cast.name` on an array of structs means \"the `name` field of each\r\n   element\". On an array of strings there are no fields, so Spark tried to\r\n   read `name` as an array position, which must be an integer.\r\n\r\nThe code now reads with the explicit `RAW_SCHEMA`, where `cast` is always an\r\narray of structs with `name`. The comment in `test_empty_lists_become_null`\r\nrecords it: \"with inferSchema this broke ... the fixed schema means one movie\r\non its own is enough now.\"\r\n\r\n### Why Spark tests are slow, and how to speed them up\r\n\r\n32 tests on a handful of rows each should take seconds. They take minutes\r\nbecause every Spark **action** has a fixed cost (planning, starting tasks,\r\nmoving data between the JVM and Python), and on Windows that cost is high.\r\nEach test runs at least one action, and several steps **shuffle** (move rows\r\nbetween partitions): `dropDuplicates`, `groupBy`, `orderBy`, and the\r\n`row_number()` window.\r\n\r\n| Change (none applied) | Why it helps |\r\n|---|---|\r\n| Fewer actions per test (collect once, assert on the list) | each action pays the fixed cost |\r\n| `SPARK_MASTER=local[1]` for tests | one thread: less scheduling overhead on tiny data |\r\n| `SPARK_SHUFFLE_PARTITIONS=1` for tests | each shuffle makes 1 task instead of 4 |\r\n| `spark.ui.enabled=false` | skips starting the Spark web UI |\r\n| Share one cleaned DataFrame per module (`scope=\"module\"` fixture) | clean once, assert many times |\r\n\r\nBecause `get_spark()` reads the master and partition count from environment\r\nvariables, the first two need no code change:\r\n\r\n```powershell\r\n$env:SPARK_MASTER=\"local[1]\"; $env:SPARK_SHUFFLE_PARTITIONS=\"1\"; pytest\r\n```\r\n\r\nThe trade-off: tests then run with different settings from the pipeline.\r\n\r\n## Part 3 — Git commit plan\r\n\r\nThe deliverable asks for \"clear commits and organized structure\". The plan is\r\none commit per lab step, so the history reads like the spec.\r\n\r\n| # | Commit message | Files |\r\n|---|---|---|\r\n| 1 | `project skeleton: spark session, requirements, gitignore` | `requirements.txt`, `.gitignore`, `.env.example`, `src/__init__.py`, `src/spark_session.py`, `data/README.md` |\r\n| 2 | `step 1: fetch 19 tmdb ids with credits, save json lines` | `src/tmdb_client.py`, `tests/__init__.py`, `tests/test_tmdb_client.py` |\r\n| 3 | `step 2: raw schema, cleaning rules, data checks, tests` | `src/cleaning.py`, `tests/conftest.py`, `tests/helpers.py`, `tests/test_cleaning.py` |\r\n| 4 | `step 3: kpis, searches, franchises, directors, tests` | `src/kpis.py`, `tests/test_kpis.py` |\r\n| 5 | `step 4: charts and main pipeline` | `src/visualize.py`, `src/main.py`, `tests/test_visualize.py`, `reports/results.md`, `reports/chart*.png` |\r\n| 6 | `notebook, final report and readme` | `analysis.ipynb`, `reports/final_report.md`, `README.md` |\r\n| 7 | `study notes` | `study/` |\r\n\r\nRules behind the plan:\r\n\r\n- **Never commit `.env`.** It holds the API key. `.env.example` shows the\r\n  variable names with empty values.\r\n- **`data/` is not committed** except `data/README.md` (`data/*` then\r\n  `!data/README.md` in `.gitignore`). Both the raw file and the Parquet are\r\n  rebuilt by the code; the README in `data/` says how.\r\n- `__pycache__/`, `.pytest_cache/`, `.ipynb_checkpoints/`, `spark-warehouse/`,\r\n  `metastore_db/`, `derby.log`, `*.crc` are build or Spark side files, all\r\n  ignored.\r\n- Each commit should pass the tests that exist at that point.\r\n\r\nCheck before committing:\r\n\r\n```powershell\r\ngit status            # nothing unexpected, no .env, nothing under data/ except README.md\r\ngit diff --staged     # read what you are about to commit\r\n```\r\n\r\n## Self-check\r\n\r\n1. When does `python -m src.main` call the TMDB API?\r\n2. `cache()` is lazy. Which call in `run()` fills the cache of `df_movies`?\r\n3. Why is `spark.stop()` in a `finally` block?\r\n4. How do the `tmdb_client` tests avoid both the network and the back-off waits?\r\n5. Why is `raw_df` in `helpers.py` written with `RAW_SCHEMA` and PERMISSIVE instead of `spark.createDataFrame(records)`?\r\n\r\nAnswers: (1) With `--fetch`, or when `data/raw_movies.jsonl` does not exist.\r\n(2) `cleaning.validate(df_movies)`, the first action on it. (3) So the JVM\r\nis released even when a step raises. (4) A `FakeSession` returns preset\r\nstatuses, and `monkeypatch` replaces `time.sleep` with a no-op. (5) So tests\r\nread data exactly as `main.py` does, including the schema and the\r\ncorrupt-line handling.\r\n\r\nNext: [11 · Hard concepts explained](11-hard-concepts-explained.md)\r\n","study/11-hard-concepts-explained.md":"# 11 — The Hard Parts, Explained Simply\r\n\r\nThese are the Spark ideas in this lab that are easy to name and hard to\r\nexplain when a reviewer asks \"why?\". Many of them are the choices listed\r\nunder \"spark choices\" in the [README](../README.md). Each section has:\r\n\r\n> **Help:** if a function name below is new, look it up in [14 · PySpark function reference](14-pyspark-function-reference.md). DataFrame basics are in [05 · DataFrame fundamentals](05-dataframe-fundamentals.md) and what Spark is in [02 · What Spark is](02-what-is-spark.md).\r\n\r\n- **Plain idea**: the concept without jargon.\r\n- **In this project**: where it shows up in the code, with real numbers.\r\n- **Line to say in review**: a short answer to practise out loud.\r\n- **Follow-up trap**: the next question a reviewer is likely to ask.\r\n\r\nTwo words used everywhere below:\r\n\r\n- **Driver**: the one Python process that runs your script and plans the work.\r\n- **Executors**: the worker processes that do the work on chunks of data\r\n  called **partitions**. With `master(\"local[*]\")` the executors are threads\r\n  on this laptop, one per CPU core.\r\n\r\n---\r\n\r\n## 1. Lazy evaluation\r\n\r\n**Plain idea.** When you write `df.filter(...)` or `df.withColumn(...)`,\r\nSpark does not touch the data. It only adds a step to a **plan** (a recipe).\r\nThe data is read and processed only when you ask for a real answer. Seeing\r\nthe whole recipe first lets Spark optimise it, for example by reading only\r\nthe columns you use.\r\n\r\n**In this project.** `cleaning.clean(df_raw)` chains twelve steps with\r\n`.transform(...)` and returns at once, whatever the data size: nothing has\r\nrun. The module docstring says it: \"nothing runs until something asks for a\r\nresult (count, show, write), so clean() is just building a plan.\" The\r\nnotebook cell `df_cleaned.explain()` prints that plan; its comment says to\r\nread it bottom up: scan the JSON with the schema, the filters and projects\r\nfrom `clean()`, then the window for `idx`.\r\n\r\n**Line to say in review.** \"Transformations build a plan; nothing runs until\r\nan action. That is why `clean()` returns instantly, and why Spark's optimiser\r\n(Catalyst) can prune columns and push filters into the file reader.\"\r\n\r\n**Follow-up trap.** \"Then where would an error in `clean()` show up?\" → A\r\nwrong column name fails early, when the plan is checked. A bad *value* (say,\r\na failed cast in ANSI mode) only fails when the data is processed, so the\r\nstack trace points at the action, not the line that caused it.\r\n\r\n---\r\n\r\n## 2. Transformations vs actions\r\n\r\n**Plain idea.**\r\n- A **transformation** returns a new DataFrame and is lazy: `select`,\r\n  `filter`, `withColumn`, `drop`, `groupBy().agg()`, `orderBy`,\r\n  `dropDuplicates`, `limit`, `coalesce`.\r\n- An **action** returns a result to Python or writes data, and triggers a\r\n  **job** (a unit of work Spark schedules): `count`, `collect`, `first`,\r\n  `show`, `toPandas`, `write...parquet`.\r\n\r\n**In this project.**\r\n\r\n| Code | Kind |\r\n|---|---|\r\n| `cleaning.clean(...)`, `kpis.add_profit_roi(...)`, `kpis.rank(...)` | transformations (return DataFrames) |\r\n| `df_raw.count()`, `found.count()` | actions |\r\n| `cleaning.validate(df)`: `df.agg(...).first()` | action |\r\n| `df_movies.coalesce(1).write.mode(\"overwrite\").parquet(...)` | action |\r\n| `df.limit(max_rows).collect()` in `md_table` | `limit` is a transformation, `collect` the action |\r\n| `.toPandas()` in the chart functions | action |\r\n\r\n**Line to say in review.** \"If it gives back a DataFrame, it is a\r\ntransformation. If it gives back Python data or writes a file, it is an\r\naction, and that is when Spark actually runs.\"\r\n\r\n**Follow-up trap.** \"Is `cache()` an action?\" → No. It only marks the\r\nDataFrame to be kept; the next action fills the cache (§3).\r\n\r\n---\r\n\r\n## 3. `cache()` and `unpersist()`\r\n\r\n**Plain idea.** Every action re-runs the whole plan from the source. If you\r\nuse the same DataFrame thirty times, Spark rebuilds it thirty times.\r\n`cache()` says: \"the first time you compute this, keep the result in\r\nmemory.\" Later actions start from the stored result. `unpersist()` frees\r\nthat memory when you are done.\r\n\r\n**In this project.** `run()` in `main.py`:\r\n\r\n```python\r\ndf_raw = cleaning.load_raw(spark, RAW_PATH).cache()\r\n...\r\ndf_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()\r\nchecks = cleaning.validate(df_movies)\r\ndf_raw.unpersist()\r\n...\r\nfound = frame.cache()          # each search result: count, then table\r\n...\r\nfound.unpersist()\r\n...\r\ndf_movies.unpersist()\r\n```\r\n\r\n- `df_raw` is cached so the two counts (bad lines, all lines) and the clean\r\n  step read the file once. It also makes the `_corrupt_record` count legal\r\n  (§8).\r\n- `df_movies` feeds the Parquet write, 5 value-count tables, the null table,\r\n  10 rankings, 2 searches, 3 group tables and 8 charts. `validate()` is its\r\n  first action, so it fills the cache.\r\n- Once `df_movies` is cached, `df_raw` is no longer read, so it is released.\r\n- Each search result is used twice, so it is cached for two actions only.\r\n\r\n**Line to say in review.** \"I cache what is reused and unpersist it when it\r\nis not needed any more. `cache()` is lazy: `validate()` is the first action\r\non the clean table, so it is what fills the cache.\"\r\n\r\n**Follow-up trap.** \"Why not cache everything?\" → Caching uses executor\r\nmemory, and caching something used once only adds cost. Cache a DataFrame\r\nthat is expensive to build and used several times.\r\n\r\n---\r\n\r\n## 4. Shuffles, `spark.sql.shuffle.partitions` and AQE\r\n\r\n**Plain idea.** Some operations need rows with the same key in the same\r\nplace: `groupBy`, `orderBy`, `dropDuplicates`, joins, windows. Spark moves\r\nrows between partitions to get there. That move is a **shuffle**: data is\r\nwritten out, sent across, and read back. It is the most expensive thing Spark\r\ndoes. After a shuffle the data is split into `spark.sql.shuffle.partitions`\r\npieces; the default is **200**. **AQE** (Adaptive Query Execution) looks at\r\nthe real size of the shuffled data at run time and merges small partitions.\r\n\r\n**In this project.** `spark_session.py`:\r\n\r\n```python\r\n# default is 200 shuffle partitions. for 18 rows that is 200 near\r\n# empty tasks after every groupBy. AQE would merge them anyway, but\r\n# starting small keeps the spark ui readable.\r\n.config(\"spark.sql.shuffle.partitions\", os.getenv(\"SPARK_SHUFFLE_PARTITIONS\", \"4\"))\r\n.config(\"spark.sql.adaptive.enabled\", \"true\")\r\n.config(\"spark.sql.adaptive.coalescePartitions.enabled\", \"true\")\r\n```\r\n\r\nEvery `groupBy` in `kpis.py`, every `orderBy` in `rank`, and\r\n`dropDuplicates` in `filter_released_and_dedup` shuffle.\r\n\r\n**Line to say in review.** \"Each shuffle splits its output into\r\n`shuffle.partitions` pieces. 200 is sized for big clusters; for 18 rows that\r\nis 200 near-empty tasks. I start at 4 and leave AQE on, which can merge\r\nfurther. The number comes from an env var, so a cluster run can raise it.\"\r\n\r\n**Follow-up trap.** \"If AQE merges them anyway, why set 4?\" → AQE is on by\r\ndefault since Spark 3.2 and would fix most of it. Setting 4 makes the intent\r\nexplicit and keeps the Spark UI readable. On a real cluster you size it to\r\nthe data, roughly 100–200 MB per partition.\r\n\r\n---\r\n\r\n## 5. Python UDFs vs built-in functions\r\n\r\n**Plain idea.** A **UDF** (user-defined function) is your own Python\r\nfunction applied to each row. Spark's engine runs in the **JVM** (Java\r\nVirtual Machine), not in Python. For a Python UDF, every row is converted,\r\nsent to a separate Python worker process, computed, and sent back, and the\r\noptimiser cannot see inside it. Built-in functions (`F.col(a) / F.col(b)`,\r\n`F.when`, `F.split`) stay in the JVM.\r\n\r\n**In this project.** The spec asks for a \"UDF to streamline ranking\". The\r\ncode answers in two ways:\r\n\r\n- `kpis.rank(df, col, n=5, ascending=False, where=None)` is a reusable\r\n  Python **function** that builds each ranking from built-ins. It is the\r\n  \"UDF\" in the everyday sense: one function for all 10 lists.\r\n- `kpis.roi_udf` is a real Spark UDF, kept for comparison only:\r\n\r\n```python\r\n@F.udf(returnType=T.DoubleType())\r\ndef roi_udf(revenue: float | None, budget: float | None) -> float | None:\r\n    if revenue is None or budget is None or budget == 0:\r\n        return None\r\n    return revenue / budget\r\n```\r\n\r\nThe pipeline uses the built-in division in `add_profit_roi`.\r\n`test_udf_gives_same_roi_as_builtin` proves the two agree. The notebook's\r\n\"udf vs built in\" section shows the plan for the UDF contains\r\n`ArrowEvalPython`: the step where rows leave the JVM for Python.\r\n\r\n**Line to say in review.** \"`rank` is my ranking function, built from Spark\r\ncolumn code so it runs at full speed. I also wrote a true Spark UDF for ROI,\r\nwith a test showing it matches the built-in, but the pipeline does not use\r\nit: a Python UDF ships every row to Python and back and blocks the\r\noptimiser.\"\r\n\r\n**Follow-up trap.** \"When would you use a UDF then?\" → Only when no built-in\r\ncan do it, for example calling a Python library per row. Even then prefer a\r\n**pandas UDF** (`@F.pandas_udf`), which works on Arrow batches instead of\r\nsingle rows.\r\n\r\n---\r\n\r\n## 6. ANSI mode and `try_cast`\r\n\r\n**Plain idea.** **ANSI mode** makes Spark follow the SQL standard strictly:\r\nbad input raises an error instead of quietly becoming null. Spark 4 turns it\r\non by default. Under ANSI, `CAST('abc' AS DOUBLE)` fails with\r\n`CAST_INVALID_INPUT`, and dividing by zero fails with `DIVIDE_BY_ZERO`.\r\n`try_cast` and `try_to_timestamp` return null instead.\r\n\r\n**In this project.** `RAW_SCHEMA` reads plain fields as **strings** on\r\npurpose (\"this is the raw layer\"), and `convert_dtypes` types them:\r\n\r\n```python\r\n# spark 4 has ansi mode on, so a plain .cast(\"double\") on \"abc\" throws and\r\n# the whole job dies. try_cast gives null instead, which is what\r\n# pd.to_numeric(errors=\"coerce\") did in the pandas version.\r\n.withColumn(\"budget\", F.expr(\"try_cast(budget AS DOUBLE)\"))\r\n.withColumn(\"release_date\", F.expr(\"CAST(try_to_timestamp(release_date, 'yyyy-MM-dd') AS DATE)\"))\r\n```\r\n\r\n`test_bad_values_become_null_not_a_crash` feeds `release_date=\"not a date\"`\r\nand `budget=\"lots\"` and checks both come out null.\r\n\r\nA second guard: `clean_unrealistic_values` turns a 0 budget into null\r\n**before** `add_profit_roi` divides by it. Null / anything is null, so ROI is\r\nnull instead of a `DIVIDE_BY_ZERO` error. The comment in `add_profit_roi`\r\nsays so: \"dividing by a null budget is null too, so no divide by zero.\"\r\n\r\n**Line to say in review.** \"Spark 4 runs in ANSI mode, so a plain cast fails\r\nthe whole job on one bad value. I read raw fields as strings and type them\r\nwith `try_cast`, so a bad value becomes null, like `errors=\"coerce\"` in\r\npandas.\"\r\n\r\n**Follow-up trap.** \"Isn't silently nulling bad data dangerous?\" → It can\r\nhide problems, so two checks follow: `results.md` prints the nulls per\r\ncolumn (all 0 except `belongs_to_collection`: 2, the standalone films), and\r\n`validate()` stops the run on null titles or out-of-range values.\r\n\r\n---\r\n\r\n## 7. Nulls: no fake zeros\r\n\r\n**Plain idea.** **Null** means \"unknown\". Zero means \"we know it is zero\". A\r\nTMDB budget of 0 means nobody entered it, not that the film was free. Keep\r\nthe 0 and the average budget drops and the film's ROI is infinite. Rules:\r\n\r\n| Situation | Result |\r\n|---|---|\r\n| `null > 5`, `null = null` | null (not true, not false) |\r\n| `filter(...)` on a null condition | row dropped |\r\n| `avg`, `sum`, `count(col)` | skip nulls |\r\n| `count(\"*\")` | counts every row |\r\n| `null - x`, `null / x` | null |\r\n| `orderBy(col)` ascending | nulls **first** |\r\n| `orderBy(F.desc(col))` | nulls **last** |\r\n\r\n**In this project.**\r\n- `clean_unrealistic_values`: budget, revenue, runtime ≤ 0 → null;\r\n  `vote_average` → null when `vote_count = 0`; placeholders like `\"No Data\"`\r\n  → null.\r\n- `pipe_join_names` and `extract_credits` use `F.when(x != \"\", x)` with no\r\n  `otherwise()`, so an empty list gives null, not `\"\"`.\r\n- `rank` drops null rows first: \"otherwise a film with no budget would sit\r\n  at the top of 'lowest roi'\", because an ascending sort puts nulls first.\r\n\r\n**Line to say in review.** \"Zero means 'unknown' in TMDB, so I store null.\r\nAverages skip those rows instead of being dragged down, and `rank` drops\r\nnulls so a film with no budget can never top 'lowest ROI'.\"\r\n\r\n**Follow-up trap.** \"How many nulls did that create in your 18 films?\" →\r\nNone: the null table in `results.md` is 0 for every column except\r\n`belongs_to_collection`. The rules are proven by tests\r\n(`test_zero_money_is_null_and_rest_is_millions`,\r\n`test_no_votes_means_no_rating`, `test_rank_skips_nulls_and_uses_threshold`),\r\nnot by this data.\r\n\r\n---\r\n\r\n## 8. Schema on read: `RAW_SCHEMA`, PERMISSIVE and `_corrupt_record`\r\n\r\n**Plain idea.** A **schema** is the list of column names and types. Spark can\r\n**infer** it (read the data and guess) or you can **give** it. Guessing costs\r\nan extra pass over the file, and the guess depends on what the data happens\r\nto contain. A given schema is faster and the same on every run.\r\n\r\n**Read modes** decide what happens to a line that is not valid JSON:\r\n**FAILFAST** stops the job; **DROPMALFORMED** silently drops it;\r\n**PERMISSIVE** (the default) keeps the row, sets its fields to null, and puts\r\nthe raw text in a column you name, here `_corrupt_record`.\r\n\r\n**In this project.** `cleaning.py`:\r\n\r\n```python\r\ndef load_raw(spark: SparkSession, path: str | Path) -> DataFrame:\r\n    \"\"\"Read the json lines file with my schema. bad lines go to _corrupt_record.\"\"\"\r\n    return (\r\n        spark.read\r\n        .schema(RAW_SCHEMA)\r\n        .option(\"mode\", \"PERMISSIVE\")\r\n        .option(\"columnNameOfCorruptRecord\", \"_corrupt_record\")\r\n        .json(str(path))\r\n    )\r\n```\r\n\r\nThe comment above `RAW_SCHEMA` gives three reasons: inference reads the whole\r\nfile once just to work out types; a guess can change between files (\"a file\r\nwhere every cast list is empty gets guessed as array\u003cstring> and then\r\ncast.name breaks\", which really happened in an earlier version's tests); and\r\nfields not listed are skipped, so new API fields cannot break the code.\r\n\r\n`_corrupt_record` must be listed in the schema to be filled. `main.py` counts\r\nthe bad lines and `drop_corrupt_rows` removes them. `results.md`: \"raw: 18\r\nmovies (0 unreadable lines)\". `test_broken_json_line_is_dropped` adds a\r\ntruncated line and checks one row remains. Spark refuses a query that reads\r\n**only** `_corrupt_record` straight from a JSON file; the `.cache()` on\r\n`df_raw` is what makes the count allowed.\r\n\r\n**Line to say in review.** \"I give Spark the schema instead of letting it\r\nguess: no extra pass, stable types, and a broken line goes to\r\n`_corrupt_record` and is counted instead of crashing the run.\"\r\n\r\n**Follow-up trap.** \"Why are budget and id strings in the schema?\" → It is\r\nthe raw layer. If a field ever arrives as `\"lots\"`, a numeric schema would\r\nnull it silently at read time. As a string it survives, and `convert_dtypes`\r\nhandles it with `try_cast` in one visible place.\r\n\r\n---\r\n\r\n## 9. Nested JSON to flat columns\r\n\r\n**Plain idea.** TMDB returns nested data: a film has a **list** of genres,\r\neach genre an **object** with `id` and `name`. Spark reads an object as a\r\n**struct** (a column with named sub-fields) and a list as an **array**.\r\nAnalysis is easier with flat text, so we pull out the names and join them\r\nwith `|`.\r\n\r\n**In this project.** `pipe_join_names`:\r\n\r\n```python\r\njoined = F.concat_ws(\"|\", F.col(f\"{column}.{name_key}\"))\r\n# concat_ws gives \"\" for an empty list. when() with no otherwise() is null.\r\nreturn df.withColumn(column, F.when(joined != \"\", joined))\r\n```\r\n\r\n| Step | Value for Avatar |\r\n|---|---|\r\n| `genres` (array of structs) | `[{id:878, name:\"Science Fiction\"}, {id:28, name:\"Action\"}, {id:12, name:\"Adventure\"}]` |\r\n| `F.col(\"genres.name\")` | `[\"Science Fiction\", \"Action\", \"Adventure\"]` |\r\n| `F.concat_ws(\"\\|\", ...)` | `\"Science Fiction\\|Action\\|Adventure\"` |\r\n\r\n`extract_collection_name` uses `F.col(\"belongs_to_collection.name\")`; on a\r\nnull struct that is just null, so standalone films need no special case.\r\n`extract_credits` finds directors with a **higher-order function**, one that\r\ntakes a small function as input:\r\n\r\n```python\r\ndirectors = F.concat_ws(\"|\", F.filter(\"credits.crew\", lambda c: c[\"job\"] == \"Director\")[\"name\"])\r\n```\r\n\r\nThe `lambda` is not run in Python: PySpark turns it into a Spark expression,\r\nso it runs in the JVM like any built-in.\r\n\r\n**Line to say in review.** \"Spark reads the JSON objects as structs and lists\r\nas arrays. `col(\"genres.name\")` pulls one field out of every element and\r\n`concat_ws` joins them with a pipe, as the spec asks, all without a Python\r\nloop.\"\r\n\r\n**Follow-up trap.** \"Why a pipe string and not keep the array?\" → The spec\r\nasks for `|`-separated text, and a string column is easy to read in pandas or\r\na CSV. The cost: every query for one genr
