on.md)):\r\n\r\n1. Revenue vs budget: every film far above the break-even line.\r\n2. ROI by genre: the top bars rest on 1–4 films; the `n=` labels show it.\r\n3. Popularity vs rating: the Avengers films pull the trend.\r\n4. Box office by year: mostly one film per year; not a market trend.\r\n5. Franchise vs standalone: 16 vs 2 films.\r\n6. Revenue histogram: right-skewed, median 1,453.68; buckets counted in Spark.\r\n7. Runtime boxplot: Titanic (194 min) is the one outlier.\r\n8. Popularity boxplot: Endgame at the fence; quartiles from `percentile_approx`.\r\n\r\n### Stage 7 — The notebook (3 min; 50 s to run in full)\r\n\r\nOpen `analysis.ipynb`. If the reviewer wants to see it run, use\r\n**Restart Kernel and Run All** and talk over it. Otherwise scroll through the\r\nsaved outputs. Sections, and what to point at:\r\n\r\n| Section | Point at |\r\n|---|---|\r\n| intro cell | \"what changes from pandas\": lazy plan, schema, cache, Spark-side charts |\r\n| fetch | the API is called only if the raw file is missing; `df_raw.printSchema()` shows the strings-first raw schema |\r\n| clean | `validate(df_cleaned)` prints the check counts; `df_cleaned.explain()`: read bottom up, `InMemoryTableScan` at the top because it is cached, `Window` for `idx` |\r\n| eda | `summary(...)` table, then histograms and boxplots; the markdown cell explaining why Spark and pandas boxplots disagree on Avatar and Endgame |\r\n| check the extracted columns | `inspect_anomalies` tables |\r\n| profit and roi, more rankings | the same lists as `results.md` |\r\n| udf vs built in | \"rows where they differ: 0\", and `ArrowEvalPython` in the UDF plan |\r\n| searches | 0 and 0, with the note that the tests cover them |\r\n| franchise and directors, charts | same tables and charts as Stages 5–6 |\r\n| save and stop | `coalesce(1)` Parquet write, read back, then `unpersist` and `spark.stop()` |\r\n\r\n> \"The notebook and `main.py` call the same functions, so they cannot\r\n> disagree. The notebook is for reading step by step; `main.py` is for\r\n> running it in one go.\"\r\n\r\nRun the notebook **or** `main.py` live, not both at once: two Spark sessions\r\ncompete for the same memory.\r\n\r\n### Stage 8 — Tests (1 min)\r\n\r\nShow the full-run result you saved beforehand (`32 passed in 590.11s`), then\r\nrun the fast file live:\r\n\r\n```powershell\r\npython -m pytest tests/test_tmdb_client.py -q\r\n```\r\n\r\nPrints `.....` and `5 passed in 0.53s`; about 4 s including Python start-up. These tests use a fake HTTP\r\nsession and a patched `time.sleep`, so they need no network, no Spark and no\r\nwaiting.\r\n\r\n> \"32 tests on fake rows: one per cleaning rule, KPI rule, client behaviour\r\n> and chart helper. The Spark ones are slow on Windows because every action\r\n> has a fixed cost; I listed how I would speed them up.\"\r\n\r\n---\r\n\r\n## The 2-minute verbal summary\r\n\r\nPractise this out loud until it fits in two minutes.\r\n\r\n> \"This lab redoes my pandas TMDB analysis in PySpark. Step 1 is plain\r\n> Python: 19 API calls with credits included, retries with back-off, ID 0\r\n> skipped as a 404, so 18 films saved as JSON Lines.\r\n>\r\n> Step 2 reads that file with a schema I wrote, in permissive mode, so a\r\n> broken line is counted instead of crashing the job; here there were none.\r\n> Twelve small functions flatten the nested JSON into pipe-separated text,\r\n> type the columns with `try_cast` because Spark 4 is in ANSI mode, turn\r\n> zeros and placeholders into nulls, filter and de-duplicate, and add a\r\n> 0-based index. `validate` then checks the result in one aggregation and\r\n> stops the run if anything is wrong.\r\n>\r\n> Step 3 builds ten best and worst lists from one `rank` function, two\r\n> searches, a franchise comparison and franchise and director tables. Endgame\r\n> has the highest revenue, Avatar the highest profit and ROI, and The Avengers\r\n> Collection is the top franchise. Both searches are empty for these IDs; the\r\n> tests prove they work.\r\n>\r\n> Step 4 draws eight charts where Spark does the grouping, histogram buckets\r\n> and quartiles, and only small results go to Matplotlib.\r\n>\r\n> The main finding is a warning: all 18 films are blockbusters, so every\r\n> one earned at least 4.45 times its budget, and the standalone group is only\r\n> 2 films. Nothing here generalises to films in general. Spark is more than 18\r\n> rows need, but the code is written as it would have to be for a real table:\r\n> explicit schema, built-ins instead of UDFs, cache and unpersist, small\r\n> results to the driver, and data checks that stop a bad run.\"\r\n\r\n---\r\n\r\n## If something fails live\r\n\r\n| What happens | What to do |\r\n|---|---|\r\n| No network | Nothing to do: the raw file is on disk, and `python -m src.main` without `--fetch` never calls the API. Do not pass `--fetch`. |\r\n| `data/raw_movies.jsonl` missing and no network | `main.py` would try to fetch and fail with a network error. Say so, and show `reports/results.md` and the charts, which are already generated. |\r\n| `no TMDB_API_KEY in .env` | You ran `--fetch` or the raw file is missing. Run without `--fetch` after restoring the file; never type the key on screen. |\r\n| `UnsatisfiedLinkError ... NativeIO$Windows` at the Parquet write | `HADOOP_HOME` is not set in this window. Re-run with the `$env:HADOOP_HOME=...; $env:PATH=...` prefix. |\r\n| `ModuleNotFoundError: No module named 'src'` | You ran `python src/main.py` or are in the wrong folder. `cd` to the lab folder and use `python -m src.main`. |\r\n| `JAVA_HOME is not set` / Java errors at start | Check `java -version` shows 17; see [01 · Setup](01-setup-windows.md). |\r\n| `SparkUI could not bind on port 4040` | Another Spark is running (often a notebook kernel). Harmless; close the other one if things feel slow. |\r\n| Run is much slower than 80 s | Another Spark JVM or the test suite is running. Stop it and rerun. |\r\n| `data checks failed: ...` | `validate` stopped the run on purpose; nothing was written. Read the message: it names the rule and the count. That is the feature working. |\r\n| A notebook cell fails after `spark.stop()` | The last cell stops Spark. Restart the kernel before running cells again. |\r\n| Tests take too long to show | Show the saved `32 passed` line and run `tests/test_tmdb_client.py` only. |\r\n| Out-of-memory or the laptop freezes | Close the notebook kernel and other Spark runs; rerun `main.py` alone. |\r\n\r\n## Self-check\r\n\r\n1. Which two lines must you set in a fresh PowerShell window before any Spark command?\r\n2. Why is it safe to have no network during the review?\r\n3. What does the `WindowExec` warning mean, and what do you say about it?\r\n4. Why should the notebook and `main.py` not run at the same time?\r\n5. Which test file can you run live, and why is it fast?\r\n\r\nAnswers: (1) `$env:HADOOP_HOME=\"C:\\Users\\User\\hadoop\"` and the `PATH`\r\nline adding its `bin`. (2) `data/raw_movies.jsonl` is on disk, and\r\n`python -m src.main` only fetches with `--fetch` or when that file is\r\nmissing. (3) The `idx` window has no `partitionBy`, so all rows go to one\r\npartition; fine for 18 rows, named in the code as the part that would not\r\nscale. (4) Two Spark JVMs compete for memory and the port, and both rewrite\r\nthe same Parquet. (5) `tests/test_tmdb_client.py`: it uses a fake session and\r\na patched `time.sleep`, and needs no Spark.\r\n","reports/final_report.md":"# TMDB Movie Data Analysis with PySpark: Final Report\n\n**Author:** [Your name] · **Data snapshot:** TMDB API, fetched 4 November 2026 ·\n**Tools:** Python 3.13, PySpark 4.3 (local mode), Matplotlib\n\nEvery number here comes from `python -m src.main` (or `analysis.ipynb`, which runs the\nsame functions). The full tables are in [results.md](results.md) and the charts are\n`chart1.png` to `chart8.png` in this folder.\n\n## 1. Summary\n\nThe 18 films in the lab's ID list are among the highest-grossing films ever\nmade. Together they cost **$3.85 billion** to make and took **$30.6 billion**\nat the box office. Every one of them earned at least 4.4 times its budget.\n\n- **The Avengers films lead almost every list.** *Avengers: Endgame* has the\n  highest revenue ($2,942M), the highest budget ($356M), the joint-highest\n  rating (8.25, with *Infinity War*) and the highest popularity score.\n  *The Avengers* (2012) has the most votes (40,259).\n- **The best return on investment came from older, cheaper films.**\n  *Avatar* (12.3×), *Titanic* (11.3×), *Jurassic World* (11.1×) and *Harry\n  Potter and the Deathly Hallows: Part 2* (10.7×). The most expensive film\n  in the set, *Star Wars: The Last Jedi* ($300M), has the lowest ROI (4.5×).\n- **Franchise vs standalone shows almost no difference here.** Both groups\n  have a median ROI near 8 and a mean rating near 7.4. But the standalone\n  group is only 2 films (*Titanic*, *Beauty and the Beast*), so no\n  conclusion can be drawn from it.\n- **Popularity tracks rating closely in this set** (correlation 0.84). Budget\n  explains revenue only partly (correlation 0.58).\n- **Both search queries return no films.** No film in the list stars Bruce\n  Willis, and none is a Tarantino film. The queries are correct and are\n  covered by tests on small made-up data (`tests/test_kpis.py`).\n\n## 2. Method\n\n**Step 1: Extraction.** `src/tmdb_client.py` calls\n`/movie/{id}?append_to_response=credits` once per ID, so the cast and crew\narrive in the same call. ID 0 returns 404 and is skipped. Busy (429) and\nserver (5xx) errors are retried with exponential back-off. The raw responses\nare saved to `data/raw_movies.jsonl`, so every later step can be re-run\nwithout calling the API. 18 of 19 IDs returned a film.\n\n**Step 2: Cleaning** (`src/cleaning.py`, in spec order). The raw file is read with an explicit\nschema (`RAW_SCHEMA`), not inferred, and lines that are not valid JSON are dropped\nand counted:\n\n| Rule | Decision |\n|---|---|\n| Irrelevant columns | `adult`, `imdb_id`, `original_title`, `video`, `homepage` dropped |\n| JSON-like columns | Names joined with `\"\\|\"`. For `spoken_languages` the English name is used (e.g. \"Russian\", not \"Pусский\") |\n| Directors | **All** directors kept, joined with `\"\\|\"`. 4 films have two (e.g. Joe and Anthony Russo). Keeping only the first would hide one of them |\n| Types | `try_cast`: an invalid value becomes null instead of failing the job. PySpark 4 runs in ANSI mode, where a plain `cast` throws |\n| Zeros | A budget, revenue or runtime of 0 means \"unknown\", so it becomes null. A fake 0 would make profit and ROI wrong |\n| Money | Budget and revenue converted to million USD |\n| No votes | When `vote_count = 0`, `vote_average` becomes null: a 0.0 rating from nobody is not a rating |\n| Placeholders | `\"No Data\"`, `\"No overview found.\"` and empty text become null |\n| Rows | Duplicates on `id` removed. Rows with no `id`/`title`, fewer than 10 non-null values, or not `Released` removed |\n| Index | Spark rows have no index, so `idx` is a `row_number()` ordered by `id`, starting at 0 |\n\nAfter cleaning, `validate()` checks the table in one pass (rows left, unique\nids, titles present, budgets, revenues and ratings in range) and stops the run\nif any check fails. No film was removed by these rules. All 18 are released, complete and unique.\nAfter cleaning, only `belongs_to_collection` has nulls: the 2 standalone films.\n\n**Step 3: KPIs** (`src/kpis.py`). One reusable function,\n`rank`, produces all ten best/worst lists. It leaves out rows where the\nmetric is null and accepts an extra filter. ROI rankings only use films with\na budget of at least $10M, and rating rankings only films with at least 10\nvotes, as the spec asks (here every film passes both). A real Spark UDF\n(`roi_udf`) is included for comparison. A test shows it gives the same ROI as\nthe built-in column arithmetic, which is faster because it never leaves the JVM.\n\n\"Most successful\" franchise or director means **highest total revenue, ties\nbroken by mean rating**. For directors, a co-directed film counts in full for\neach director.\n\n**Step 4: Charts** (`src/visualize.py`). Spark does the grouping, the histogram\nbuckets and the box-plot quartiles. Only the small results are converted to\npandas and drawn with Matplotlib.\n\n## 3. Results\n\n### Best and worst films\n\n| KPI | 1st | 2nd | 3rd |\n|---|---|---|---|\n| Highest revenue | Avengers: Endgame $2,942M | Avatar $2,924M | Titanic $2,264M |\n| Highest budget | Avengers: Endgame $356M | Avengers: Infinity War $300M | Star Wars: The Last Jedi $300M |\n| Highest profit | Avatar $2,687M | Avengers: Endgame $2,586M | Titanic $2,064M |\n| Lowest profit | Star Wars: The Last Jedi $1,034M | Incredibles 2 $1,043M | Beauty and the Beast $1,106M |\n| Highest ROI (budget ≥ $10M) | Avatar 12.34 | Titanic 11.32 | Jurassic World 11.14 |\n| Lowest ROI (budget ≥ $10M) | Star Wars: The Last Jedi 4.45 | Avengers: Age of Ultron 5.98 | Incredibles 2 6.22 |\n| Most votes | The Avengers 40,259 | Avatar 34,959 | Avengers: Infinity War 33,324 |\n| Highest rated (≥ 10 votes) | Avengers: Endgame 8.25 | Avengers: Infinity War 8.25 | The Avengers 8.08 |\n| Lowest rated (≥ 10 votes) | Jurassic World: Fallen Kingdom 6.52 | Jurassic World 6.70 | Star Wars: The Last Jedi 6.73 |\n| Most popular | Avengers: Endgame 64.9 | Avengers: Infinity War 54.5 | The Avengers 42.4 |\n\n\"Lowest profit\" is still more than $1 billion: no film in the set lost money.\n\n### Franchise vs standalone\n\n| | Films | Mean revenue | Median ROI | Mean budget | Mean popularity | Mean rating |\n|---|---|---|---|---|---|---|\n| Franchise | 16 | $1,692M | 7.71 | $218M | 27.1 | 7.40 |\n| Standalone | 2 | $1,765M | 7.91 | $180M | 26.5 | 7.44 |\n\n### Most successful franchises and directors\n\n| Franchise | Films | Total revenue | Mean rating |\n|---|---|---|---|\n| The Avengers Collection | 4 | $7,919M | 7.96 |\n| Star Wars Collection | 2 | $3,403M | 6.98 |\n| Jurassic Park Collection | 2 | $2,982M | 6.61 |\n\n| Director | Films | Total revenue | Mean rating |\n|---|---|---|---|\n| James Cameron | 2 | $5,188M | 7.76 |\n| Joe Russo / Anthony Russo | 2 | $4,995M | 8.25 |\n| Joss Whedon | 2 | $2,924M | 7.68 |\n\n### What the charts show\n\n1. **Revenue vs budget:** every point is far above the break-even line. A\n   bigger budget goes with somewhat more revenue (correlation 0.58), but\n   *Avatar* and *Titanic* earn far more than films that cost the same.\n2. **ROI by genre:** Comedy (9.7), Romance (9.6) and Fantasy (9.2) have the\n   highest mean ROI, but they hold only 1, 2 and 4 films. Action, one of the\n   two most common genres here (10 films), has the lowest (7.4).\n3. **Popularity vs rating:** the films rated above 8 are also the most\n   popular. *Endgame* and *Infinity War* stand apart from the rest.\n4. **Box office by year:** mean revenue per release year jumps around\n   because most years hold one film: 2009 is *Avatar* alone ($2,924M) and 1997\n   is *Titanic* alone. 2015, 2018 and 2019 hold 3–4 films each. The line\n   reflects which films are in the list, not a market trend.\n5. **Franchise vs standalone:** mean revenue is nearly equal ($1,692M vs\n   $1,765M), and the standalone bar is only 2 films.\n6. **Distributions (charts 6–8):** revenue is right-skewed (median $1,454M,\n   mean $1,700M). *Titanic* (194 min) is the one runtime outlier.\n\n## 4. Limitations\n\n- **The sample is small and hand-picked.** 18 record-breaking films are not a\n  sample of \"movies\". There are no flops, so \"lowest profit\" and \"lowest ROI\"\n  only mean \"least spectacular hit\". This is survivorship bias.\n- **The standalone group has 2 films,** so means and medians for it are\n  anecdotes, not evidence.\n- **Popularity and vote counts change daily** on TMDB. Re-fetching will give\n  slightly different numbers. The saved raw file keeps this run reproducible.\n- **Spark is not needed for 18 rows.** pandas would be faster here. The point\n  of the lab is the PySpark API, which runs unchanged on millions of rows\n  on a cluster.\n\n## 5. How to reproduce\n\n```bash\npip install -r requirements.txt\ncopy .env.example .env          # add TMDB_API_KEY\npytest                          # 32 tests on fake rows, no network\npython -m src.tmdb_client       # calls the API, writes data/raw_movies.jsonl\npython -m src.main              # clean, KPIs, results.md and charts\n```\n\nThen open `analysis.ipynb` and run it top to bottom.\n\nOn Windows, Spark also needs `HADOOP_HOME` and `winutils.exe`. See\n[study/01-setup-windows.md](../study/01-setup-windows.md).\n","reports/results.md":"# results\r\n\r\nmade by `python -m src.main`. money columns are in million usd.\r\n\r\n## data\r\n\r\nraw: 18 movies (0 unreadable lines). after cleaning: 18 movies, 25 columns. data checks passed.\r\n\r\n### cleaned movies\r\n\r\n| idx | id | title | release_date | budget_musd | revenue_musd | vote_count | vote_average | popularity | runtime | director |\r\n|---|---|---|---|---|---|---|---|---|---|---|\r\n| 0 | 597 | Titanic | 1997-12-18 | 200.00 | 2,264.16 | 28009 | 7.90 | 35.22 | 194.00 | James Cameron |\r\n| 1 | 12445 | Harry Potter and the Deathly Hallows: Part 2 | 2011-07-12 | 125.00 | 1,341.51 | 22688 | 8.08 | 34.53 | 130.00 | David Yates |\r\n| 2 | 19995 | Avatar | 2009-12-16 | 237.00 | 2,923.71 | 34959 | 7.61 | 32.07 | 162.00 | James Cameron |\r\n| 3 | 24428 | The Avengers | 2012-04-25 | 220.00 | 1,518.82 | 40259 | 8.08 | 42.38 | 143.00 | Joss Whedon |\r\n| 4 | 99861 | Avengers: Age of Ultron | 2015-04-22 | 235.00 | 1,405.40 | 25285 | 7.28 | 35.97 | 141.00 | Joss Whedon |\r\n| 5 | 109445 | Frozen | 2013-11-20 | 150.00 | 1,274.22 | 18047 | 7.25 | 22.80 | 102.00 | Jennifer Lee\\|Chris Buck |\r\n| 6 | 135397 | Jurassic World | 2015-06-06 | 150.00 | 1,671.54 | 22082 | 6.70 | 15.20 | 124.00 | Colin Trevorrow |\r\n| 7 | 140607 | Star Wars: The Force Awakens | 2015-12-15 | 245.00 | 2,068.22 |
