<!--EMBED_START--><script id="embedded-data" type="application/json">{"README.md":"# tmdb movie analysis with spark\r\n\r\nDEM05 lab 1. same lab as my pandas one (DEM02 tmdb-movie-analysis), redone\r\nwith pyspark: fetch 18 movies, clean the table, check profit, ratings and\r\ndistributions, then chart it. same repo layout and same function names as\r\nthe pandas version so the two are easy to compare.\r\n\r\n- lab brief: [Data-Analysis-using-SparknPyspark.md](Data-Analysis-using-SparknPyspark.md)\r\n- report: [reports/final_report.md](reports/final_report.md), all tables in [reports/results.md](reports/results.md)\r\n- study notes: [study/](study/), open `study/index.html` in a browser\r\n\r\n## run\r\n\r\nneeds java 17 and python 3.10+. on windows also winutils.exe with HADOOP_HOME\r\nset (see [study/01-setup-windows.md](study/01-setup-windows.md)). `get_spark()`\r\nalso reads HADOOP_HOME from `.env` or from the value windows saved for your\r\naccount, so a vs code / jupyter opened before you set it still works.\r\n\r\n```\r\npip install -r requirements.txt\r\ncopy .env.example .env\r\npytest\r\npyright\r\npython -m src.tmdb_client\r\npython -m src.main\r\n```\r\n\r\n`pyright` is the type check. every function has type hints and\r\n`pyrightconfig.json` puts it in strict mode, so vscode shows real types\r\n(DataFrame, Column, Axes) on hover and in autocomplete instead of Unknown.\r\nit should say 0 errors.\r\n\r\nopen analysis.ipynb and run it top to bottom. it calls the same functions as\r\n`src.main`, one step per section.\r\n\r\n`src.tmdb_client` writes data/raw_movies.jsonl. after that nothing needs the\r\napi: `src.main` and the notebook read the file. if the file is missing,\r\n`src.main` fetches it first. `python -m src.main --fetch` forces a new fetch.\r\n\r\n## files\r\n\r\n- src/ - all source lives here\r\n- src/spark_session.py - the one SparkSession everything uses, settings explained inside\r\n- src/tmdb_client.py - fetch from the api with retries, save as json lines\r\n- src/cleaning.py - raw schema, one function per cleaning rule, data checks\r\n- src/kpis.py - profit, roi, the ranking function, searches, groups\r\n- src/visualize.py - 7 plots (5 question charts + distribution + boxplot)\r\n- src/main.py - glue: runs it all, writes parquet, results.md and 8 charts\r\n- tests/ - 32 pytest tests on fake rows, no network needed\r\n- pyrightconfig.json - strict type check settings, vscode / pylance read it too\r\n- data/ - raw json lines and the cleaned parquet (not committed)\r\n- reports/ - final report, results.md, chart1-8.png\r\n- study/ - my study notes for this lab\r\n- analysis.ipynb - all steps incl. eda, runs top to bottom\r\n\r\n## spark choices\r\n\r\nthe pandas version could get away with anything at 18 rows. here i wrote it\r\nthe way it would have to run on a real table:\r\n\r\n- **schema on read.** `cleaning.RAW_SCHEMA` instead of letting spark guess.\r\n  no extra pass over the file, the types never change between runs, and a\r\n  broken json line goes to `_corrupt_record` and gets counted, not crashed on.\r\n- **built in functions, no python udf in the pipeline.** everything is\r\n  `F.` column code so it stays in the jvm and catalyst can optimise it.\r\n  `kpis.roi_udf` exists only so the notebook can show the difference.\r\n- **try_cast.** spark 4 runs in ansi mode, a bad value would kill the job.\r\n  try_cast turns it into a null like `errors=\"coerce\"` did in pandas.\r\n- **cache what gets reused, then unpersist.** the cleaned table feeds ten\r\n  rankings, three groupings and eight charts. without cache spark redoes the\r\n  read and clean for each one.\r\n- **only small results go to the driver.** histograms and boxplots are\r\n  counted in spark (buckets, percentile_approx) and only the numbers come\r\n  back. the two scatter plots are the only toPandas() of whole columns.\r\n- **data checks that stop the run.** `cleaning.validate` checks row count,\r\n  unique ids and value ranges in one aggregation and raises if anything is\r\n  off, so a bad run never writes a parquet or charts.\r\n- **parquet output, overwrite mode.** typed and columnar, and a rerun gives\r\n  the same result instead of adding to it.\r\n- **config from env.** api key, spark master, shuffle partitions and log\r\n  level come from env vars / .env, nothing secret in code.\r\n- **spark.stop() in finally.** the jvm is released even when a step fails.\r\n\r\none thing i left on purpose: `idx` uses `row_number()` over a window with no\r\npartition, which moves every row to one partition (spark warns about it in\r\nthe log). the brief asks for a reset index; on a big table i would drop idx\r\nand key on `id`.\r\n","Data-Analysis-using-SparknPyspark.md":"# TMDB Movie Data Analysis using Spark and PySpark\n\n## Project Overview\n\nThis project challenges you to build a movie data analysis pipeline using Spark. You will fetch movie-related data from an API, clean and transform the dataset, and implement key performance indicators (KPIs).\n\nThis is not a group project, meaning you will design the workflow, structure the analysis, and implement the required calculations independently.\n\n---\n\n## Project Objectives\n\n- **API Data Extraction:** Fetch movie data from a movie database API.\n- **Data Cleaning & Transformation:** Process and structure the data for analysis.\n- **Exploratory Data Analysis (EDA):** Perform an initial exploration to understand trends.\n- **Advanced Filtering & Ranking:** Identify the best and worst movies based on financial and popularity metrics.\n- **Franchise & Director Analysis:** Assess how franchises and directors perform over time.\n- **Visualization & Insights:** Present key findings using visualizations.\n\n---\n\n## Project Steps\n\n### Step 1: Fetch Movie Data from API\n\n- Choose a movie database API (e.g., TMDb).\n- Fetch movies with the following IDs:\n\n```\nmovie_id = [0, 299534, 19995, 140607, 299536, 597, 135397,\n            420818, 24428, 168259, 99861, 284054, 12445,\n            181808, 330457, 351286, 109445, 321612, 260513]\n```\n\n- Store the data as a DataFrame.\n\n> **NB:** Read the API documentation to understand the nature of the data and how it's organized.\n\n---\n\n### Step 2: Data Cleaning and Preprocessing\n\n#### Data Preparation & Cleaning\n\n1. Drop irrelevant columns: `['adult', 'imdb_id', 'original_title', 'video', 'homepage']`\n2. Evaluate JSON-like columns:\n   - `belongs_to_collection`\n   - `genres`\n   - `production_countries`\n   - `production_companies`\n   - `spoken_languages`\n3. Extract and clean key data points:\n   - **Collection name** from `belongs_to_collection`\n   - **Genre names** from `genres` → separate multiple genres with `\"|\"`\n   - **Spoken languages** from `spoken_languages` → separate with `\"|\"`\n   - **Production countries** from `production_countries` → separate with `\"|\"`\n   - **Production companies** from `production_companies` → separate with `\"|\"`\n4. Inspect extracted columns using `value_counts()` to identify anomalies.\n\n#### Handling Missing & Incorrect Data\n\n5. Convert column datatypes:\n   - `'budget'`, `'id'`, `'popularity'` → Numeric (set invalid values to NaN)\n   - `'release_date'` → Convert to datetime\n   - etc.\n6. Replace unrealistic values:\n   - Budget / Revenue / Runtime = `0` → Replace with NaN or infer from similar movies\n   - Convert `'budget'` and `'revenue'` to million USD\n   - Movies with `vote_count = 0` → Analyze their `vote_average` and adjust accordingly\n   - `'overview'` and `'tagline'` → Replace known placeholders (e.g., `'No Data'`) with NaN\n7. Remove duplicates and drop rows with unknown `'id'` or `'title'`.\n8. Keep only rows where at least **10 columns** have non-NaN values.\n9. Filter to include only `'Released'` movies, then drop `'status'`.\n\n#### Reorder & Finalize DataFrame\n\n10. Reorder columns:\n\n```\n['id', 'title', 'tagline', 'release_date', 'genres', 'belongs_to_collection',\n 'original_language', 'budget_musd', 'revenue_musd', 'production_companies',\n 'production_countries', 'vote_count', 'vote_average', 'popularity', 'runtime',\n 'overview', 'spoken_languages', 'poster_path', 'cast', 'cast_size', 'director', 'crew_size']\n```\n\n11. Reset index.\n\n---\n\n### Step 3: KPI Implementation & Analysis\n\n#### Identify the Best/Worst Performing Movies\n\n1. Filter and rank movies based on:\n   - Highest Revenue\n   - Highest Budget\n   - Highest Profit (Revenue - Budget)\n   - Lowest Profit (Revenue - Budget)\n   - Highest ROI (Revenue / Budget) — only movies with Budget ≥ 10M\n   - Lowest ROI — only movies with Budget ≥ 10M\n   - Most Voted Movies\n   - Highest Rated Movies — only movies with ≥ 10 votes\n   - Lowest Rated Movies — only movies with ≥ 10 votes\n   - Most Popular Movies\n\n> Define a **User-Defined Function (UDF)** to streamline ranking operations.\n\n#### Advanced Movie Filtering & Search Queries\n\n2. Filter the dataset for specific queries:\n   - **Search 1:** Find the best-rated Science Fiction Action movies starring Bruce Willis *(sorted by Rating — highest to lowest)*\n   - **Search 2:** Find movies starring Uma Thurman, directed by Quentin Tarantino *(sorted by runtime — shortest to longest)*\n\n#### Franchise vs. Standalone Movie Performance\n\n3. Compare movie franchises (`belongs_to_collection`) vs. standalone movies in terms of:\n   - Mean Revenue\n   - Median ROI\n   - Mean Budget Raised\n   - Mean Popularity\n   - Mean Rating\n\n#### Most Successful Franchises & Directors\n\n4. Find the **Most Successful Movie Franchises** based on:\n   - Total number of movies in franchise\n   - Total & Mean Budget\n   - Total & Mean Revenue\n   - Mean Rating\n\n5. Find the **Most Successful Directors** based on:\n   - Total Number of Movies Directed\n   - Total Revenue\n   - Mean Rating\n\n---\n\n### Step 4: Data Visualization\n\nUse **Matplotlib** to visualize:\n\n- Revenue vs. Budget Trends\n- ROI Distribution by Genre\n- Popularity vs. Rating\n- Yearly Trends in Box Office Performance\n- Comparison of Franchise vs. Standalone Success\n\n---\n\n## Project Deliverables\n\n| Deliverable | Description |\n|---|---|\n| **Complete Workflow** | Jupyter Notebook or Python script covering data processing, analysis, and results |\n| **Final Report** | Summary of key insights, methodology, and conclusions |\n| **Efficient Code** | Clean, modular, and optimized for performance |\n| **Git Best Practices** | Proper version control with clear commits and organized structure |\n","study/01-setup-windows.md":"# 01 — Setting Up Spark on Windows\r\n\r\nWhat you need installed to run this lab on a Windows laptop, what each piece\r\ndoes, how to check it works, and how to fix the errors that actually came up.\r\n\r\n> **Help:** if words like \"driver\", \"JVM\" or \"partition\" are new, read\r\n> [02 · What Spark is](02-what-is-spark.md) first. This page only says enough\r\n> to get things running.\r\n\r\n## 1. The pieces and why each one is needed\r\n\r\nPySpark looks like a normal Python library, but it is not pure Python. The\r\nreal work is done by Spark, which is written in Scala and runs on the Java\r\nVirtual Machine. Your Python code sends instructions to that Java process.\r\nThat is why a Python lab needs Java.\r\n\r\n| Piece | What it is | Why this lab needs it | Version on this laptop |\r\n|---|---|---|---|\r\n| **Java (JDK)** | The Java Development Kit. It contains the **JVM** (Java Virtual Machine), the program that runs Java code | Spark itself runs inside a JVM | Temurin OpenJDK 17 |\r\n| **Python** | The language you write the lab in | Your scripts, `requests`, Matplotlib, pytest, the notebook | 3.13 |\r\n| **PySpark** | The Python package that starts Spark and talks to it. It ships the Spark jars (Java libraries) inside it | Steps 2, 3 and the counting behind Step 4 | 4.3 |\r\n| **PyArrow** | A library for moving whole columns of data between programs | Makes `toPandas()` fast (see §9) | from `requirements.txt` |\r\n| **winutils.exe + hadoop.dll** | Two small Windows helper files from the Hadoop project | Spark uses Hadoop code to write files. On Windows that code calls these native helpers | from `hadoop-3.3.6` |\r\n| **HADOOP_HOME** | An environment variable pointing at the folder that holds `bin\\winutils.exe` | Tells Spark where to find the helpers | `C:\\Users\\User\\hadoop` |\r\n| **TMDB API key** | A secret string from themoviedb.org that identifies you to the API | Step 1 downloads the movies | stored in `.env` |\r\n| **`.env` file** | A text file of `NAME=value` lines, read by `python-dotenv` | Holds the key and optional Spark settings, out of the code and out of git | copy of `.env.example` |\r\n\r\nAn **environment variable** is a named value that the operating system\r\nhands to every program it starts. `HADOOP_HOME`, `PATH` and `JAVA_HOME` are\r\nexamples. `PATH` is a list of folders Windows searches when you type a\r\ncommand name like `java` or `winutils`.\r\n\r\n## 2. Install Java 17\r\n\r\nSpark 4 needs Java 17 or 21. This laptop uses Temurin 17 (a free build of\r\nOpenJDK from adoptium.net). Install it with the option \"Set JAVA_HOME\"\r\nticked. Then open a **new** terminal and check:\r\n\r\n```bash\r\njava -version\r\n```\r\n\r\nThe first line should start with `openjdk version \"17.`.\r\n\r\nIf `java` is \"not recognized\", the installer did not add Java to `PATH`.\r\nReinstall with the PATH option, or add the JDK's `bin` folder to `PATH` by\r\nhand.\r\n\r\n## 3. Install the Python packages\r\n\r\nFrom the project folder:\r\n\r\n```bash\r\npip install -r requirements.txt\r\n```\r\n\r\n`requirements.txt`:\r\n\r\n```\r\n# DEM05 lab 1: tmdb analysis with pyspark. tested on python 3.13, pyspark 4.3, java 17\r\npyspark>=4.0\r\npyarrow>=15.0\r\npandas>=2.0\r\nrequests>=2.31\r\nmatplotlib>=3.10\r\npython-dotenv>=1.0\r\njupyter>=1.0\r\npytest>=8.0\r\n```\r\n\r\n| Package | Used for |\r\n|---|---|\r\n| `pyspark` | Everything in `src/cleaning.py` and `src/kpis.py` |\r\n| `pyarrow` | Fast `toPandas()` for the charts |\r\n| `pandas` | Only the small results handed to Matplotlib |\r\n| `requests` | The 19 API calls in `src/tmdb_client.py` |\r\n| `matplotlib` | The 8 charts in `reports/` |\r\n| `python-dotenv` | Reads `.env` |\r\n| `jupyter` | Runs `analysis.ipynb` |\r\n| `pytest` | The 32 tests in `tests/` |\r\n\r\nCheck they import:\r\n\r\n```bash\r\npython -c \"import pyspark, pyarrow, pandas, matplotlib, pytest; print(pyspark.__version__)\"\r\n```\r\n\r\n## 4. winutils and HADOOP_HOME (Windows only)\r\n\r\nSpark borrows Hadoop's file-system code to read and write files. On Linux\r\nand macOS that code works on its own. On Windows it calls two native files,\r\n`winutils.exe` and `hadoop.dll`, which are not shipped with PySpark.\r\nWithout them, reading works, but **writing Parquet fails**.\r\n\r\nSteps used on this laptop:\r\n\r\n1. Download `winutils.exe` and `hadoop.dll` from the `hadoop-3.3.6/bin`\r\n   folder of `github.com/cdarlint/winutils`.\r\n2. Put both in `C:\\Users\\User\\hadoop\\bin`.\r\n3. Set two **user-level** environment variables (Start → \"Edit environment\r\n   variables for your account\"):\r\n   - `HADOOP_HOME` = `C:\\Users\\User\\hadoop` (the folder *above* `bin`)\r\n   - add `%HADOOP_HOME%\\bin` to `PATH`\r\n4. **Close and reopen every terminal** (and VS Code, and Jupyter). A\r\n   program reads its environment once, when it starts. Terminals opened\r\n   before the change still have the old values.\r\n\r\nCheck in a new PowerShell window:\r\n\r\n```powershell\r\necho $env:HADOOP_HOME          # C:\\Users\\User\\hadoop\r\nwhere.exe winutils             # C:\\Users\\User\\hadoop\\bin\\winutils.exe\r\n```\r\n\r\n**What `get_spark()` does for you.** Step 4 is easy to forget, and VS Code\r\nstarts its Jupyter kernel with VS Code's own (old) environment. The kernel\r\nthen has no `HADOOP_HOME`, and the first Parquet write fails with\r\n`HADOOP_HOME and hadoop.home.dir are unset`. So `ensure_hadoop_home()` in\r\n`src/spark_session.py` runs just before Spark starts. It looks for the\r\nfolder in this order: the real environment variable, a `HADOOP_HOME=` line in\r\n`.env`, then the user variable Windows saved in the registry (where step 3\r\nput it). It also adds `bin` to `PATH` for `hadoop.dll`. This only helps a\r\n*new* session. If Spark is already running in the kernel, restart the\r\nkernel, because the JVM copied its environment when it started.\r\n\r\nIf you cannot change the user variables, set them for one PowerShell\r\nsession only:\r\n\r\n```powershell\r\n$env:HADOOP_HOME = \"C:\\Users\\User\\hadoop\"\r\n$env:PATH = \"$env:HADOOP_HOME\\bin;$env:PATH\"\r\n```\r\n\r\n## 5. The TMDB key and `.env`\r\n\r\n1. Create a free account on themoviedb.org, then Settings → API, and copy\r\n   the **API Key** (the short \"v3\" one, not the long token).\r\n2. Copy the template and fill it in:\r\n\r\n```bash\r\ncopy .env.example .env      # PowerShell / cmd\r\n```\r\n\r\n`.env.example` holds the key plus three optional Spark settings, shown with\r\ntheir defaults:\r\n\r\n```\r\n# copy to .env and fill in. .env is gitignored, never commit it.\r\n# key from themoviedb.org -> settings -> api -> \"api key\" (v3)\r\nTMDB_API_KEY=\r\nTMDB_BASE_URL=https://api.themoviedb.org/3\r\n# optional spark settings, these are the defaults\r\nSPARK_MASTER=local[*]\r\nSPARK_SHUFFLE_PARTITIONS=4\r\nSPARK_LOG_LEVEL=WARN\r\n```\r\n\r\n| Variable | Read by | Meaning |\r\n|---|---|---|\r\n| `TMDB_API_KEY` | `tmdb_client.fetch_all` | Your key. Empty → the fetch stops with a message |\r\n| `TMDB_BASE_URL` | `tmdb_client.fetch_all` | The API's address |\r\n| `SPARK_MASTER` | `spark_session.get_spark` | Where Spark runs; `local[*]` = all cores of this laptop |\r\n| `SPARK_SHUFFLE_PARTITIONS` | `get_spark` | Pieces after a `groupBy` or sort (see [02](02-what-is-spark.md#h-4-partitions)) |\r\n| `SPARK_LOG_LEVEL` | `get_spark` | How much Spark prints: `WARN`, `ERROR`, `INFO` |\r\n\r\n`.env` is listed in `.gitignore`, so git never commits it. A key pushed to\r\nGitHub is public and must be revoked.\r\n\r\n## 6. A five-line smoke test\r\n\r\nA **smoke test** is the smallest run that proves the setup works before you\r\ntry the real thing. Save as `smoke.py` anywhere and run `python smoke.py`:\r\n\r\n```python\r\nfrom pyspark.sql import SparkSession\r\nspark = SparkSession.builder.master(\"local[*]\").getOrCreate()\r\ndf = spark.createDataFrame([(1, \"Avatar\"), (2, \"Titanic\")], [\"id\", \"title\"])\r\ndf.show()\r\nspark.stop()\r\n```\r\n\r\nExpected (after about 20 seconds of start-up and some log lines):\r\n\r\n```\r\n+---+-------+\r\n| id|  title|\r\n+---+-------+\r\n|  1| Avatar|\r\n|  2|Titanic|\r\n+---+-------+\r\n```\r\n\r\nThis proves Java, PySpark and Python talk to each other. It does **not**\r\nprove winutils works, because nothing is written to disk. To test that, add\r\none line before `spark.stop()`:\r\n\r\n```python\r\ndf.write.mode(\"overwrite\").parquet(\"smoke.parquet\")\r\n```\r\n\r\nIf a `smoke.parquet` folder appears, writing works. Delete it afterwards.\r\n\r\n## 7. Running the lab\r\n\r\nThe code is a flat package in `src/`, so every command runs from the\r\n**project root** with `python -m`:\r\n\r\n```bash\r\npython -m src.tmdb_client      # Step 1 only: call the API, write data/raw_movies.jsonl\r\npython -m src.main             # everything; fetches first only if the raw file is missing\r\npython -m src.main --fetch     # force a new fetch, then everything\r\n```\r\n\r\n`python -m src.main` means \"run the module `main` inside the package\r\n`src`\". Running `python src/main.py` instead fails, because\r\n`from src import cleaning` only works when the project root is the\r\nstarting point (see [03 · The Python you need](03-python-you-need.md#h-5-modules-packages-and-imports)).\r\n\r\nWhat a full run produces (from `reports/results.md`):\r\n\r\n| Stage | Result |\r\n|---|---|\r\n| Fetch | 19 requests; ID `0` returns 404 and is skipped; 18 movies saved to `data/raw_movies.jsonl` |\r\n| Load | `raw: 18 movies (0 unreadable lines)` |\r\n| Clean, profit/ROI, checks | `after cleaning: 18 movies, 25 columns. data checks passed.` |\r\n| Write | `data/movies_clean.parquet` (a folder; needs winutils) |\r\n| Report | `reports/results.md` and `reports/chart1.png` to `chart8.png` |\r\n\r\nThe notebook `analysis.ipynb` (project root) calls the same functions one\r\nstep per section. Open it with `jupyter notebook analysis.ipynb` and run it\r\ntop to bottom.\r\n\r\n## 8. Running the tests\r\n\r\n```bash\r\npytest\r\n```\r\n\r\nThere are **32 tests** in four files: `test_cleaning.py` (15),\r\n`test_kpis.py` (10), `test_tmdb_client.py` (5) and `test_visualize.py` (2).\r\nThey need no network and no raw file: `tests/helpers.py` builds fake movie\r\nrecords. The 5 client tests use a fake HTTP session, so they never call\r\nTMDB.\r\n\r\nExpect the Spark tests to be slow on this laptop: one full run printed\r\n`32 passed in 634.08s (0:10:34)`, about ten minutes. That is not a bug. Every test ends in a Spark **action** (`.first()`,\r\n`.collect()`, `.count()`), and each action has a fixed cost of planning,\r\nscheduling and starting tasks, whether the data has 1 row or 1 million.\r\nSee [10 · The pipeline script and tests](10-pipeline-and-tests.md).\r\n\r\n## 9. Console noise you can ignore\r\n\r\nSpark prints a lot. These lines are harmless on this laptop:\r\n\r\n| Message | Why it appears | Action |\r\n|---|---|---|\r\n| `Missing Python executable 'C:\\Program Files\\Python313\\python.exe', defaulting to ... for SPARK_HOME` | The `pyspark` launcher script looks for `python.exe` in a fixed place and guesses `SPARK_HOME` from the package folder instead. The guess is correct | Ignore |\r\n| `The system cannot find the path specified.` | Printed by the same Windows launcher script | Ignore |\r\n| A `WARN` about \"No Partition Defined for Window operation\" | `reorder_and_reset` numbers rows with a window that has no partition, which moves every row to one partition. Intentional for 18 rows (see [06](06-cleaning-line-by-line.md#h-11-reorder-and-reset-steps-2-10-and-2-11)) | Ignore |\r\n| `[Stage 12:> (0 + 4) / 4]` progress bars | Spark showing tasks finishing | Ignore |\r\n| An error deleting a temp folder (jar files) at shutdown | Windows will not delete a file another process still has open. The run already finished | Ignore; delete the temp folder by hand later |\r\n\r\nTwo warnings from older versions of this lab no longer appear:\r\n\r\n- `FutureWarning: PySpark does not yet fully support pandas >= 3.0.0` is\r\n  hidden on purpose in `get_spark()` with `warnings.filterwarnings(...)`.\r\n- The \"PyArrow not installed, falling back\" warning is gone because\r\n  `pyarrow` is now in `requirements.txt`, and `get_spark()` turns Arrow on.\r\n\r\n## 10. Troubleshooting: real errors and their fixes\r\n\r\n| Error you see | Cause | Fix |\r\n|---|---|---|\r\n| `HADOOP_HOME and hadoop.home.dir are unset` on the Parquet write in the notebook | The kernel started before `HADOOP_HOME` existed and Spark was already running | Restart the kernel and run all; `get_spark()` now finds it (§4) |\r\n| `java.lang.UnsatisfiedLinkError: ... NativeIO$Windows.access0` when writing Parquet | `winutils.exe` / `hadoop.dll` missing, or `HADOOP_HOME` not set in *this* terminal | §4; then open a new terminal |\r\n| `no TMDB_API_KEY in .env. copy .env.example to .env and add the key.` | No `.env` file, or the key line is empty | §5 |\r\n| `HTTPError: 401 Client Error` during the fetch | The key is wrong (or you pasted the long v4 token) | Copy the v3 \"API Key\" again |\r\n| `ModuleNotFoundError: No module named 'src'` | You ran `python src/main.py`, or you are not in the project root | `cd` to the project root, then `python -m src.main` |\r\n| `AnalysisException ... cast[name] ... requires the \"INTEGRAL\" type` | Seen in an earlier version that let Spark guess the schema: when every test record had an empty `cast` list, Spark guessed `array\u003cstring>`, and a string has no `name` field | Fixed for good by the explicit `RAW_SCHEMA`; see [05 · DataFrame fundamentals](05-dataframe-fundamentals.md#h-3-schemas-inference-versus-an-explicit-schema) |\r\n| `[CAST_INVALID_INPUT] The value 'abc' ... cannot be cast to \"INT\"` | PySpark 4 has **ANSI mode** on: `.cast()` fails on bad input instead of returning null | Use `try_cast` as `cleaning.convert_dtypes` does; see [06](06-cleaning-line-by-line.md#h-8-convert-dtypes-step-2-5) |\r\n| `ValueError: data checks failed: ...` | `cleaning.validate` found a problem (no rows, duplicate ids, bad values) and stopped the run on purpose | Read the message; fix the data or the cleaning rule. See [06](06-cleaning-line-by-line.md#h-12-validate-data-checks-that-stop-the-run) |\r\n\r\n## Self-check\r\n\r\n1. Why does a Python lab need Java installed? [Spark runs inside a JVM; PySpark only sends it instructions.]\r\n2. The smoke test passes but `python -m src.main` fails writing Parquet. What is missing? [winutils.exe/hadoop.dll and `HADOOP_HOME`, or the terminal was opened before setting them.]\r\n3. Why `python -m src.main` and not `python src/main.py`? [`main.py` imports `from src import ...`, which works only when Python starts from the project root as a package.]\r\n4. Which `.env` setting would point the same code at a cluster? [`SPARK_MASTER`.]\r\n5. Why are the Spark tests slow even on tiny fake data? [Each Spark action has a fixed overhead regardless of data size.]\r\n","study/02-what-is-spark.md":"# 02 — What Spark Is and How It Runs Your Code\r\n\r\nThe ideas you need before any PySpark line makes sense: why Spark exists,\r\nwho does the work, and why nothing happens until you ask for a result.\r\nEvery idea is tied to something you can see when this lab runs.\r\n\r\n> **Help:** the setup that makes Spark start is in\r\n> [01 · Setting up Spark on Windows](01-setup-windows.md). The DataFrame\r\n> methods themselves are in [05 · DataFrame fundamentals](05-dataframe-fundamentals.md).\r\n\r\n## 1. The problem Spark solves\r\n\r\npandas loads a whole table into the memory of **one machine** and works on\r\nit with **one CPU core** for most operations. That is perfect up to a few\r\ngigabytes. It breaks when:\r\n\r\n- the data is bigger than one machine's memory (say 500 GB of logs), or\r\n- one core is too slow, even though the machine (or a room of machines)\r\n  has hundreds of cores sitting idle.\r\n\r\nSpark's answer: cut the data into pieces, send the pieces to many\r\n**workers** (cores on many machines), let each worker process its piece,\r\nand combine the results. A group of machines working together like this\r\nis a **cluster**.\r\n\r\n**Be honest about this lab.** It has 18 movies. pandas would do every step\r\nin a fraction of a second; Spark spends about 20 seconds just starting.\r\nThe lab does not use Spark because the data needs it. It uses Spark to\r\nteach the API that *does* scale: the same `groupBy`, `explode` and\r\n`filter` code would run unchanged on 18 million movies on a cluster. The\r\nREADME says it directly: \"the pandas version could get away with anything\r\nat 18 rows. here i wrote it the way it would have to run on a real table.\"\r\nWhen a reviewer asks \"why Spark for 18 rows?\", that is the answer.\r\n\r\nThis lab is the same lab as the earlier pandas one (DEM02), with the same\r\nfile layout and function names, so you can compare the two line by line.\r\n\r\n## 2. Driver and executors\r\n\r\nA Spark program has two kinds of process:\r\n\r\n| Role | What it does | In this lab |\r\n|---|---|---|\r\n| **Driver** | Runs your Python code, builds the plan, splits it into tasks, collects results | The `python -m src.main` process (or the notebook kernel) plus the JVM it starts |\r\n| **Executors** | Run the tasks on their piece of the data and send results back | Threads inside that same JVM on your laptop |\r\n\r\nOn a real cluster the driver is on one machine and executors are on many\r\nothers. Here everything is on one laptop. The code does not change; only\r\nthe `master` setting does.\r\n\r\nThe **SparkSession** is your handle on all of this. You create it once and\r\nevery DataFrame comes from it. The lab builds it in one place,\r\n`src/spark_session.py`, so the notebook, `main.py` and the tests never\r\ndisagree:\r\n\r\n```python\r\nload_dotenv()  # so the SPARK_ settings in .env count, not only real env vars\r\nmaster = os.getenv(\"SPARK_MASTER\", \"local[*]\")\r\nspark = (\r\n    SparkSession.builder\r\n    .appName(app_name)\r\n    .master(master)\r\n    # default is 200 shuffle partitions. for 18 rows that is 200 near\r\n    # empty tasks after every groupBy. AQE would merge them anyway, but\r\n    # starting small keeps the spark ui readable.\r\n    .config(\"spark.sql.shuffle.partitions\", os.getenv(\"SPARK_SHUFFLE_PARTITIONS\", \"4\"))\r\n    .config(\"spark.sql.adaptive.enabled\", \"true\")\r\n    .config(\"spark.sql.adaptive.coalescePartitions.enabled\", \"true\")\r\n    # dates: same answer on every machine, no matter the laptop timezone\r\n    .config(\"spark.sql.session.timeZone\", \"UTC\")\r\n    # arrow makes toPandas() a columnar copy instead of row by row.\r\n    # fallback means it still works if pyarrow is missing.\r\n    .config(\"spark.sql.execution.arrow.pyspark.enabled\", \"true\")\r\n    .config(\"spark.sql.execution.arrow.pyspark.fallback.enabled\", \"true\")\r\n    .getOrCreate()\r\n)\r\nspark.sparkContext.setLogLevel(os.getenv(\"SPARK_LOG_LEVEL\", \"WARN\"))\r\n```\r\n\r\nEach setting is explained in the sections below: master (§3), shuffle\r\npartitions and AQE (§4, §9), Arrow (§5). `getOrCreate()` returns the\r\nrunning session if one exists, so calling `get_spark()` twice is safe.\r\n\r\n## 3. The master: `local[*]` or a cluster\r\n\r\nThe **master** setting says where the executors are.\r\n\r\n| Master value | Meaning |\r\n|---|---|\r\n| `local` | One thread. Everything runs one task at a time |\r\n| `local[4]` | Four threads, so up to four tasks at once |\r\n| `local[*]` | One thread per CPU core of this machine |\r\n| `spark://host:7077`, `yarn`, `k8s://...` | A real cluster |\r\n\r\nThe lab reads it from the `SPARK_MASTER` environment variable and defaults\r\nto `local[*]`. The docstring explains why: \"the master comes from\r\nSPARK_MASTER so the same code can be pointed at a cluster later; on my\r\nlaptop it stays local[*].\" Changing where the code runs is a config\r\nchange, not a code change.\r\n\r\n## 4. Partitions\r\n\r\nA **partition** is one piece of a DataFrame. One task processes one\r\npartition. More partitions means more possible parallelism, but each\r\npartition has a fixed overhead.\r\n\r\nIn this lab:\r\n\r\n- `cleaning.load_raw` reads `data/raw_movies.jsonl` into **1 partition**,\r\n  because the file is small. Spark only splits a file when it is bigger\r\n  than its split size (at least 4 MB on this laptop, at most 128 MB by\r\n  default).\r\n- After a **shuffle** (see §8), Spark uses `spark.sql.shuffle.partitions`\r\n  partitions. The default is 200. With 18 rows that means 200 tasks, most\r\n  of them empty, each with start-up cost. The lab sets it to **4**\r\n  (overridable with `SPARK_SHUFFLE_PARTITIONS`).\r\n- Before writing Parquet, `main.py` calls `coalesce(1)`: \"18 rows do not\r\n  need 4 tiny files\". `coalesce(n)` merges partitions down to `n` without\r\n  a shuffle.\r\n\r\nYou can ask a DataFrame how many partitions it has:\r\n\r\n```python\r\ndf.rdd.getNumPartitions()\r\n```\r\n\r\n## 5. DataFrames versus pandas\r\n\r\nA Spark **DataFrame** is a table with named, typed columns, like a pandas\r\nDataFrame. The differences matter:\r\n\r\n| | pandas DataFrame | Spark DataFrame |\r\n|---|---|---|\r\n| Where the data lives | In your Python process's memory | Split into partitions across executors |\r\n| When work happens | Immediately, every line | Only when an action asks (lazy, §6) |\r\n| Can you change it? | Yes, `df[\"x\"] = ...` changes it in place | No. Every method returns a **new** DataFrame |\r\n| Row index | Yes (`0, 1, 2...`) | No. Rows have no built-in order or number |\r\n| Column syntax | `df[\"budget\"] / 1e6` | `F.col(\"budget\") / 1_000_000` (a Column expression) |\r\n| Size limit | One machine's RAM | Disk and RAM of the whole cluster |\r\n\r\nWhere this shows up in the code:\r\n\r\n- **No index.** Spec Step 2.11 says \"reset index\". Spark has no index, so\r\n  `cleaning.reorder_and_reset()` builds one with `row_number()` (see\r\n  [06 · Cleaning line by line](06-cleaning-line-by-line.md#h-11-reorder-and-reset-steps-2-10-and-2-11)).\r\n- **Immutable.** That is why every cleaning function looks like\r\n  `return df.withColumn(...)`. It never changes `df`; it returns a new one.\r\n- **Going back to pandas.** `df.toPandas()` copies every row into the\r\n  driver as a pandas DataFrame. With **Arrow** turned on (a columnar\r\n  memory format, via the `pyarrow` package), the copy is done column by\r\n  column instead of row by row, which is much faster. `visualize.py` only\r\n  calls `toPandas()` on small, already-grouped results, plus the two\r\n  scatter plots, because on a big table it would run the driver out of\r\n  memory.\r\n\r\n## 6. Lazy evaluation\r\n\r\n**Lazy** means Spark does not compute anything when you call a\r\ntransformation. It only writes down what you asked for. The whole chain\r\nruns when you call an **action**.\r\n\r\nFrom `main.run()`:\r\n\r\n```python\r\ndf_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()   # nothing computed yet\r\nchecks = cleaning.validate(df_movies)                              # action: now it runs\r\n```\r\n\r\n`cleaning.clean()` returns instantly, even though it describes about 30\r\ncolumn operations. The module docstring says it: \"nothing runs until\r\nsomething asks for a result (count, show, write), so clean() is just\r\nbuilding a plan.\"\r\n\r\nWhy lazy?\r\n\r\n1. **Optimisation.** Spark's optimiser (called **Catalyst**) sees the\r\n   whole plan before running it, so it can reorder and merge steps. §8\r\n   shows it pushing a filter into the file read and skipping unused\r\n   columns.\r\n2. **No wasted work.** If you never ask for a column, it is never\r\n   computed or even read.\r\n\r\nThe trap: an error in a transformation (say, a bad cast) does not appear\r\non the line that wrote it. It appears later, at the action. When a\r\ntraceback points at `.first()` or `.count()`, look back up the chain.\r\n\r\n## 7. Transformations, actions and cache\r\n\r\n| Transformations (lazy, return a DataFrame) | Actions (run the plan, return a result) |\r\n|---|---|\r\n| `select`, `withColumn`, `drop`, `filter` | `show()`, `count()` |\r\n| `groupBy().agg()`, `orderBy`, `limit` | `collect()`, `first()`, `take(n)` |\r\n| `dropDuplicates`, `dropna`, `explode` | `toPandas()` |\r\n| `transform(fn)`, `coalesce(n)` | `write.parquet(...)` |\r\n\r\nA rule of thumb: if it gives you back a DataFrame, it is a transformation.\r\nIf it gives you Python values, prints, or writes a file, it is an action.\r\n\r\n**`cache()`** keeps a computed DataFrame in memory so later actions reuse\r\nit. From `main.py`:\r\n\r\n```python\r\n# cache because every kpi, table and chart below reads this same table.\r\n# without it spark would redo the read + clean for each one.\r\ndf_movies = kpis.add_profit_roi(cleaning.clean(df_raw)).cache()\r\n```\r\n\r\nThe cleaned table feeds ten rankings, two searches, three groupings and\r\neight charts. Without `cache()`, each of those actions would re-read the\r\nJSON file and re-run every cleaning step. `cache()` is lazy too: the first\r\naction (`validate`) fills it.\r\n\r\n**`unpersist()`** frees the memory when the cache is no longer needed.\r\n`main.py` unpersists `df_raw` right after the clean table is cached, and\r\n`df_movies` at the end of `run()`. On a laptop with 18 rows this hardly\r\nmatters; on a cluster, forgotten caches fill executor memory.\r\n\r\n`main.py` also caches the raw table for a Spark-specific reason, covered\r\nin [06](06-cleaning-line-by-line.md#h-3-drop-corrupt-rows-and-counting-bad-lines).\r\n\r\n## 8. Jobs, stages, tasks, shuffles, and reading a plan\r\n\r\nWhen an action runs, Spark breaks the work down three levels:\r\n\r\n| Level | What it is | How many |\r\n|---|---|---|\r\n| **Job** | All the work for one action | One per action (`count`, `collect`, ...) |\r\n| **Stage** | A run of steps that need no data from other partitions | A new stage starts at every shuffle |\r\n| **Task** | One stage applied to one partition | = number of partitions in that stage |\r\n\r\nA **shuffle** is when rows have to move between partitions. It happens\r\nwhen rows with the same key must end up together:\r\n\r\n- `groupBy(\"director\")`: all rows for \"James Cameron\" must meet.\r\n- `orderBy(...)`: a global sort needs to compare rows from every partition.\r\n- `dropDuplicates([\"id\"])`: two copies of the same `id` must meet.\r\n- A window with no `partitionBy` (the `idx` column): every row must go to\r\n  **one** partition.\r\n\r\nShuffles are the expensive part of Spark: rows are written out, sent over\r\nthe network (on a real cluster) and read back. In a plan, a shuffle is an\r\n`Exchange` node. `df.explain()` prints the plan. Here is the cleaning part\r\nof the plan for the cached `df_movies`, trimmed, from this lab:\r\n\r\n```\r\nWindow [row_number() ... ORDER BY id]                               \u003c- idx\r\n+- Sort [id ASC]\r\n   +- Exchange SinglePartition                                       \u003c- shuffle: all rows to 1 partition\r\n      +- Filter (atleastnnonnulls(2, id, title) AND atleastnnonnulls(10, ...))\r\n         +- SortAggregate(key=[id], functions=[first(title), ...])   \u003c- dropDuplicates([\"id\"])\r\n            +- AQEShuffleRead coalesced\r\n               +- Exchange hashpartitioning(id, 4)                   \u003c- shuffle by id, 4 partitions\r\n                  +- Project [CASE WHEN (budget > 0.0) THEN (budget / 1000000.0) END AS budget_musd, ...]\r\n                     +- Project [try_cast(id as bigint) AS id, ..., concat_ws(|, genres.name) ...]\r\n                        +- Filter (isnotnull(status) AND isnull(_corrupt_record) AND status = Released)\r\n                           +- FileScan json [id, title, ..., credits, _corrupt_record]\r\n                                PushedFilters: [IsNotNull(status), IsNull(_corrupt_record), EqualTo(status,Released)]\r\n```\r\n\r\nRead it **bottom up**:\r\n\r\n1. `FileScan json` reads the file. The list of columns does **not**\r\n   include `adult`, `imdb_id`, `video` or `homepage`: Spark saw they are\r\n   dropped later and never reads them. This is **column pruning**.\r\n2. The `status = Released` filter, written near the *end* of `clean()`,\r\n   has moved to the very bottom, next to the read. This is **predicate\r\n   pushdown**: filter as early as possible so less data flows up.\r\n3. The dozen `withColumn` calls were merged into two `Project` nodes.\r\n4. Two `Exchange` nodes: one for `dropDuplicates([\"id\"])` into 4\r\n   partitions, one `SinglePartition` for the `idx` window.\r\n\r\nAll of this is Catalyst at work, possible only because evaluation is lazy.\r\n\r\nThen, the plan for `kpis.top_directors(df_movies)` on top of the cache:\r\n\r\n```\r\nTakeOrderedAndProject(limit=10, orderBy=[total_revenue DESC, mean_rating DESC])\r\n+- HashAggregate(keys=[director], functions=[count(1), sum(revenue_musd), avg(vote_average)])\r\n   +- Generate explode(split(director, \\|, -1))\r\n      +- Filter isnotnull(director)\r\n         +- InMemoryTableScan [revenue_musd, vote_average, director]      \u003c- reads the cache\r\n```\r\n\r\nThere is **no `Exchange`** before the `groupBy` here. The cached table is\r\nalready in one partition (because of the `idx` window), so all rows for\r\neach director are already together and no shuffle is needed. Spark noticed\r\nthat by itself.\r\n\r\n## 9. Adaptive Query Execution (AQE)\r\n\r\nThe plan above says `AdaptiveSparkPlan` at the top and `AQEShuffleRead\r\ncoalesced` in the middle. **AQE** (Adaptive Query Execution) lets Spark\r\nchange the plan *while it runs*, using real sizes measured after each\r\nshuffle. The two settings in `get_spark()`:\r\n\r\n| Setting | What it does here |\r\n|---|---|\r\n| `spark.sql.adaptive.enabled` | Turns AQE on (it is on by default in Spark 4; the code makes it explicit) |\r\n| `spark.sql.adaptive.coalescePartitions.enabled` | After a shuffle, merge tiny partitions into fewer tasks. That is the `coalesced` in the plan |\r\n\r\nSo even if `SPARK_SHUFFLE_PARTITIONS` were left at 200, AQE would merge the\r\nempty ones. The comment in the code says this and gives the reason for\r\nstill setting 4: \"starting small keeps the spark ui readable.\"\r\n\r\n## 10. The Spark UI\r\n\r\nWhile a Spark program runs, the driver serves a web page, usually at\r\n**http://localhost:4040**. (If 4040 is taken, it uses 4041, then 4042.)\r\n`get_spark()` logs the exact address: `spark 4.3.0 on local[*], ui at http://...`.\r\n\r\n| Tab | What you see |\r\n|---|---|\r\n| **Jobs** | One row per action, with its stages and duration |\r\n| **Stages** | Tasks per stage, time per task, shuffle read/write sizes |\r\n| **Storage** | Cached DataFrames (the `df_movies` cache appears here) |\r\n| **SQL / DataFrame** | A diagram of each query plan, the same as `explain()`, with AQE's final version |\r\n| **Executors** | Each executor's memory and task counts |\r\n\r\nThe UI disappears when `spark.stop()` runs, and `main.py` always stops\r\nSpark at the end. To look around, use the notebook: `analysis.ipynb` keeps\r\nthe session alive between cells, so open the UI while it is running.\r\n\r\nOn this data, most jobs take well under a second each, and almost all of\r\nthat is overhead, not computing. That is the honest picture of Spark on\r\ntiny data.\r\n\r\n## 11. Where the time goes on this laptop\r\n\r\n| What | Typical time here | Why |\r\n|---|---|---|\r\n| Starting the SparkSession | about 20 s | Starting a JVM, loading Spark's jars |\r\n| Each action on 18 rows | a fraction of a second to a few seconds | Planning, scheduling, starting tasks |\r\n| The test suite | minutes | Dozens of actions, each with that fixed cost |\r\n| Actual computing on 18 rows | close to zero | 18 rows is nothing |\r\n\r\nThis is the reverse of big-data work, where the fixed cost is small next to\r\nhours of real computing. Keep both pictures in mind.\r\n\r\n## Self-check\r\n\r\n1. What is the difference between the driver and an executor? [The driver runs your code and plans; executors run tasks on partitions.]\r\n2. `cleaning.clean(df_raw)` returns in milliseconds. Has the data been cleaned? [No. It returned a plan; work runs at the next action.]\r\n3. In the plan, why does the `status = Released` filter appear next to the file read? [Predicate pushdown: Catalyst moves filters as early as possible.]\r\n4. Why does the lab set shuffle partitions to 4 when AQE could coalesce them anyway? [AQE would merge them, but starting small keeps the Spark UI readable.]\r\n5. Why `.cache()` the cleaned movies, and why `unpersist()` later? [Every KPI and chart reuses them; unpersist frees the memory when done.]\r\n","study/03-python-you-need.md":"# 03 — The Python You Need for This Lab\r\n\r\nOnly the Python features that this project's code actually uses, each\r\nshown with the real line it comes from. If you can read every example on\r\nthis page, you can read every file in `src/` and `tests/`.\r\n\r\n> **Help:** the PySpark side of these lines (`F.col`, `withColumn`, ...)\r\n> is explained in [05 · DataFrame fundamentals](05-dataframe-fundamentals.md).\r\n> This page is plain Python only.\r\n\r\n## 1. Lists, sets and dicts\r\n\r\nA **list** is an ordered sequence in square brackets. A **set** is an\r\nunordered group with no duplicates, in curly braces; checking `x in s` is\r\nfast. A **dict** (dictionary) maps keys to values, in curly braces with\r\n`key: value` pairs.\r\n\r\n```python\r\n# tmdb_client.py: a list of ints and a set of status codes\r\nMOVIE_IDS = [\r\n    0, 299534, 19995, 140607, 299536, 597, 135397,\r\n    ...\r\n]\r\nRETRYABLE = {429, 500, 502, 503, 504}\r\nif r.status_code not in RETRYABLE: ...\r\n\r\n# cleaning.py: a list of strings\r\nDROP_COLUMNS = [\"adult\", \"imdb_id\", \"original_title\", \"video\", \"homepage\"]\r\n```\r\n\r\nA TMDB movie arrives as a dict whose values can be lists of dicts. This is\r\nthe test helper's version, from `tests/helpers.py`:\r\n\r\n```python\r\ndef movie(**changes: object) -> Movie:\r\n    m = {\r\n        \"id\": 1, \"title\": \"Test Movie\", \"budget\": 100_000_000, ...\r\n        \"genres\": [{\"id\": 28, \"name\": \"Action\"}, {\"id\": 878, \"name\": \"Science Fiction\"}],\r\n        \"credits\": {\"cast\": [{\"name\": \"Actor One\"}, {\"name\": \"Actor Two\"}], ...},\r\n    }\r\n    m.update(changes)      # replace or add keys from another dict\r\n    return m\r\n```\r\n\r\n`**changes` collects any keyword arguments into a dict, so\r\n`movie(id=2, budget=0)` gives the default movie with those two keys\r\nchanged. Every test builds its rows this way.\r\n\r\n`100_000_000` is just `100000000`. Python ignores underscores in numbers;\r\nthey are there for your eyes.\r\n\r\n`kpis.rankings()` returns a dict whose values are DataFrames, and\r\n`main.py` loops over it:\r\n\r\n```python\r\nfor name, frame in kpis.rankings(df_movies).items():   # .items() gives (key, value) pairs\r\n    out.append(f\"### {name}\\n\\n\" + md_table(frame))\r\n```\r\n\r\n`dict.get(key, default)` returns the default when the key is missing.\r\n`visualize.plot_distribution` uses it so empty histogram buckets count as 0:\r\n\r\n```python\r\nheights = [counts.get(i, 0) for i in range(bins)]\r\n```\r\n\r\n## 2. JSON\r\n\r\n**JSON** (JavaScript Object Notation) is the text format the TMDB API\r\nsends. It maps almost one-to-one onto Python: object → dict, array →\r\nlist, string → str, number → int/float, `true/false` → `True/False`,\r\n`null` → `None`.\r\n\r\n```python\r\nimport json\r\njson.dumps({\"id\": 597, \"adult\": False})   # dict -> text: '{\"id\": 597, \"adult\": false}'\r\njson.loads('{\"id\": 597}')                 # text -> dict\r\n```\r\n\r\n`tmdb_client.save_jsonl()` writes one movie per line with\r\n`json.dumps(rec, ensure_ascii=False)`. `ensure_ascii=False` keeps\r\ncharacters like 日本語 as they are, instead of `日...` escapes. The test\r\nhelper `raw_df` uses `json.dumps` to turn test dicts into JSON text for\r\nSpark.\r\n\r\n## 3. Functions: defaults and keyword arguments\r\n\r\n```python\r\ndef fetch_movie(session: requests.Session, base_url: str, movie_id: int, retries: int = 3) -> Movie | None:\r\ndef rank(df: DataFrame, col: str, n: int = 5, ascending: bool = False, where: Column | None = None) -> DataFrame:\r\n```\r\n\r\n`retries=3` is a **default**: if the caller does not pass `retries`, it is\r\n3. Callers can pass arguments by name (**keyword arguments**), in any\r\norder:\r\n\r\n```python\r\nrank(df, \"roi\", n, ascending=True, where=rich)\r\n```\r\n\r\n`rank` has three defaults. That is what lets one function produce all ten\r\nrankings.\r\n\r\nA default of `None` followed by a check is the safe way to default to a\r\nlist:\r\n\r\n```python\r\ndef fetch_all(movie_ids: list[int] | None = None) -> list[Movie]:\r\n    ...\r\n    if movie_ids is None:\r\n        movie_ids = MOVIE_IDS\r\n```\r\n\r\n`*extra` in a definition collects any number of extra positional\r\narguments into a tuple. `cleaning._named(\"origin_country\")` passes one\r\nextra field name:\r\n\r\n```python\r\ndef _named(*extra: str) -> T.ArrayType:\r\n    fields = [T.StructField(\"id\", T.LongType()), T.StructField(\"name\", T.StringType())]\r\n    fields += [T.StructField(f, T.StringType()) for f in extra]\r\n    return T.ArrayType(T.StructType(fields))\r\n```\r\n\r\nA name starting with `_` (like `_named`) is a convention for \"helper,\r\nused only inside this file\".\r\n\r\nThis codebase writes no **type hints** (annotations like\r\n`def f(x: int) -> str`). You will see them in other projects; Python does\r\nnot enforce them either way.\r\n\r\n## 4. Docstrings and comments\r\n\r\nA **docstring** is a string right under a `def` or at the top of a file.\r\nIt becomes the function's built-in help (`help(cleaning.validate)`).\r\nEvery module in `src/` starts with one saying which lab step it covers:\r\n\r\n```python\r\n\"\"\"Step 2: clean the raw movies with spark.\r\n...\r\n\"\"\"\r\n```\r\n\r\n`#` comments in this code explain *why*, not *what*, for example in\r\n`cleaning.py`: `# concat_ws gives \"\" for an empty list. when() with no otherwise() is null.`\r\n\r\n## 5. Modules, packages and imports\r\n\r\nA **module** is one `.py` file. A **package** is a folder of modules with\r\nan `__init__.py` file in it. This project has two packages, `src/` and\r\n`tests/`:\r\n\r\n```\r\nsrc/\r\n    __init__.py          # marks the folder as a package (empty)\r\n    spark_session.py  tmdb_client.py  cleaning.py  kpis.py  visualize.py  main.py\r\ntests/\r\n    __init__.py  conftest.py  helpers.py  test_cleaning.py  test_kpis.py  ...\r\n```\r\n\r\nImports name the package explicitly (**absolute imports**):\r\n\r\n```python\r\n# src/main.py\r\nfrom src import cleaning, kpis, visualize\r\nfrom src.spark_session import get_spark\r\nfrom src.tmdb_client import RAW_PATH, fetch_all, save_jsonl\r\n\r\n# tests/test_kpis.py\r\nfrom src import kpis\r\nfrom tests.helpers import enriched, movie\r\n```\r\n\r\nFor `import src` to work, Python must find the folder that *contains*\r\n`src/`, which is the project root. That is why every command is run from\r\nthe root with `-m`:\r\n\r\n```bash\r\npython -m src.main           # -m runs a module by its dotted package name\r\npython -m src.tmdb_client\r\n```\r\n\r\n`python -m` puts the current folder (the root) on Python's search list,\r\n`sys.path`. `python src/main.py` would put `src/` itself there instead, and\r\n`from src import ...` would fail with `ModuleNotFoundError: No module named 'src'`.\r\npytest finds the root on its own because `tests/` is a package with an\r\n`__init__.py`.\r\n\r\n`import src.tmdb_client as tmdb_client` (in `test_tmdb_client.py`) gives\r\nthe module a short local name.\r\n\r\n## 6. f-strings\r\n\r\nAn **f-string** has an `f` before the quotes and puts values inside `{}`:\r\n\r\n```python\r\nurl = f\"{base_url}/movie/{movie_id}\"               # \"https://api.themoviedb.org/3/movie/597\"\r\njoined = F.concat_ws(\"|\", F.col(f\"{column}.{name_key}\"))    # \"genres.name\"\r\nproblems.append(f\"{checks[name]} rows with {name}\")\r\nreturn f\"{v:,.2f}\"                                  # 2264.16 -> \"2,264.16\"\r\nax.set_title(f\"{column} distribution (median={median:g})\")\r\n```\r\n\r\nAfter a `:` comes a **format spec**: `,` adds thousands separators and\r\n`.2f` means two decimals. That is why `results.md` shows `2,264.16`.\r\n`:g` prints a number in its shortest natural form.\r\n\r\n## 7. Comprehensions and generator expressions\r\n\r\nA **list comprehension** builds a list from a loop in one line:\r\n\r\n```python\r\n# main.py: one null-count expression per column\r\nnulls = df_movies.select([F.count_if(F.col(c).isNull()).alias(c) for c in df_movies.columns])\r\n```\r\n\r\nRead it as \"for each column name `c`, make `F.count_if(...)`\". It is the\r\nsame as:\r\n\r\n```python\r\nexprs = []\r\nfor c in df_movies.columns:\r\n    exprs.append(F.count_if(F.col(c).isNull()).alias(c))\r\n```\r\n\r\nWith `zip`, which walks two lists side by side:\r\n\r\n```python\r\n# visualize.py: \"Action\\n(n=10)\" style labels\r\nlabels = [f\"{g}\\n(n={n})\" for g, n in zip(pdf[\"genre\"], pdf[\"n\"])]\r\n```\r\n\r\nWithout square brackets it is a **generator expression**: the same idea,\r\nbut values are made one at a time, often passed straight into a function:\r\n\r\n```python\r\nassert sorted(r.id for r in df.collect()) == [1, 4]\r\n\"\".join(\"| \" + \" | \".join(fmt(r[c]) for c in df.columns) + \" |\\n\" for r in rows)\r\n```\r\n\r\nA **dict comprehension** builds a dict:\r\n\r\n```python\r\nassert {r.director: r.total_revenue for r in kpis.top_directors(df).collect()} == {\"A\": 200.0, \"B\": 200.0}\r\n```\r\n\r\n## 8. `*` unpacking and tuple unpacking\r\n\r\nA `*` in a call spreads a list into separate arguments:\r\n\r\n```python\r\ndf.drop(*DROP_COLUMNS)                 # same as df.drop(\"adult\", \"imdb_id\", ...)\r\ndf.select(idx.alias(\"idx\"), *FINAL_COLUMNS)\r\nassert cleaned(spark, movie()).columns == [\"idx\", *cleaning.FINAL_COLUMNS]\r\n```\r\n\r\n`def cleaned(spark, *records)` in `tests/helpers.py` is the reverse: any\r\nnumber of movies are collected into one tuple.\r\n\r\n**Tuple unpacking** assigns several names at once:\r\n\r\n```python\r\nquartiles = df.agg(F.percentile_approx(column, [0.25, 0.5, 0.75]).alias(\"q\")).first()\r\nassert quartiles is not None\r\nq1, med, q3 = quartiles[\"q\"]\r\nlow_fence, high_fence = q1 - 1.5 * iqr, q3 + 1.5 * iqr\r\n```\r\n\r\n## 9. lambda\r\n\r\nA **lambda** is a one-line function without a name. `cleaning.py` uses one\r\nto tell Spark which crew members to keep:\r\n\r\n```python\r\nF.filter(\"credits.crew\", lambda c: c[\"job\"] == \"Director\")\r\n```\r\n\r\n`lambda c: c[\"job\"] == \"Director\"` means \"a function that takes `c` and\r\nreturns whether its job is Director\". Important: this lambda is **not** run\r\nby Python once per crew member. PySpark calls it once, with a Column\r\nplaceholder, to build a Spark expression. The filtering then happens\r\ninside the JVM. That is why it is fast, unlike a UDF (§10).\r\n\r\n`test_tmdb_client.py` replaces `time.sleep` with `no_wait`, a named\r\nfunction that does nothing. A lambda would work too, but a lambda cannot carry\r\ntype hints, and the strict type check (§18) flags its parameter as unknown.\r\n\r\n## 10. Decorators\r\n\r\nA **decorator** is a line starting with `@` above a function. It passes the\r\nfunction to another function that wraps it. In `kpis.py`:\r\n\r\n```python\r\n@F.udf(returnType=T.DoubleType())\r\ndef roi_udf(revenue: float | None, budget: float | None) -> float | None:\r\n    if revenue is None or budget is None or budget == 0:\r\n        return None\r\n    return revenue / budget\r\n```\r\n\r\n`@F.udf(...)` turns the plain Python function into a Spark **UDF**\r\n(user-defined function) that can be used on columns:\r\n`kpis.roi_udf(\"revenue_musd\", \"budget_musd\")`. Without the decorator you\r\nwould write `roi_udf = F.udf(roi_udf, T.DoubleType())`, which does the same\r\nthing. See [08 · KPIs line by line](08-kpis-line-by-line.md#h-4-a-real-spark-udf-roi-udf).\r\n\r\n`@pytest.fixture(scope=\"session\")` in `tests/conftest.py` is another\r\ndecorator. It registers `spark()` as a pytest **fixture**, a piece of setup\r\nthat a test receives by naming it as an argument (`def test_x(spark: SparkSession) -> None:`).\r\n`scope=\"session\"` means one SparkSession for the whole test run.\r\n\r\n## 11. Classes, briefly\r\n\r\nThe only classes in the project are test fakes in `test_tmdb_client.py`:\r\n\r\n```python\r\nclass FakeSession(requests.Session):\r\n    \"\"\"Answers with the statuses in the list, one per call.\"\"\"\r\n\r\n    def __init__(self, statuses: list[int], data: object = None) -> None:\r\n        super().__init__()\r\n        self.statuses = list(statuses)\r\n        self.data = data\r\n        self.calls = 0\r\n\r\n    def get(self, url: str | bytes, **kwargs: Any) -> requests.Response:\r\n        self.calls += 1\r\n        return FakeResponse(self.data, self.statuses.pop(0))\r\n```\r\n\r\nA **class** is a template for objects. `__init__` runs when you create one\r\n(`FakeSession([429, 200])`); `self` is the object itself. `FakeSession` has\r\na `get` method with the same shape as `requests.Session.get`, so\r\n`fetch_movie` cannot tell the difference. This is called **duck typing**:\r\nif it has the methods you call, it works. It also *inherits* from\r\n`requests.Session` (the `(requests.Session)` after the class name), so the\r\ntype checker agrees it is a valid `session` argument; `super().__init__()`\r\nruns the parent's setup first.\r\n\r\n## 12. `pathlib`\r\n\r\n`pathlib.Path` treats file paths as objects instead of strings:\r\n\r\n```python\r\nRAW_PATH = Path(__file__).resolve().parents[1] / \"data\" / \"raw_movies.jsonl\"\r\n```\r\n\r\n| Expression | Meaning |\r\n|---|---|\r\n| `__file__` | The path of the current file (`.../src/tmdb_client.py`) |\r\n| `.resolve()` | Make it absolute |\r\n| `.parents[1]` | Go up 2 levels: `[0]` = `src`, `[1]` = project root |\r\n| `/ \"data\"` | Join path parts, with the right separator on Windows or Linux |\r\n| `path.parent.mkdir(parents=True, exist_ok=True)` | Create the folder and any missing parents; no error if it exists |\r\n| `path.with_suffix(\".tmp\")` | Same path, other extension: `raw_movies.tmp` |\r\n| `RAW_PATH.exists()` | Does the file exist? |\r\n| `str(path)` | Back to a string; Spark wants strings: `.json(str(path))` |\r\n\r\n`os.replace(tmp, path)` renames a file, replacing the target if it exists.\r\n\r\n## 13. Environment variables and `python-dotenv`\r\n\r\n```python\r\nfrom dotenv import load_dotenv\r\nload_dotenv()                                                   # copy .env lines into os.environ\r\napi_key = os.getenv(\"TMDB_API_KEY\", \"\")                         # \"\" if not set\r\nmaster = os.getenv(\"SPARK_MASTER\", \"local[*]\")                  # with a default\r\n```\r\n\r\n`load_dotenv()` reads `.env` and sets each `NAME=value` as an environment\r\nvariable for this process. It does not overwrite variables that already\r\nexist, so a real environment variable wins over `.env`.\r\n\r\n`spark_session.py` also *sets* variables, with `setdefault`, which only\r\nsets a value if none exists:\r\n\r\n```python\r\nos.environ.setdefault(\"PYSPARK_PYTHON\", sys.executable)\r\n```\r\n\r\n`sys.executable` is the full path of the Python running this script. This\r\nforces Spark's Python workers to use the same Python. On Windows,\r\notherwise, Spark may pick another Python that has no PySpark installed.\r\n\r\n`warnings.filterwarnings(\"ignore\", message=\"PySpark does not yet fully support pandas\")`\r\nhides one specific warning by the start of its text.\r\n\r\n## 14. `if __name__ == \"__main__\":`\r\n\r\nEvery module has a variable `__name__`. When you run a file directly (or\r\nwith `-m`) it is `\"__main__\"`; when another file imports it, it is the\r\nmodule name. So:\r\n\r\n```python\r\nif __name__ == \"__main__\":\r\n    main()\r\n```\r\n\r\nmeans \"run `main()` only when this file is run directly, not when it is\r\nimported\". `main.py` imports `src.tmdb_client`, and thanks to this guard\r\nthe import alone does not call the API. `tmdb_client.py` and `main.py`\r\nboth end with such a block.\r\n\r\n## 15. `argparse`\r\n\r\n`argparse` reads command-line options:\r\n\r\n```python\r\nap = argparse.ArgumentParser()\r\nap.add_argument(\"--fetch\", action=\"store_true\", help=\"call the tmdb api even if the raw file exists\")\r\nargs = ap.parse_args()\r\nif args.fetch or not RAW_PATH.exists():\r\n    save_jsonl(fetch_all())\r\n```\r\n\r\n`action=\"store_true\"` makes `--fetch` a switch: `args.fetch` is `True` if\r\nyou typed it, `False` if not. `python -m src.main --help` prints the help\r\ntext for free.\r\n\r\n## 16. try / except / else / finally, and raising\r\n\r\nFrom `fetch_movie`:\r\n\r\n```python\r\ntry:\r\n    r = session.get(url, params={\"append_to_response\": \"credits\"}, timeout=TIMEOUT)\r\nexcept requests.RequestException as e:\r\n    log.warning(\"movie %s: network error %s (try %d)\", movie_id, e, attempt)\r\nelse:\r\n    if r.status_code == 404:\r\n        ...\r\n```\r\n\r\nFrom `main()`:\r\n\r\n```python\r\ntry:\r\n    charts = run(spark, out)\r\nexcept Exception:\r\n    log.exception(\"pipeline failed, nothing more written\")\r\n    sys.exit(1)\r\nfinally:\r\n    # always give the jvm back, even when a step failed\r\n    spark.stop()\r\n```\r\n\r\n| Block | Runs when |\r\n|---|---|\r\n| `try:` | Always; the risky code goes here |\r\n| `except X as e:` | The `try` raised an error of type `X` |\r\n| `else:` | The `try` did **not** raise |\r\n| `finally:` | Always, last, whether it raised or not. Even `sys.exit(1)` in the `except` runs `finally` first |\r\n\r\nPutting the status checks in `else` rather than inside `try` means a bug\r\nin those checks is not mistaken for a network error. Putting\r\n`spark.stop()` in `finally` means the JVM is always released.\r\n\r\nWays the code stops on purpose:\r\n\r\n- `r.raise_for_status()` raises an `HTTPError` for a 4xx/5xx status.\r\n- `raise SystemExit(\"no TMDB_API_KEY in .env. ...\")` ends the program with\r\n  that message.\r\n- `raise ValueError(\"data checks failed: \" + \"; \".join(problems))` in\r\n  `cleaning.validate`. A test checks it with\r\n  `with pytest.raises(ValueError, match=\"no rows\"):`.\r\n\r\n## 17. Logging\r\n\r\n```python\r\nlog = logging.getLogger(__name__)\r\nlog.warning(\"movie %s: not found, skip it\", movie_id)\r\nlog.info(\"data checks passed on %d rows\", checks[\"rows\"])\r\n```\r\n\r\nThe `%s` and `%d` are filled from the extra arguments.\r\n`logging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s: %(message)s\")`\r\nin the `__main__` blocks decides what gets printed and how. `log.exception`\r\nlogs an error plus the full traceback. Logging is preferred over `print`\r\nbecause you can switch levels without editing every line.\r\n\r\n## 18. Type hints\r\n\r\nEvery function in `src/` and `tests/` says what it takes and what it gives\r\nback:\r\n\r\n```python\r\ndef rank(df: DataFrame, col: str, n: int = 5, ascending: bool = False, where: Column | None = None) -> DataFrame:\r\n```\r\n\r\n- `df: DataFrame` means \"df should be a Spark DataFrame\". `-> DataFrame`\r\n  is the return type.\r\n- `Column | None` means \"a Column or `None`\". `None` is how `where`\r\n  says \"no filter\".\r\n- `list[str]`, `dict[str, DataFrame]`: a list of strings, a dict from\r\n  string keys to DataFrames.\r\n- `Any` (from `typing`) means \"anything\". It is used for values that\r\n  really can be anything, like one movie from the API:\r\n  `Movie = dict[str, Any]` in `tmdb_client.py`. That line is a **type\r\n  alias**: a short name for a longer type.\r\n\r\nPython does **not** check hints when it runs; `rank(df, 42)` still runs and\r\nthen fails inside Spark. The hints are for your editor and for a **type\r\nchecker**. With them, VS Code (Pylance) knows that `rank(...)` returns a\r\nDataFrame, so typing `.` after it lists `filter`, `orderBy`, `show`, ...,\r\nand hovering shows the real types instead of `Unknown`.\r\n\r\nThe project has a `pyrightconfig.json` that turns on **strict** mode, so\r\nany value whose type the checker cannot work out is flagged. To run the\r\nsame check from a terminal:\r\n\r\n```bash\r\npip install pyright pandas-stubs types-requests\r\npyright\r\n```\r\n\r\nIt should print `0 errors`. Two patterns you will see because of it:\r\n\r\n```python\r\nchecks = df.agg(...).first()\r\nassert checks is not None\r\n```\r\n\r\n`.first()` is typed `Row | None` (an empty table has no first row). An\r\n`agg` with no `groupBy` always gives one row, so the `assert` tells the\r\nchecker so. After that line it knows `checks` is a `Row`. Tests use the\r\n`first(df)` helper in `tests/helpers.py` for the same reason.\r\n\r\n```python\r\nout: list[str] = []\r\n```\r\n\r\nAn empty `[]` gives the checker nothing to go on, so the type is written\r\non the variable.\r\n\r\n## Self-check\r\n\r\n1. In `rank(df, col, n=5, ascending=False, where=None)`, what does `rank(df, \"roi\")` give? [Top 5 by ROI, highest first, no extra filter.]\r\n2. Why must you run `python -m src.main` from the project root? [`from src import ...` needs the folder containing `src/` on `sys.path`; `-m` from the root puts it there.]\r\n3. Does the lambda in `F.filter(\"credits.crew\", lambda c: ...)` run once per crew member in Python? [No. It runs once to build a Spark expression; the JVM does the filtering.]\r\n4. What does `Path(__file__).resolve().parents[1]` point to from `src/tmdb_client.py`? [The project root folder.]\r\n5. Why is `spark.stop()` in `finally:`? [It runs whether the pipeline succeeded or failed, so the JVM is always released.]\r\n6. Does Python stop `rank(df, 42)` because `col` is hinted as `str`? [No. Hints are not checked at run time; pyright or VS Code flags it before you run.]\r\n","study/04-tmdb-api-and-fetch.md":"# 04 — The TMDB API and tmdb_client.py (Step 1)\r\n\r\nHow the 18 movies get from TMDB's servers onto your disk. First the web\r\nbasics (requests, status codes, retries), then `src/tmdb_client.py` line\r\nby line, its tests, and what one saved record really looks like.\r\n\r\n> **Help:** Python syntax used here (`try/except/else`, f-strings,\r\n> `load_dotenv`) is in [03 · The Python you need](03-python-you-need.md).\r\n> Setting up the key is in [01 · Setup](01-setup-windows.md#h-5-the-tmdb-key-and-env).\r\n\r\n## 1. REST and HTTP in five minutes\r\n\r\nAn **API** (Application Programming Interface) is a way for one program to\r\nask another for data. A **REST API** does it over the web: each kind of\r\nthing has a URL, and you use **HTTP** (the web's request protocol) to ask\r\nfor it.\r\n\r\nOne HTTP exchange:\r\n\r\n| Part | Example from this lab |\r\n|---|---|\r\n| **Method** | `GET` (read data; the only method this lab uses) |\r\n| **URL** (endpoint) | `https://api.themoviedb.org/3/movie/299534` |\r\n| **Query parameters** | `?api_key=...&append_to_response=credits`, added after `?`, joined by `&` |\r\n| **Response status code** | `200` (a number saying how it went) |\r\n| **Response body** | JSON text describing the movie |\r\n\r\nThe URL is built from a **base URL** plus a path. TMDB's v3 base is\r\n`https://api.themoviedb.org/3`; the movie endpoint is `/movie/{id}`, where\r\n`{id}` is replaced by the movie's number.\r\n\r\n## 2. Authentication with `api_key`\r\n\r\nTMDB needs to know who is asking (to enforce limits and block abuse). The\r\nv3 API accepts your key as a query parameter named `api_key`.\r\n`tmdb_client.py` attaches it to every request once, through the session:\r\n\r\n```python\r\n# one session reuses the tcp connection for all 19 calls. the key goes in\r\n# the session params so it is never part of a url i log.\r\nsession = requests.Session()\r\nsession.params = {\"api_key\": api_key}\r\n```\r\n\r\nA **`requests.Session`** remembers settings (like these default params) and\r\nreuses the network connection between requests, which is faster than\r\nopening a new one 19 times. The URL the code builds and logs is\r\n`f\"{base_url}/movie/{movie_id}\"`, without the key; the session adds the key\r\nonly when sending.\r\n\r\n## 3. `append_to_response=credits`: one call instead of two\r\n\r\nThe spec's final columns include `cast`, `cast_size`, `director` and\r\n`crew_size`. Those are not in the movie details. They live at a second\r\nendpoint, `/movie/{id}/credits`.\r\n\r\nTMDB lets you fold a second endpoint into the first with\r\n`append_to_response`:\r\n\r\n```python\r\nr = session.get(url, params={\"append_to_response\": \"credits\"}, timeout=TIMEOUT)\r\n```\r\n\r\nThe response then has an extra key, `credits`, holding `cast` and `crew`.\r\n\r\n| Approach | Requests for 19 IDs |\r\n|---|---|\r\n| Details + separate credits call | 38 |\r\n| `append_to_response=credits` | **19** |\r\n\r\nHalf the requests, half the chance of hitting a rate limit, and each\r\nmovie's details and credits come from the same moment.\r\n\r\nThe docstring adds a design choice: \"i keep the credits raw here and\r\nflatten them in spark, so the raw file is exactly what the api sent.\" The\r\nclient does no cleaning at all; `cleaning.extract_credits` does it later.\r\n\r\n## 4. Status codes this code handles\r\n\r\nA **status code** is a three-digit number. The first digit is the family:\r\n2xx success, 4xx \"you did something wrong\", 5xx \"the server failed\".\r\n\r\n| Code | Meaning | What `fetch_movie` does | Retry? |\r\n|---|---|---|---|\r\n| **200** | OK, body is the movie | Return `r.json()` | — |\r\n| **401** | Unauthorized: bad or missing key | `r.raise_for_status()` raises `HTTPError`; the run stops | No: a wrong key stays wrong |\r\n| **404** | Not found: no movie with that ID | Log a warning, return `None` (skip) | No |\r\n| **429** | Too many requests: you hit the rate limit | Wait, try again | Yes |\r\n| **500, 502, 503, 504** | Server error or overloaded gateway | Wait, try again | Yes |\r\n| Network error (timeout, no connection) | `requests.RequestException` | Log, wait, try again | Yes |\r\n\r\nThe rule behind the table: **retry only what might succeed next time.** A\r\n429 or a 503 is temporary. A 401 or a 404 will give the same answer\r\nforever, so retrying just wastes time.\r\n\r\nIn this lab's run, ID `0` returned **404** (the code comment says \"id 0\r\nis not a real movie. the brief puts it in to see if the code copes.\"). It\r\nwas skipped, and 18 of 19 movies were saved. `results.md` starts from\r\n\"raw: 18 movies\".\r\n\r\n## 5. Retries with exponential backoff\r\n\r\n**Exponential backoff** means waiting longer after each failure: 2 s, then\r\n4 s, then 8 s. If the server is overloaded, hammering it again\r\nimmediately makes things worse; spacing the attempts out gives it time to\r\nrecover.\r\n\r\n```python\r\n# wait 2s, 4s, 8s. hammering a 429 just gets more 429s.\r\ntime.sleep(2 ** attempt)\r\n```\r\n\r\n`attempt` goes 1, 2, 3, so `2 ** attempt` is 2, 4, 8. After three failed\r\nattempts the function logs an error and returns `None`, so one broken\r\nmovie never kills the whole fetch.\r\n\r\nSeparately, `fetch_all` sleeps `0.1` seconds between movies, which keeps\r\n19 requests well under TMDB's rate limit.\r\n\r\n## 6. Why save the raw JSON first\r\n\r\n`tmdb_client.py` does not clean anything. It saves the API's answers\r\nexactly as received to `data/raw_movies.jsonl`, and Spark starts from that\r\nfile.\r\n\r\n| Reason | What it buys you |\r\n|---|---|\r\n| **Reproducible** | Every later run uses the same 18 records, so `results.md` does not change because TMDB updated a vote count overnight |\r\n| **No re-calling the API** | `python -m src.main` reuses the file when it exists: no key needed, no requests spent. Tests, notebook and charts can rerun freely |\r\n| **Debuggable** | If a cleaned value looks wrong, open the raw line and see what TMDB actually sent |\r\n| **Separation** | Extract (fetch) and transform (clean) are independent steps; a cleaning bug never needs a new download |\r\n\r\nThis is the **raw zone** (or \"bronze layer\") pattern used in real data\r\nplatforms: land the source data untouched, then build cleaned versions\r\nfrom it. `data/README.md` says the same: the raw file is \"one api answer\r\nper line, credits included, nothing changed\".\r\n\r\n**JSON Lines** (`.jsonl`) is plain JSON with one complete object per line.\r\nThe `save_jsonl` docstring gives the Spark reason: \"spark reads json lines\r\nin parallel, a single big json array it can only read as one piece\r\n(multiLine).\"\r\n\r\n## 7. tmdb_client.py line by line\r\n\r\n### Module docstring, imports and constants\r\n\r\n```python\r\n\"\"\"Step 1: get the 19 movie ids from the TMDB api and land them raw on disk.\r\n\r\nthis part is plain python, no spark. 19 http calls do not need a cluster.\r\nspark starts at step 2 when it reads the file this writes.\r\n\"\"\"\r\nimport json\r\nimport logging\r\nimport os\r\nimport time\r\nfrom pathlib import Path\r\n\r\nimport requests\r\nfrom dotenv import load_dotenv\r\n\r\nlog = logging.getLogger(__name__)\r\n\r\n# id 0 is not a real movie. the brief puts it in to see if the code copes.\r\nMOVIE_IDS = [\r\n    0, 299534, 19995, 140607, 299536, 597, 135397,\r\n    420818, 24428, 168259, 99861, 284054, 12445,\r\n    181808, 330457, 351286, 109445, 321612, 260513,\r\n]\r\n\r\nRAW_PATH = Path(__file__).resolve().parents[1] / \"data\" / \"raw_movies.jsonl\"\r\nTIMEOUT = 20\r\nRETRYABLE = {429, 500, 502, 503, 504}\r\n```\r\n\r\n- No Spark import. The API calls are plain Python on the driver machine.\r\n- `RAW_PATH` is computed from this file's location, so it works from any\r\n  current folder. `main.py` imports it: `from src.tmdb_client import RAW_PATH, ...`.\r\n- `RETRYABLE` is a set, so `r.status_code not in RETRYABLE` is a fast,\r\n  readable check.\r\n\r\n### `fetch_movie`: one movie, with retries\r\n\r\n```python\r\ndef fetch_movie(session: requests.Session, base_url: str, movie_id: int, retries: int = 3) -> Movie | None:\r\n    url = f\"{base_url}/movie/{movie_id}\"\r\n    for attempt in range(1, retries + 1):\r\n        try:\r\n            r = session.get(url, params={\"append_to_response\": \"credits\"}, timeout=TIMEOUT)\r\n        except requests.RequestException as e:\r\n            log.warning(\"movie %s: network error %s (try %d)\", movie_id, e, attempt)\r\n        else:\r\n            if r.status_code == 404:\r\n                log.warning(\"movie %s: not found, skip it\", movie_id)\r\n                return None\r\n            if r.status_code not in RETRYABLE:\r\n                # 401 means a bad key. retrying will not fix that so let it fail.\r\n                r.raise_for_status()\r\n                return r.json()\r\n            log.warning(\"movie %s: http %s (try %d)\", movie_id, r.status_code, attempt)\r\n        # wait 2s, 4s, 8s. hammering a 429 just gets more 429s.\r\n        time.sleep(2 ** attempt)\r\n    log.error(\"movie %s: gave up after %d tries\", movie_id, retries)\r\n    return None\r\n```\r\n\r\nWalk through the paths:\r\n\r\n1. `range(1, retries + 1)` gives attempts 1, 2, 3.\r\n2. `timeout=TIMEOUT` (20 s): without a timeout, a stuck connection could\r\n   hang forever.\r\n3. Network error → `except` logs it → falls through to `sleep` → next attempt.\r\n4. 404 → return `None` immediately. No sleep, no retry.\r\n5. Not retryable (200, 401, 403, ...) → `raise_for_status()` does nothing\r\n   for 200 and raises for 4xx/5xx. For 200 the function returns the\r\n   parsed JSON dict.\r\n6. Retryable (429, 5xx) → log, sleep, next attempt.\r\n7. Loop ends without returning → all 3 attempts failed → log error, `None`.\r\n\r\n`session` is a parameter, not created inside. That is what makes the\r\nfunction testable with a fake session (§8).\r\n\r\n### `fetch_all`: the key and the loop\r\n\r\n```python\r\ndef fetch_all(movie_ids: list[int] | None = None) -> list[Movie]:\r\n    load_dotenv()\r\n    api_key = os.getenv(\"TMDB_API_KEY\", \"\")\r\n    base_url = os.getenv(\"TMDB_BASE_URL\", \"https://api.themoviedb.org/3\")\r\n    if movie_ids is None:\r\n        movie_ids = MOVIE_IDS\r\n    if api_key == \"\":\r\n        raise SystemExit(\"no TMDB_API_KEY in .env. copy .env.example to .env and add the key.\")\r\n\r\n    session = requests.Session()\r\n    session.params = {\"api_key\": api_key}\r\n\r\n    out: list[Movie] = []\r\n    for mid in movie_ids:\r\n        m = fetch_movie(session, base_url, mid)\r\n        if m is not None:\r\n            out.append(m)\r\n        time.sleep(0.1)\r\n    log.info(\"fetched %d of %d ids\", len(out), len(movie_ids))\r\n    return out\r\n```\r\n\r\n- **Fail fast** on a missing key, with a message that says how to fix it,\r\n  before any request is made. `os.getenv(\"TMDB_API_KEY\", \"\")` turns \"not\r\n  set\" into `\"\"`, and an unedited `.env.example` line `TMDB_API_KEY=` is\r\n  also `\"\"`, so one check covers both.\r\n- `movie_ids=None` then `MOVIE_IDS`: the default list, but a caller (or a\r\n  test) can pass others.\r\n- Skipped movies (`None`) are not appended. On the real run the log line\r\n  reads \"fetched 18 of 19 ids\".\r\n\r\n### `save_jsonl`: one line per movie, written safely\r\n\r\n```python\r\ndef save_jsonl(records: list[Movie], path: str | Path = RAW_PATH) -> Path:\r\n    \"\"\"One movie per line. spark reads json lines in parallel, a single big\r\n    json array it can only read as one piece (multiLine).\"\"\"\r\n    path = Path(path)\r\n    path.parent.mkdir(parents=True, exist_ok=True)\r\n    # write to a temp file then rename, so a crash halfway never leaves\r\n    # spark a half written file to read\r\n    tmp = path.with_suffix(\".tmp\")\r\n    with open(tmp, \"w\", encoding=\"utf-8\") as f:\r\n        for rec in records:\r\n            f.write(json.dumps(rec, ensure_ascii=False) + \"\\n\")\r\n    os.replace(tmp, path)\r\n    log.info(\"saved %d movies to %s\", len(records), path)\r\n    return path\r\n```\r\n\r\n- `mkdir(parents=True, exist_ok=True)` creates `data/` on a fresh clone.\r\n- **Write then rename.** The lines go to `raw_movies.tmp`; only when all\r\n  are written does `os.replace` rename it to `raw_movies.jsonl`. A rename\r\n  is all-or-nothing, so the real file is either the old complete one or the\r\n  new complete one, never half written. This is called an **atomic write**.\r\n- Mode `\"w\"` overwrites, so re-fetching never appends duplicates.\r\n- `encoding=\"utf-8\"` matters on Windows, where the default encoding is\r\n  cp1252 and cannot store the Japanese, Korean or Hindi language names in\r\n  `spoken_languages`.\r\n\r\n### The `__main__` block\r\n\r\n```python\r\nif __name__ == \"__main__\":\r\n    logging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s: %(message)s\")\r\n    save_jsonl(fetch_all())\r\n```\r\n\r\nLets you run Step 1 alone with `python -m src.tmdb_client`. `main.py` calls\r\nthe same two functions when the raw file is missing or `--fetch` is given:\r\n\r\n```python\r\nif args.fetch or not RAW_PATH.exists():\r\n    save_jsonl(fetch_all())\r\n```\r\n\r\n## 8. How the client is tested without the network\r\n\r\n`tests/test_tmdb_client.py` has 5 tests. None of them calls TMDB. A\r\n`FakeSession` returns a list of status codes, one per call, and counts the\r\ncalls:\r\n\r\n```python\r\nclass FakeSession(requests.Session):\r\n    def __init__(self, statuses: list[int], data: object = None) -> None:\r\n        super().__init__()\r\n        self.statuses = list(statuses)\r\n        self.data = data\r\n        self.calls = 0\r\n\r\n    def get(self, url: str | bytes, **kwargs: Any) -> requests.Response:\r\n        self.calls += 1\r\n        return FakeResponse(self.data, self.statuses.pop(0))\r\n\r\n\r\ndef no_wait(seconds: float) -> None:\r\n    pass\r\n\r\n\r\ndef no_sleep(monkeypatch: pytest.MonkeyPatch) -> None:\r\n    monkeypatch.setattr(tmdb_client.time, \"sleep\", no_wait)\r\n```\r\n\r\n`monkeypatch` is a pytest fixture that swaps something out for one test\r\nonly. Replacing `time.sleep` means the backoff waits (2 + 4 + 8 s) take no\r\ntime in tests.\r\n\r\n| Test | Fake statuses | Proves |\r\n|---|---|---|\r\n| `test_movie_ids_match_lab_spec` | — | 19 IDs, first is `0` |\r\n| `test_404_is_skipped` | `[404]` | Returns `None` |\r\n| `test_429_then_ok_retries` | `[429, 200]` | Returns Titanic; `s.calls == 2` |\r\n| `test_gives_up_after_three_tries` | `[503, 503, 503]` | Returns `None`; `s.calls == 3` |\r\n| `test_save_jsonl_one_movie_per_line` | — | Each line parses back; no `raw.tmp` left behind |\r\n\r\n## 9. What one raw record looks like\r\n\r\nEach line of `data/raw_movies.jsonl` is one movie. TMDB sends 28\r\ntop-level keys; most of the file's size is `credits` (thousands of crew\r\nentries in total). Here is *Avengers: Endgame* (ID 299534), trimmed: long\r\ntext is cut and the `cast`/`crew` lists show one entry each.\r\n\r\n```json\r\n{\r\n  \"adult\": false,\r\n  \"backdrop_path\": \"/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg\",\r\n  \"belongs_to_collection\": {\"id\": 86311, \"name\": \"The Avengers Collection\",\r\n                            \"poster_path\": \"/yFSI...jpg\", \"backdrop_path\": \"/2UNU...jpg\"},\r\n  \"budget\": 356000000,\r\n  \"genres\": [{\"id\": 12, \"name\"
